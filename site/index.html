<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bensinpriser i EU</title>
<style>
  :root {
    --bg: #F7F2E6; --panel: #FDFAF2; --ink: #2B2620; --muted: #6E6558;
    --accent: #2F5A8F; --line: #D8CFBC;
    --q1: #5E8C5A; --q2: #B9B84B; --q3: #D89040; --q4: #B5443C;
    --net: #4E7AA8; --tax: #C05B4D; --ctx: #C9C2B4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.45 "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 14px 20px 10px; border-bottom: 2px solid var(--accent);
    display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: baseline;
  }
  header h1 { font-size: 21px; margin: 0; color: var(--accent); letter-spacing: .3px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .lang { margin-left: auto; }
  nav.tabs { display: flex; gap: 6px; padding: 10px 20px 0; flex-wrap: wrap; }
  nav.tabs button {
    background: var(--panel); border: 1px solid var(--line); border-bottom: none;
    padding: 7px 16px; cursor: pointer; font: inherit; color: var(--ink);
    border-radius: 8px 8px 0 0;
  }
  nav.tabs button.on { background: var(--accent); color: #FDFAF2; border-color: var(--accent); font-weight: 600; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .controls label { font-size: 13px; color: var(--muted); margin-right: 4px; }
  .controls select, .controls button, .controls input[type=checkbox] {
    font: inherit; font-size: 14px; padding: 4px 8px; border: 1px solid var(--line);
    border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer;
  }
  .controls .grp { display: flex; align-items: center; gap: 4px; }
  .controls button.primary { background: var(--accent); color: #FDFAF2; border-color: var(--accent); font-weight: 600; }
  .controls button:disabled { opacity: .45; cursor: not-allowed; }
  #banner {
    display: none; margin: 10px 20px 0; padding: 8px 14px; border-radius: 8px;
    background: #F3E4C2; border: 1px solid #D9BE85; font-size: 14px;
  }
  main { padding: 14px 20px 30px; max-width: 1180px; margin: 0 auto; }
  .view { display: none; }
  .view.on { display: block; }
  .chartbox { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px; }
  .caption { color: var(--muted); font-size: 12.5px; margin: 8px 4px 0; }
  #tooltip {
    position: fixed; display: none; pointer-events: none; z-index: 50;
    background: #FFFDF6; border: 1px solid var(--accent); border-radius: 8px;
    padding: 7px 11px; font-size: 13px; box-shadow: 0 3px 12px rgba(60,45,20,.18);
    max-width: 260px;
  }
  #tooltip b { color: var(--accent); }
  #map3d { width: 100%; height: 560px; border-radius: 8px; overflow: hidden; cursor: grab; }
  #map3d:active { cursor: grabbing; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 8px; font-size: 13px; align-items: center; }
  .legend .sw { display: inline-block; width: 14px; height: 14px; border-radius: 3px; margin-right: 5px; vertical-align: -2px; border: 1px solid rgba(0,0,0,.15); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  .chips .chip {
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    padding: 3px 10px; font-size: 13px;
  }
  .chips .chip b { cursor: pointer; margin-left: 6px; color: var(--tax); }
  .about { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 18px 26px; max-width: 900px; }
  .about h2 { color: var(--accent); font-size: 17px; margin: 20px 0 6px; }
  .about h2:first-child { margin-top: 0; }
  .about p, .about li { font-size: 14.5px; }
  .about code { background: #EFE8D6; padding: 1px 5px; border-radius: 4px; font-size: 13px; }
  footer { padding: 14px 20px 26px; color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--line); margin-top: 20px; }
  svg text { font-family: inherit; }
  .err { color: var(--q4); }
</style>
</head>
<body>

<header>
  <h1 id="t_title"></h1>
  <span class="sub" id="t_sub"></span>
  <span class="lang">
    <button id="langBtn" style="font:inherit;border:1px solid var(--line);border-radius:6px;background:#fff;padding:3px 10px;cursor:pointer"></button>
  </span>
</header>

<nav class="tabs">
  <button data-view="curve" id="tab_curve"></button>
  <button data-view="map" id="tab_map"></button>
  <button data-view="hist" id="tab_hist"></button>
  <button data-view="about" id="tab_about"></button>
</nav>

<div class="controls">
  <span class="grp" id="dateGrp">
    <label id="l_date"></label>
    <button id="datePrev" title="&larr;">&#9664;</button>
    <select id="dateSel"></select>
    <button id="dateNext" title="&rarr;">&#9654;</button>
  </span>
  <span class="grp" id="fuelGrp">
    <label id="l_fuel"></label>
    <select id="fuelSel">
      <option value="petrol"></option>
      <option value="diesel"></option>
    </select>
  </span>
  <span class="grp" id="basisGrp">
    <label id="l_basis"></label>
    <select id="basisSel">
      <option value="nom"></option>
      <option value="ppp"></option>
      <option value="time"></option>
    </select>
  </span>
  <span class="grp" id="colorGrp">
    <label id="l_color"></label>
    <select id="colorSel">
      <option value="quartile"></option>
      <option value="fixed"></option>
      <option value="tax"></option>
    </select>
  </span>
  <span class="grp" id="ctxGrp">
    <input type="checkbox" id="ctxChk" checked>
    <label for="ctxChk" id="l_ctx" style="cursor:pointer"></label>
  </span>
  <span class="grp" id="refGrp">
    <input type="checkbox" id="refChk" checked>
    <label for="refChk" id="l_ref" style="cursor:pointer"></label>
  </span>
  <span class="grp" id="splitGrp" style="display:none">
    <input type="checkbox" id="splitChk">

  </span>
  <button class="primary" id="exportBtn"></button>
</div>

<div id="banner"></div>

<main>
  <section class="view" id="view_curve">
    <div class="chartbox"><div id="curveChart"></div></div>
    <div class="legend" id="curveLegend"></div>
    <p class="caption" id="curveCaption"></p>
  </section>

  <section class="view" id="view_map">
    <div class="chartbox"><div id="map3d"></div></div>
    <div class="legend" id="mapLegend"></div>
    <p class="caption" id="mapCaption"></p>
  </section>

  <section class="view" id="view_hist">
    <div class="chips" id="histChips"></div>
    <div class="chartbox"><div id="histChart"></div></div>
    <div class="legend" id="histLegend"></div>
    <p class="caption" id="histCaption"></p>
  </section>

  </section>
</main>

<div id="tooltip"></div>
<footer id="foot"></footer>

/* =====================================================================
 *  Tillstånd – allt i URL-parametrar (ingen localStorage)
 * ===================================================================== */
const S = {
  lang: 'sv', view: 'curve', date: null, fuel: 'petrol', basis: 'nom',
  color: 'quartile', ctx: true, ref: true, split: false, hist: ['SE'],
};
function readURL() {
  const p = new URLSearchParams(location.search);
  // Kortformer från QR-koden (via hedin.it/r/): d,f,b,c,v,x -> långa namn.
  for (const [short, long] of [['d','date'],['f','fuel'],['b','basis'],
                               ['c','color'],['v','view'],['x','ctx']]) {
    if (p.has(short) && !p.has(long)) p.set(long, p.get(short));
  }
  // Default: webbläsarens språk (svenska → sv, allt annat → en); URL-param vinner.
  S.lang = (navigator.language || 'sv').toLowerCase().startsWith('sv') ? 'sv' : 'en';
  if (['sv','en'].includes(p.get('lang'))) S.lang = p.get('lang');
  if (['curve','map','hist','about'].includes(p.get('view'))) S.view = p.get('view');
  if (/^\d{4}-\d{2}-\d{2}$/.test(p.get('date') || '')) S.date = p.get('date');
  if (['petrol','diesel'].includes(p.get('fuel'))) S.fuel = p.get('fuel');
  if (['nom','ppp','time'].includes(p.get('basis'))) S.basis = p.get('basis');
  if (['quartile','fixed','tax'].includes(p.get('color'))) S.color = p.get('color');
  if (p.get('ctx') === '0') S.ctx = false;
  if (p.get('hist')) S.hist = p.get('hist').split(',').filter(c => META[c]).slice(0, 10);
  if (!S.hist.length) S.hist = ['SE'];
}
function writeURL() {
  const p = new URLSearchParams();
  p.set('lang', S.lang); p.set('view', S.view);
  if (S.date) p.set('date', S.date);
  p.set('fuel', S.fuel); p.set('basis', S.basis); p.set('color', S.color);
  if (!S.ctx) p.set('ctx', '0');
  p.set('hist', S.hist.join(','));
  history.replaceState(null, '', '?' + p.toString());
}
const T = k => I18N[S.lang][k];

/* =====================================================================
 *  Datainläsning: api.php → fallback data/seed.json
 * ===================================================================== */
let SEED_MODE = false, DATES = [], PAYLOADS = {}, LAST_UPDATE = null, GEO = null;

async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
  return r.json();   // kastar även om PHP-källkod levereras som text
}
async function loadInitial() {
  try {
    const latest = await fetchJSON('api.php?action=latest');
    if (!latest.fuels) throw new Error('oväntat svar');
    PAYLOADS[latest.date] = latest;
    LAST_UPDATE = latest.last_update || null;
    const d = await fetchJSON('api.php?action=dates');
    DATES = d.dates || [latest.date];
    if (!S.date || !DATES.includes(S.date)) S.date = latest.date;
  } catch (e) {
    const seed = await fetchJSON('data/seed.json');
    SEED_MODE = true;
    PAYLOADS[seed.date] = seed;
    DATES = [seed.date];
    S.date = seed.date;
  }
  try { GEO = await fetchJSON('data/europe.geojson'); } catch (e) { GEO = null; }
}
async function payloadFor(date) {
  if (PAYLOADS[date]) return PAYLOADS[date];
  const p = await fetchJSON('api.php?action=date&date=' + date);
  PAYLOADS[date] = p;
  return p;
}

/* =====================================================================
 *  Prislogik: justering, sortering, klassning
 * ===================================================================== */
function pliAdj(cc) { return S.basis === 'ppp' ? META.SE.pli / META[cc].pli : 1; }
/** Enhet för värdeaxeln i valt prisläge. */
function unit() { return S.basis === 'time' ? 'min/l' : 'kr/l'; }
/** Justerat värde: nominellt (kr/l), PPP (kr/l) eller tidpris (min arbete/l). */
function adjVal(cc, eur, sek) {
  if (S.basis === 'time') return eur == null ? null : eur * 60 / META[cc].wage;
  if (S.basis === 'ppp')  return sek == null ? null : sek * META.SE.pli / META[cc].pli;
  return sek;
}

/** Radlista för valt datum+bränsle+prisläge: [{cc,tot,net,tax,pop}] sorterad stigande. */
function rowsFor(payload) {
  const f = (payload.fuels || {})[S.fuel] || {};
  const rows = [];
  for (const cc of Object.keys(META)) {
    const e = f[cc];
    if (!e || e.sek == null || e.eur == null) continue;
    const tot = adjVal(cc, e.eur, e.sek);
    const net = adjVal(cc, e.eur_net, e.sek_net);
    rows.push({ cc, tot, net, tax: net != null ? tot - net : null, pop: META[cc].pop });
  }
  rows.sort((a, b) => a.tot - b.tot);
  return rows;
}
function euMeanOf(rows) {
  let w = 0, s = 0;
  for (const r of rows) { w += r.pop; s += r.pop * r.tot; }
  return w ? s / w : null;
}
/** Kvartilbrytpunkter (per land, oviktade – deklarerat i Om-panelen). */
function quartileBreaks(rows) {
  const v = rows.map(r => r.tot);
  const q = p => {
    const i = (v.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
    return v[lo] + (v[hi] - v[lo]) * (i - lo);
  };
  return [q(.25), q(.5), q(.75)];
}
function activeBreaks(rows) {
  if (S.color !== 'fixed') return quartileBreaks(rows);
  return S.basis === 'time' ? SCALE.TIME_BREAKS : SCALE.FIXED_BREAKS;
}
function classOf(tot, breaks) {
  return tot < breaks[0] ? 0 : tot < breaks[1] ? 1 : tot < breaks[2] ? 2 : 3;
}
const fmt = (x, d = 2) => x == null ? '–' : x.toLocaleString(S.lang === 'sv' ? 'sv-SE' : 'en-GB',
  { minimumFractionDigits: d, maximumFractionDigits: d });

/** Signerad area av ring [[x,y],...] (positiv = CCW). */
function ringArea(pts) {
  let a = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % n];
    a += x1 * y2 - x2 * y1;
  }
  return a / 2;
}
/** Kopierar ring, tar bort dubblerad slutpunkt, tvingar orientering. */
function normRing(pts, clockwise) {
  let r = pts.slice();
  const [x0, y0] = r[0], [xn, yn] = r[r.length - 1];
  if (x0 === xn && y0 === yn) r = r.slice(0, -1);
  const cw = ringArea(r) < 0;
  if (cw !== clockwise) r.reverse();
  return r;
}

/* ---- earcut: polygontriangulering med hål ---------------------------
 * Kompakt implementation av Mapbox earcut-algoritmen (ISC-licens,
 * (c) Mapbox; adapterad/inlinad utan z-ordningsoptimering – våra
 * polygoner är små). Indata: platt array [x0,y0,x1,y1,...] +
 * hålstartindex; utdata: triangelindex.                                */

  const hasHoles = holeIndices && holeIndices.length;
  const outerLen = hasHoles ? holeIndices[0] * 2 : data.length;
  let outerNode = ecLinkedList(data, 0, outerLen, true);
  const triangles = [];

  if (hasHoles) outerNode = ecEliminateHoles(data, holeIndices, outerNode);

    sum += (data[j] - data[i]) * (data[i + 1] + data[j + 1]);

    for (let i = start; i < end; i += 2) last = ecInsert(i / 2, data[i], data[i + 1], last);

/** Rätblock [x0,x1]×[y0,y1]×[z0,z1] som 12 trianglar med utåtnormaler. */
function boxSolid(x0, y0, z0, x1, y1, z1) {
  const v = [
    [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0],
    [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1],
  ];
  const f = [
    [0, 2, 1], [0, 3, 2],   // botten (normal -z)
    [4, 5, 6], [4, 6, 7],   // topp (+z)
    [0, 1, 5], [0, 5, 4],   // y0 (-y)
    [2, 3, 7], [2, 7, 6],   // y1 (+y)
    [1, 2, 6], [1, 6, 5],   // x1 (+x)
    [3, 0, 4], [3, 4, 7],   // x0 (-x)
  ];
  return f.map(t => t.map(i => v[i]));
}

/**
 * Extruderar en polygon (ytterring CCW + hål CW, i mm) från z0 till z1.
 * Vattentät solid: earcut-topp, speglad botten, väggar längs alla ringar.
 */
function extrudeSolid(outer, holes, z0, z1) {
  const o = normRing(outer, false);
  const hs = (holes || []).map(h => normRing(h, true)).filter(h => h.length >= 3);
  if (o.length < 3 || z1 <= z0) return null;

  const flat = []; const holeIdx = [];
  for (const [x, y] of o) flat.push(x, y);
  const pts = o.slice();
  for (const h of hs) {
    holeIdx.push(pts.length);
    for (const [x, y] of h) flat.push(x, y);
    pts.push(...h);
  }
  const idx = earcut(flat, holeIdx);
  if (!idx.length) return null;

  const tris = [];
  for (let i = 0; i < idx.length; i += 3) {
    const a = pts[idx[i]], b = pts[idx[i + 1]], c = pts[idx[i + 2]];
    tris.push([[a[0], a[1], z1], [b[0], b[1], z1], [c[0], c[1], z1]]);   // topp +z
    tris.push([[a[0], a[1], z0], [c[0], c[1], z0], [b[0], b[1], z0]]);   // botten -z
  }
  const walls = ring => {
    for (let i = 0, n = ring.length; i < n; i++) {
      const [ax, ay] = ring[i], [bx, by] = ring[(i + 1) % n];
      tris.push([[ax, ay, z0], [bx, by, z0], [bx, by, z1]]);
      tris.push([[ax, ay, z0], [bx, by, z1], [ax, ay, z1]]);
    }
  };
  walls(o); hs.forEach(walls);
  return tris;
}

/** Signerad volym (positiv om normalerna pekar utåt). */
function solidVolume(tris) {
  let v = 0;
  for (const [a, b, c] of tris) {
    v += (a[0] * (b[1] * c[2] - b[2] * c[1])
        + a[1] * (b[2] * c[0] - b[0] * c[2])
        + a[2] * (b[0] * c[1] - b[1] * c[0])) / 6;
  }
  return v;
}
/** Vattentäthet: varje riktad kant ska ha exakt en motriktad partner. */
function solidWatertight(tris) {
  const edges = new Map();
  const key = p => p[0].toFixed(6) + ',' + p[1].toFixed(6) + ',' + p[2].toFixed(6);
  for (const t of tris) {
    for (let i = 0; i < 3; i++) {
      const a = key(t[i]), b = key(t[(i + 1) % 3]);
      const k = a + '|' + b;
      edges.set(k, (edges.get(k) || 0) + 1);
    }
  }
  let bad = 0;
  for (const [k, n] of edges) {
    const [a, b] = k.split('|');
    if (n !== 1 || (edges.get(b + '|' + a) || 0) !== 1) bad++;
  }
  return { ok: bad === 0, bad, edges: edges.size };

/** Binär STL av en eller flera solider (lista av triangel-listor). */
function stlBinary(solids, headerText) {
  const tris = [];
  for (const s of solids) for (const t of s) tris.push(t);
  const buf = new ArrayBuffer(84 + tris.length * 50);
  const dv = new DataView(buf);
  const hdr = (headerText || 'bensin-eu STL').slice(0, 79);
  for (let i = 0; i < hdr.length; i++) dv.setUint8(i, hdr.charCodeAt(i) & 0x7F);
  dv.setUint32(80, tris.length, true);
  let o = 84;
  for (const [a, b, c] of tris) {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
    const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
    const len = Math.hypot(nx, ny, nz) || 1;
    nx /= len; ny /= len; nz /= len;
    dv.setFloat32(o, nx, true); dv.setFloat32(o + 4, ny, true); dv.setFloat32(o + 8, nz, true);
    o += 12;
    for (const p of [a, b, c]) {
      dv.setFloat32(o, p[0], true); dv.setFloat32(o + 4, p[1], true); dv.setFloat32(o + 8, p[2], true);
      o += 12;
    }
    dv.setUint16(o, 0, true); o += 2;
  }
  return buf;
}

/** Ekvirektangulär projektion (D5): x = lon·cos52°·k, y = lat·k [mm]. */
function projectLonLat(lon, lat, k, cos52) {
  return [lon * cos52 * k, lat * k];
}

/**
 * Kartsolider. features: geojson-features med properties.cc/.role.
 * opts: { k, cos52, minArea, segmentsFor(cc) -> [{group,z0,z1}] | null,
 *         ctx: bool, ctxHeight, plate: bool, plateMm }
 * Returnerar [{group, cc, tris}]. Nollplan: basplattans ovansida (z=0).
 */
function buildMapSolids(features, opts) {
  const out = [];
  let bbox = [Infinity, Infinity, -Infinity, -Infinity];
  const projRings = poly => poly.map(ring =>
    ring.map(([lon, lat]) => projectLonLat(lon, lat, opts.k, opts.cos52)));

  for (const f of features) {
    const cc = f.properties.cc, role = f.properties.role;
    const polys = f.geometry.type === 'Polygon'
      ? [f.geometry.coordinates] : f.geometry.coordinates;
    let segs = null;
    if (role === 'eu') { segs = opts.segmentsFor(cc); }
    else if (role === 'ctx') { if (!opts.ctx) continue; segs = [{ group: 'ctx', z0: 0, z1: opts.ctxHeight }]; }
    if (!segs || !segs.length) continue;

    for (const poly of polys) {
      const rings = projRings(poly);
      const outer = rings[0];
      if (Math.abs(ringArea(normRing(outer, false))) < opts.minArea) continue;
      for (const [x, y] of outer) {
        bbox = [Math.min(bbox[0], x), Math.min(bbox[1], y),
                Math.max(bbox[2], x), Math.max(bbox[3], y)];
      }
      for (const seg of segs) {
        const tris = extrudeSolid(outer, rings.slice(1), seg.z0, seg.z1);
        if (tris) out.push({ group: seg.group, cc, tris });
      }
    }
  }
  if (opts.plate && isFinite(bbox[0])) {
    const m = 3;   // marginal runt yttersta geometrin
    out.push({ group: 'plate', cc: null,
      tris: boxSolid(bbox[0] - m, bbox[1] - m, -opts.plateMm, bbox[2] + m, bbox[3] + m, 0) });
  }
  out.bbox = bbox;
  return out;
}

/**
 * Kurvsolider. items: [{cc, widthMm, segments:[{group,z0,z1}]}] i ordning.
 * depth: remsans djup i mm. Varje landsegment är en egen vattentät låda;
 * intilliggande lådor delar vägg och skrivs ut som en sammanhängande remsa.
 */
function buildCurveSolids(items, depth) {
  const out = [];
  let x = 0;
  for (const it of items) {
    for (const seg of it.segments) {
      if (seg.z1 <= seg.z0) continue;
      out.push({ group: seg.group, cc: it.cc,
                 tris: boxSolid(x, 0, seg.z0, x + it.widthMm, depth, seg.z1) });
    }
    x += it.widthMm;
  }
  out.totalWidth = x;
  return out;
}

/** Text -> rektanglar (radvis sammanslagna pixelkörningar), origo nere-vänster. */
function textRects(text, px) {
  const rects = []; let cx = 0;
  const norm = text.toUpperCase()
    .replace(/[ÅÄ]/g, 'A').replace(/Ö/g, 'O').replace(/É/g, 'E');
  for (const ch of norm) {
    const g = FONT57[ch] || FONT57[' '];
    for (let row = 0; row < 7; row++) {
      let run = -1;
      for (let col = 0; col <= 5; col++) {
        const on = col < 5 && ((g[row] >> (4 - col)) & 1);
        if (on && run < 0) run = col;
        if (!on && run >= 0) {
          rects.push({ x0: cx + run * px, x1: cx + col * px,
                       y0: (6 - row) * px, y1: (7 - row) * px });
          run = -1;
        }
      }
    }
    cx += 6 * px;
  }
  return { rects, w: Math.max(0, cx - px), h: 7 * px };
}

/**
 * QR-kod (byte-läge, ECC-nivå L, mask 0, version 1–4 = upp till 78 tecken).
 * Egen implementation utan beroenden; layout enligt ISO/IEC 18004.
 * Returnerar {size, get(x,y)} där rad 0 = överst.
 */
function qrMatrix(text) {
  const bytes = [];
  for (const ch of text) {
    const c = ch.codePointAt(0);
    if (c > 255) throw new Error('QR: endast Latin-1-tecken');
    bytes.push(c);
  }
  const CAP = { 1: [26, 19], 2: [44, 34], 3: [70, 55], 4: [100, 80] };
  let ver = 0;
  for (const v of [1, 2, 3, 4]) if (bytes.length <= CAP[v][1] - 2) { ver = v; break; }
  if (!ver) throw new Error('QR: texten är för lång (' + bytes.length + ' tecken)');
  const [total, dataLen] = CAP[ver], eccLen = total - dataLen;

  // Bitström: 0100 | längd (8 bitar) | data | terminator | pad-bytes
  const bits = [];
  const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(4, 4); push(bytes.length, 8);
  for (const b of bytes) push(b, 8);
  push(0, Math.min(4, dataLen * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) {
    let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
    data.push(b);
  }
  const PAD = [0xEC, 0x11];
  for (let i = 0; data.length < dataLen; i ^= 1) data.push(PAD[i]);

  // Reed-Solomon över GF(256), reduktionspolynom 0x11D (en block-grupp v1–4/L)
  const EXP = new Array(512), LOG = new Array(256);
  for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
  let gen = [1];
  for (let i = 0; i < eccLen; i++) {
    const q = [1, EXP[i]], r = new Array(gen.length + 1).fill(0);
    for (let a = 0; a < gen.length; a++) for (let b = 0; b < 2; b++) r[a + b] ^= mul(gen[a], q[b]);
    gen = r;
  }
  const rem = data.concat(new Array(eccLen).fill(0));
  for (let i = 0; i < dataLen; i++) {
    const f = rem[i];
    if (f) for (let j = 0; j < gen.length; j++) rem[i + j] ^= mul(gen[j], f);
  }
  const cw = data.concat(rem.slice(dataLen));

  // Matris
  const size = 17 + 4 * ver;
  const M = Array.from({ length: size }, () => new Array(size).fill(null));
  const set = (x, y, v) => { M[y][x] = v; };
  const finder = (fx, fy) => {
    for (let y = -1; y <= 7; y++) for (let x = -1; x <= 7; x++) {
      const gx = fx + x, gy = fy + y;
      if (gx < 0 || gx >= size || gy < 0 || gy >= size) continue;
      const inC = x >= 0 && x <= 6 && y >= 0 && y <= 6;
      set(gx, gy, inC && (x === 0 || x === 6 || y === 0 || y === 6 ||
                          (x >= 2 && x <= 4 && y >= 2 && y <= 4)) ? 1 : 0);
    }
  };
  finder(0, 0); finder(size - 7, 0); finder(0, size - 7);
  for (let i = 8; i < size - 8; i++) {
    if (M[6][i] === null) M[6][i] = i % 2 === 0 ? 1 : 0;
    if (M[i][6] === null) M[i][6] = i % 2 === 0 ? 1 : 0;
  }
  if (ver >= 2) {   // ett justeringsmönster, centrum (size-7, size-7)
    const c = size - 7;
    for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++)
      set(c + x, c + y, Math.max(Math.abs(x), Math.abs(y)) !== 1 ? 1 : 0);
  }
  // Formatinformation: ECC L (01), mask 0 -> BCH(15,5) + XOR-maskering
  const fmt = (0b01 << 3) | 0;
  let bch = fmt;
  for (let i = 0; i < 10; i++) bch = (bch << 1) ^ ((bch >> 9) * 0x537);
  const fbits = ((fmt << 10) | bch) ^ 0x5412;
  const fbit = i => (fbits >> i) & 1;
  for (let i = 0; i <= 5; i++) set(8, i, fbit(i));
  set(8, 7, fbit(6)); set(8, 8, fbit(7)); set(7, 8, fbit(8));
  for (let i = 9; i < 15; i++) set(14 - i, 8, fbit(i));
  for (let i = 0; i < 8; i++) set(size - 1 - i, 8, fbit(i));
  for (let i = 8; i < 15; i++) set(8, size - 15 + i, fbit(i));
  set(8, size - 8, 1);   // mörk modul
  // Datautplacering (sicksack) + mask 0
  let bi = 0; const totalBits = cw.length * 8;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const x = right - j;
        const upward = ((right + 1) & 2) === 0;
        const y = upward ? size - 1 - vert : vert;
        if (M[y][x] !== null) continue;
        let bit = 0;
        if (bi < totalBits) { bit = (cw[bi >> 3] >> (7 - (bi & 7))) & 1; bi++; }
        if ((x + y) % 2 === 0) bit ^= 1;   // mask 0
        M[y][x] = bit;
      }
    }
  }
  return { size, version: ver, get: (x, y) => M[y][x] === 1 };
}

/** QR-matris -> radvis sammanslagna rektanglar; rad 0 hamnar överst (y-max). */
function matrixRects(q, m) {
  const rects = [];
  for (let row = 0; row < q.size; row++) {
    let run = -1;
    for (let col = 0; col <= q.size; col++) {
      const on = col < q.size && q.get(col, row);
      if (on && run < 0) run = col;
      if (!on && run >= 0) {
        rects.push({ x0: run * m, x1: col * m,
                     y0: (q.size - 1 - row) * m, y1: (q.size - row) * m });
        run = -1;
      }
    }
  }
  return rects;
}

/**
 * Rektangulär panel [x0,x1]x[y0,y1]x[z0,z1] med rektangulära hål
 * (används för graverad undersida: hålen är textpixlarna). Bandsvep:
 * varje delbox är en egen vattentät solid. Hålen får inte överlappa.
 */
function panelBoxes(x0, y0, x1, y1, z0, z1, holes) {
  const eps = 1e-9, out = [];
  const ys = new Set([y0, y1]);
  for (const h of holes) if (h.y1 > y0 + eps && h.y0 < y1 - eps) {
    ys.add(Math.max(y0, h.y0)); ys.add(Math.min(y1, h.y1));
  }
  const yl = [...ys].sort((a, b) => a - b);
  for (let i = 0; i < yl.length - 1; i++) {
    const ya = yl[i], yb = yl[i + 1];
    if (yb - ya < eps) continue;
    const iv = holes
      .filter(h => h.y0 <= ya + eps && h.y1 >= yb - eps && h.x1 > x0 + eps && h.x0 < x1 - eps)
      .map(h => [Math.max(x0, h.x0), Math.min(x1, h.x1)])
      .sort((a, b) => a[0] - b[0]);
    let cur = x0;
    for (const [hx0, hx1] of iv) {
      if (hx0 > cur + eps) out.push(boxSolid(cur, ya, z0, hx0, yb, z1));
      cur = Math.max(cur, hx1);
    }
    if (x1 > cur + eps) out.push(boxSolid(cur, ya, z0, x1, yb, z1));
  }
  return out;
}

/**
 * Basplatta med etikett: upphöjd titel + QR på ovansidan (grupp 'text',
 * egen STL i kontrastfärg) och graverad, x-speglad text i undersidan
 * (läsbar när objektet vänds). Plattan = övre skiva + bottenskikt med hål.
 * cfg: {px0,py0,px1,py1, plateMm, raiseMm, engraveMm,
 *       title:{lines,pixel,x,y}|null, qr:{text,module,x,y}|null,
 *       under:{lines,pixel,x,y}|null}
 */
function labelAndPlate(cfg) {
  const out = []; let qrSize = 0;
  if (cfg.title) {
    let ty = cfg.title.y;
    for (const line of [...cfg.title.lines].reverse()) {
      for (const r of textRects(line, cfg.title.pixel).rects) {
        out.push({ group: 'text', cc: null,
          tris: boxSolid(cfg.title.x + r.x0, ty + r.y0, 0,
                         cfg.title.x + r.x1, ty + r.y1, cfg.raiseMm) });
      }
      ty += cfg.title.pixel * 9;
    }
  }
  if (cfg.qr) {
    const q = qrMatrix(cfg.qr.text);
    qrSize = q.size * cfg.qr.module;
    for (const r of matrixRects(q, cfg.qr.module)) {
      out.push({ group: 'text', cc: null,
        tris: boxSolid(cfg.qr.x + r.x0, cfg.qr.y + r.y0, 0,
                       cfg.qr.x + r.x1, cfg.qr.y + r.y1, cfg.raiseMm) });
    }
  }
  const holes = [];
  if (cfg.under) {
    let uy = cfg.under.y;
    for (const line of [...cfg.under.lines].reverse()) {
      for (const r of textRects(line, cfg.under.pixel).rects) {
        holes.push({ x0: cfg.px0 + cfg.px1 - (cfg.under.x + r.x1),
                     x1: cfg.px0 + cfg.px1 - (cfg.under.x + r.x0),
                     y0: uy + r.y0, y1: uy + r.y1 });
      }
      uy += cfg.under.pixel * 9;
    }
  }
  const zSplit = -cfg.plateMm + cfg.engraveMm;
  out.push({ group: 'plate', cc: null,
             tris: boxSolid(cfg.px0, cfg.py0, zSplit, cfg.px1, cfg.py1, 0) });
  for (const tris of panelBoxes(cfg.px0, cfg.py0, cfg.px1, cfg.py1,
                                -cfg.plateMm, zSplit, holes)) {
    out.push({ group: 'plate', cc: null, tris });
  }
  return { solids: out, qrSize };
}

/* =====================================================================
 *  ZIP-skrivare (utan komprimering) – en nedladdning per export.
 *  Ingår i kärnblocket så att test/stl_check.js kan verifiera arkivet
 *  med en riktig unzip.
 * ===================================================================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {   // files: [{name, data:Uint8Array}]
  const chunks = [], central = [];
  let offset = 0;
  const enc = new TextEncoder();
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);     // UTF-8-flagga
    lh.setUint16(8, 0, true);          // store
    lh.setUint32(14, crc, true); lh.setUint32(18, n, true); lh.setUint32(22, n, true);
    lh.setUint16(26, name.length, true);
    chunks.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, n, true); ch.setUint32(24, n, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + n;
  }
  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}

/* =====================================================================
 *  Gemensam geometribeskrivning för aktuell vy (WYSIWYG-kontraktet):
 *  exakt samma segment/grupper används av SVG-kurvan, 3D-kartan och STL.
 * ===================================================================== */
function segmentsForRow(row, breaks) {
  if (S.color === 'tax' && row.net != null) {
    return [{ group: 'net', z0: 0, z1: row.net }, { group: 'tax', z0: row.net, z1: row.tot }];
  }
  if (S.color === 'tax') return [{ group: 'net', z0: 0, z1: row.tot }];
  return [{ group: 'q' + classOf(row.tot, breaks), z0: 0, z1: row.tot }];
}
function groupColor(g) {
  if (g === 'net') return COLORS.net;
  if (g === 'tax') return COLORS.tax;
  if (g === 'ctx') return COLORS.ctx;
  if (g === 'plate') return COLORS.plate;
  if (g === 'ref') return COLORS.ref;
  if (g === 'text') return COLORS.text;
  return COLORS.q[+g.slice(1)];
}
function groupLabels(breaks) {
  if (S.color === 'tax') return { net: T('net_part'), tax: T('tax_part') };
  const lbl = S.color === 'fixed'
    ? I18N[S.lang].fixed_lbl(S.basis === 'time' ? SCALE.TIME_BREAKS : SCALE.FIXED_BREAKS, unit())
    : T('quartile_lbl').map((l, i) => `${l} ${i === 0 ? '< ' + fmt(breaks[0]) : i === 3 ? '≥ ' + fmt(breaks[2]) : fmt(breaks[i - 1]) + '–' + fmt(breaks[i])}`);
  return { q0: lbl[0], q1: lbl[1], q2: lbl[2], q3: lbl[3] };
}

function renderCurve(payload) {
  const el = document.getElementById('curveChart');
  const rows = rowsFor(payload);
  if (!rows.length) { el.innerHTML = `<p class="err">${T('no_data')}</p>`; return; }
  const breaks = activeBreaks(rows);
  const mean = euMeanOf(rows);
  const totalPop = rows.reduce((s, r) => s + r.pop, 0);

  const W = 1000, H = 560, ML = 62, MR = 14, MT = 18, MB = 46;
  const pw = W - ML - MR, ph = H - MT - MB;
  const maxY = Math.max(10, Math.ceil(Math.max(...rows.map(r => r.tot)) * 1.08));
  const yPix = v => MT + ph - v / maxY * ph;

  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  for (let v = 0; v <= maxY; v += maxY > 30 ? 5 : 2) {
    s += `<line x1="${ML}" y1="${yPix(v)}" x2="${W - MR}" y2="${yPix(v)}" stroke="#E5DCC8" stroke-width="1"/>`;
    s += `<text x="${ML - 8}" y="${yPix(v) + 4}" text-anchor="end" font-size="12" fill="#6E6558">${v}</text>`;
  }
  s += `<text x="14" y="${MT + 10}" font-size="12" fill="#6E6558" transform="rotate(-90 14 ${MT + 10})" text-anchor="end">${unit()}</text>`;

  let x = ML;
  const bars = [];
  rows.forEach((r, i) => {
    const w = r.pop / totalPop * pw;
    for (const seg of segmentsForRow(r, breaks)) {
      s += `<rect data-i="${i}" x="${x.toFixed(2)}" y="${yPix(seg.z1).toFixed(2)}" width="${Math.max(w, 0.6).toFixed(2)}" height="${(yPix(seg.z0) - yPix(seg.z1)).toFixed(2)}" fill="${groupColor(seg.group)}" stroke="#F7F2E6" stroke-width="0.5"/>`;
    }
    if (w > 16) s += `<text x="${(x + w / 2).toFixed(1)}" y="${(yPix(r.tot) - 5).toFixed(1)}" text-anchor="middle" font-size="11" fill="#2B2620">${r.cc}</text>`;
    bars.push({ x0: x, x1: x + w, row: r });
    x += w;
  });
  s += `<line x1="${ML}" y1="${yPix(mean)}" x2="${W - MR}" y2="${yPix(mean)}" stroke="#2F5A8F" stroke-width="2" stroke-dasharray="8 5"/>`;
  s += `<text x="${W - MR - 4}" y="${yPix(mean) - 6}" text-anchor="end" font-size="12.5" fill="#2F5A8F" font-weight="600">${T('eu_mean')}: ${fmt(mean)} ${unit()}</text>`;
  s += `<line x1="${ML}" y1="${MT + ph}" x2="${W - MR}" y2="${MT + ph}" stroke="#2B2620" stroke-width="1.5"/>`;
  s += `<text x="${ML}" y="${H - 14}" font-size="12" fill="#6E6558">0</text>`;
  s += `<text x="${W - MR}" y="${H - 14}" text-anchor="end" font-size="12" fill="#6E6558">${Math.round(totalPop / 1e6)} ${T('milj')} (${Math.round(totalPop / SCALE.POP_PER_MM)} mm)</text>`;
  s += `<text x="${(ML + W - MR) / 2}" y="${H - 14}" text-anchor="middle" font-size="12" fill="#6E6558">${S.lang === 'sv' ? 'kumulativ befolkning' : 'cumulative population'}</text>`;
  s += '</svg>';
  el.innerHTML = s;

  const svg = el.firstChild;

const MAP = { renderer: null, scene: null, camera: null, meshes: [], az: 0, el: 0.9, R: 380,
              center: [0, 0], dragging: false, moved: 0, lastXY: null, raycaster: null, hoverCC: null };

/** Digital tvilling-URL för QR (via hedin.it:s r/-redirect, ompekbar). */

/** Gemensamma textrader för etikettband och undersida (ASCII, versaler). */
function labelTexts(view) {

function mapSolidsForState(payload) {
  const rows = rowsFor(payload);
  const breaks = activeBreaks(rows);
  const byCC = {};
  rows.forEach(r => byCC[r.cc] = r);
  const solids = buildMapSolids(GEO.features, {
    k: SCALE.MAP_K, cos52: SCALE.COS52, minArea: SCALE.MIN_AREA_MM2,
    ctx: S.ctx, ctxHeight: SCALE.CTX_MM, plate: false, plateMm: SCALE.PLATE_MM,
    segmentsFor: cc => byCC[cc] ? segmentsForRow(byCC[cc], breaks) : null,
  });
  // Basplatta med etikettband under kartan: upphöjd titel + QR, graverad undersida.
  const bb = solids.bbox;
  const m = 3, band = SCALE.LABEL_BAND;
  const px0 = bb[0] - m, px1 = bb[2] + m, py1 = bb[3] + m, py0 = bb[1] - m - band;
  const txt = labelTexts('map');
  const qrSide = 33 * SCALE.QR_MODULE;   // v4 räcker för tvilling-URL:en
  const lp = labelAndPlate({
    px0, py0, px1, py1, plateMm: SCALE.PLATE_MM,
    raiseMm: SCALE.TEXT_RAISE, engraveMm: SCALE.TEXT_ENGRAVE,
    title: { lines: txt.title, pixel: SCALE.TEXT_PIXEL, x: px0 + 5, y: py0 + 5 },
    qr: { text: txt.qr, module: SCALE.QR_MODULE, x: px1 - 5 - qrSide, y: py0 + 4 },
    under: { lines: txt.under, pixel: SCALE.UNDER_PIXEL, x: px0 + 8, y: py0 + 8 },
  });
  const all = solids.concat(lp.solids);
  all.bbox = [px0, py0, px1, py1];
  return all;
}

function initMap() {
  if (MAP.renderer || typeof THREE === 'undefined') return;
  const box = document.getElementById('map3d');
  MAP.renderer = new THREE.WebGLRenderer({ antialias: true });
  MAP.renderer.setPixelRatio(devicePixelRatio);
  MAP.renderer.setClearColor(0xF7F2E6);
  box.appendChild(MAP.renderer.domElement);
  MAP.scene = new THREE.Scene();
  MAP.camera = new THREE.PerspectiveCamera(40, 1, 1, 5000);
  MAP.scene.add(new THREE.AmbientLight(0xFFFFFF, 0.65));
  const sun = new THREE.DirectionalLight(0xFFF4DC, 0.75);
  sun.position.set(200, -300, 500);
  MAP.scene.add(sun);
  MAP.raycaster = new THREE.Raycaster();

  const el = MAP.renderer.domElement;
  el.addEventListener('pointerdown', ev => {
    MAP.dragging = true; MAP.moved = 0; MAP.lastXY = [ev.clientX, ev.clientY];
    el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener('pointermove', ev => {
    if (MAP.dragging) {
      const dx = ev.clientX - MAP.lastXY[0], dy = ev.clientY - MAP.lastXY[1];
      MAP.moved += Math.abs(dx) + Math.abs(dy);
      // "Skivtallriksrotation": vrid som vinkeländring runt kartcentrums
      // skärmposition, så att den greppade punkten följer handen – att dra
      // främre kanten åt höger vrider då åt motsatt håll mot bakre kanten.
      const [cx, cy] = mapCenterOnScreen();
      const a0 = Math.atan2(MAP.lastXY[1] - cy, MAP.lastXY[0] - cx);
      const a1 = Math.atan2(ev.clientY - cy, ev.clientX - cx);
      let da = a1 - a0;
      if (da > Math.PI) da -= 2 * Math.PI;
      if (da < -Math.PI) da += 2 * Math.PI;
      const rad = Math.hypot(ev.clientX - cx, ev.clientY - cy);
      if (rad > 40) MAP.az += da;   // nära centrum: bara tilt (vinkeln är instabil där)
      MAP.el = Math.min(1.45, Math.max(0.15, MAP.el + dy * 0.006));
      MAP.lastXY = [ev.clientX, ev.clientY];
      placeCamera(); drawMap();
    } else {
      hoverMap(ev);
    }
  });
  el.addEventListener('pointerup', ev => {
    MAP.dragging = false;
    if (MAP.moved < 6) clickMap(ev);
  });
  el.addEventListener('wheel', ev => {
    ev.preventDefault();
    MAP.R = Math.min(1500, Math.max(120, MAP.R * (1 + ev.deltaY * 0.0012)));
    placeCamera(); drawMap();
  }, { passive: false });
  el.addEventListener('pointerleave', () => { hideTip(); setHover(null); });
  addEventListener('resize', sizeMap);
}
function sizeMap() {
  if (!MAP.renderer) return;
  const box = document.getElementById('map3d');
  const w = box.clientWidth || 800, h = box.clientHeight || 560;
  MAP.renderer.setSize(w, h);
  MAP.camera.aspect = w / h;
  MAP.camera.updateProjectionMatrix();
  drawMap();
}
function mapCenterOnScreen() {
  const v = new THREE.Vector3(MAP.center[0], MAP.center[1], 0).project(MAP.camera);
  const r = MAP.renderer.domElement.getBoundingClientRect();
  return [(v.x + 1) / 2 * r.width + r.left, (1 - v.y) / 2 * r.height + r.top];
}
function placeCamera() {
  const [cx, cy] = MAP.center;
  MAP.camera.position.set(
    cx + MAP.R * Math.cos(MAP.el) * Math.sin(MAP.az),
    cy - MAP.R * Math.cos(MAP.el) * Math.cos(MAP.az),
    MAP.R * Math.sin(MAP.el));
  MAP.camera.up.set(0, 0, 1);
  MAP.camera.lookAt(cx, cy, 0);
}
function meshFromTris(trisList, color) {
  let n = 0;
  for (const t of trisList) n += t.length;
  const pos = new Float32Array(n * 9);
  let o = 0;
  for (const tris of trisList) for (const t of tris) for (const p of t) {
    pos[o++] = p[0]; pos[o++] = p[1]; pos[o++] = p[2];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  const m = new THREE.MeshLambertMaterial({ color });
  return new THREE.Mesh(g, m);
}
function renderMap(payload) {
  const box = document.getElementById('map3d');
  if (typeof THREE === 'undefined') {
    box.innerHTML = `<p class="err" style="padding:20px">Three.js (cdnjs) kunde inte laddas – kartvyn kräver nätåtkomst till cdnjs.cloudflare.com.</p>`;
    return;
  }
  if (!GEO) {
    box.innerHTML = `<p class="err" style="padding:20px">data/europe.geojson kunde inte läsas (kräver att sidan serveras via http).</p>`;
    return;
  }
  initMap();
  for (const m of MAP.meshes) { MAP.scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  MAP.meshes = [];

  const solids = mapSolidsForState(payload);
  const rows = rowsFor(payload); const byCC = {};
  rows.forEach(r => byCC[r.cc] = r);

  // Ett mesh per (land, grupp) för hover/klick; platta+kontext egna mesh.
  const grouped = new Map();
  for (const s of solids) {
    const k = (s.cc || '·') + '|' + s.group;
    if (!grouped.has(k)) grouped.set(k, { cc: s.cc, group: s.group, tris: [] });
    grouped.get(k).tris.push(s.tris);
  }
  const bb = solids.bbox;
  MAP.center = [(bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2];
  for (const { cc, group, tris } of grouped.values()) {
    const mesh = meshFromTris(tris, groupColor(group));
    mesh.userData = { cc, group };
    MAP.scene.add(mesh);
    MAP.meshes.push(mesh);
  }
  placeCamera(); sizeMap();
  renderLegend('mapLegend', activeBreaks(rows), true);
  document.getElementById('mapCaption').innerHTML =
    T('map_caption') + (S.basis === 'ppp' ? '<br>' + T('ppp_note')
                      : S.basis === 'time' ? '<br>' + T('time_note') : '');
}
function drawMap() {
  if (MAP.renderer) MAP.renderer.render(MAP.scene, MAP.camera);
}
function pickMap(ev) {
  const r = MAP.renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((ev.clientX - r.left) / r.width) * 2 - 1,
    -((ev.clientY - r.top) / r.height) * 2 + 1);
  MAP.raycaster.setFromCamera(ndc, MAP.camera);
  const hits = MAP.raycaster.intersectObjects(MAP.meshes);
  return hits.length ? hits[0].object.userData : null;
}
function setHover(cc) {
  if (MAP.hoverCC === cc) return;
  MAP.hoverCC = cc;
  for (const m of MAP.meshes) {
    const on = cc && m.userData.cc === cc;
    m.material.emissive = new THREE.Color(on ? 0x333311 : 0x000000);
  }
  drawMap();
}
function hoverMap(ev) {
  const hit = pickMap(ev);
  if (hit && hit.cc && META[hit.cc]) {
    setHover(hit.cc);
    const payload = PAYLOADS[S.date];
    const rows = rowsFor(payload);
    const r = rows.find(x => x.cc === hit.cc);
    if (r) {
      const eNom = (payload.fuels[S.fuel] || {})[hit.cc] || {};
      showTip(`<b>${META[hit.cc][S.lang]}</b><br>${T('tt_price')}: ${fmt(r.tot)} ${unit()} ` +
        (S.basis === 'time' ? `(${fmt(eNom.sek)} kr/l)` : `(${fmt(eNom.eur, 3)} €/l)`) +
        (r.net != null ? `<br>${T('tt_net')}: ${fmt(r.net)} · ${T('tt_tax')}: ${fmt(r.tax)} ${unit()}` : ''), ev);
    } else {
      showTip(`<b>${META[hit.cc][S.lang]}</b><br>${T('tt_no_data')}`, ev);
    }
  } else {
    setHover(null); hideTip();
  }
}
function clickMap(ev) {
  const hit = pickMap(ev);
  if (hit && hit.cc && META[hit.cc] && !S.hist.includes(hit.cc)) {
    S.hist.push(hit.cc);
    writeURL();
    SERIES_CACHE = {};   // enklast: ladda om serier vid nästa historikvisning
    const note = document.createElement('div');
    note.textContent = T('added_to_hist').replace('{name}', META[hit.cc][S.lang]);
    note.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2F5A8F;color:#FDFAF2;padding:8px 18px;border-radius:8px;z-index:60';
    document.body.appendChild(note);
    setTimeout(() => note.remove(), 1800);
  }
}

let SERIES_CACHE = {};
const HIST_PALETTE = ['#2F5A8F', '#B5443C', '#5E8C5A', '#D89040', '#7A5CA0',
                      '#3E8E8B', '#A5563C', '#889046', '#B0699E', '#556677'];

async function renderHist() {
  const chips = document.getElementById('histChips');
  const el = document.getElementById('histChart');
  // Tidpris kräver lönehistorik – historiken faller tillbaka på nominella kr/l.
  const noTime = S.basis === 'time';
  document.getElementById('histCaption').innerHTML =
    T('hist_caption') + (S.basis === 'ppp' ? '<br>' + T('ppp_note') : '') +
    (noTime ? '<br><strong>' + T('hist_no_time') + '</strong>' : '');
  if (SEED_MODE) {
    chips.innerHTML = '';
    el.innerHTML = `<p class="err">${T('hist_needs_api')}</p>`;
    return;
  }
  // chips + lägg-till-väljare
  let h = '';
  S.hist.forEach((cc, i) => {
    h += `<span class="chip" style="border-color:${HIST_PALETTE[i % 10]}">` +
         `<span class="sw" style="background:${HIST_PALETTE[i % 10]}"></span>${META[cc][S.lang]}` +
         `<b data-cc="${cc}" title="×">×</b></span>`;
  });
  h += `<select id="histAdd"><option value="">${T('hist_add')}</option>` +
    Object.keys(META).filter(c => !S.hist.includes(c))
      .sort((a, b) => META[a][S.lang].localeCompare(META[b][S.lang]))
      .map(c => `<option value="${c}">${META[c][S.lang]}</option>`).join('') + '</select>';
  chips.innerHTML = h;
  chips.querySelectorAll('.chip b').forEach(b => b.onclick = () => {
    S.hist = S.hist.filter(c => c !== b.dataset.cc);
    if (!S.hist.length) S.hist = ['SE'];
    writeURL(); renderHist();
  });
  document.getElementById('histAdd').onchange = ev => {
    if (ev.target.value) { S.hist.push(ev.target.value); writeURL(); renderHist(); }
  };

  el.innerHTML = `<p>${T('loading')}</p>`;
  const key = S.hist.join(',') + '|' + S.fuel;
  if (!SERIES_CACHE[key]) {
    try {
      SERIES_CACHE[key] = await fetchJSON('api.php?action=series&cc=' + S.hist.join(',') + '&fuel=' + S.fuel);
    } catch (e) {
      el.innerHTML = `<p class="err">${T('hist_needs_api')}</p>`;
      return;
    }
  }
  const data = SERIES_CACHE[key];
  const series = [];
  S.hist.forEach((cc, i) => {
    const raw = data.series[cc] || [];
    const a = noTime ? 1 : pliAdj(cc);
    series.push({ name: META[cc][S.lang], color: HIST_PALETTE[i % 10],
                  pts: raw.map(([d, v]) => [d, v * a]) });
  });
  const meanRaw = (S.basis === 'ppp') ? data.eu_mean_ppp : data.eu_mean;
  series.push({ name: T('eu_mean'), color: '#2B2620', dash: '7 5', pts: meanRaw });

  const W = 1000, H = 520, ML = 56, MR = 16, MT = 16, MB = 40;
  const pw = W - ML - MR, ph = H - MT - MB;
  const all = series.flatMap(s => s.pts);
  if (!all.length) { el.innerHTML = `<p class="err">${T('no_data')}</p>`; return; }
  const t0 = Date.parse(all[0][0]);
  const tMin = Math.min(...all.map(p => Date.parse(p[0])));
  const tMax = Math.max(...all.map(p => Date.parse(p[0])));
  const vMax = Math.max(10, Math.ceil(Math.max(...all.map(p => p[1])) * 1.06));
  const xPix = d => ML + (Date.parse(d) - tMin) / (tMax - tMin) * pw;
  const yPix = v => MT + ph - v / vMax * ph;

  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  for (let v = 0; v <= vMax; v += vMax > 30 ? 5 : 2) {
    s += `<line x1="${ML}" y1="${yPix(v)}" x2="${W - MR}" y2="${yPix(v)}" stroke="#E5DCC8"/>`;
    s += `<text x="${ML - 7}" y="${yPix(v) + 4}" text-anchor="end" font-size="12" fill="#6E6558">${v}</text>`;
  }
  const y0 = new Date(tMin).getFullYear(), y1 = new Date(tMax).getFullYear();
  for (let y = y0 + 1; y <= y1; y += (y1 - y0 > 12 ? 2 : 1)) {
    const x = xPix(y + '-01-01');
    s += `<line x1="${x}" y1="${MT}" x2="${x}" y2="${MT + ph}" stroke="#EFE8D6"/>`;
    s += `<text x="${x}" y="${H - 18}" text-anchor="middle" font-size="12" fill="#6E6558">${y}</text>`;
  }
  for (const ser of series) {
    if (!ser.pts.length) continue;
    const d = ser.pts.map((p, i) => (i ? 'L' : 'M') + xPix(p[0]).toFixed(1) + ' ' + yPix(p[1]).toFixed(1)).join('');
    s += `<path d="${d}" fill="none" stroke="${ser.color}" stroke-width="1.8"${ser.dash ? ` stroke-dasharray="${ser.dash}"` : ''}/>`;
    let mn = ser.pts[0], mx = ser.pts[0];
    for (const p of ser.pts) { if (p[1] < mn[1]) mn = p; if (p[1] > mx[1]) mx = p; }
    for (const [p, lbl] of [[mn, T('min')], [mx, T('max')]]) {
      s += `<circle cx="${xPix(p[0]).toFixed(1)}" cy="${yPix(p[1]).toFixed(1)}" r="4" fill="none" stroke="${ser.color}" stroke-width="1.6"/>`;
      s += `<text x="${(xPix(p[0]) + 7).toFixed(1)}" y="${(yPix(p[1]) + (lbl === T('min') ? 14 : -7)).toFixed(1)}" font-size="11" fill="${ser.color}">${lbl} ${fmt(p[1])} (${p[0].slice(0, 4)})</text>`;
    }
  }
  s += `<line x1="${ML}" y1="${MT + ph}" x2="${W - MR}" y2="${MT + ph}" stroke="#2B2620" stroke-width="1.5"/>`;
  s += `<text x="14" y="${MT + 10}" font-size="12" fill="#6E6558" transform="rotate(-90 14 ${MT + 10})" text-anchor="end">kr/l</text>`;
  s += '</svg>';
  el.innerHTML = s;

  // Legend: linjeprover för varje serie + min/max-förklaring
  const line = (color, dash) =>
    `<svg width="26" height="10" style="vertical-align:-1px"><line x1="1" y1="5" x2="25" y2="5" stroke="${color}" stroke-width="2.2"${dash ? ` stroke-dasharray="${dash}"` : ''}/></svg>`;
  document.getElementById('histLegend').innerHTML =
    series.map(ser => `<span>${line(ser.color, ser.dash)} ${ser.name}</span>`).join('') +
    `<span><svg width="14" height="12" style="vertical-align:-2px"><circle cx="7" cy="6" r="4" fill="none" stroke="#6E6558" stroke-width="1.6"/></svg> ${T('minmax_lbl')}</span>`;
}

function renderAbout() {

  const html = sv ? `
<h2>Källa och beräkning</h2>
<p>Priserna kommer från EU-kommissionens <em>Weekly Oil Bulletin</em> (Euro-super 95 respektive
automotive gas oil/diesel), som publicerar konsumentpriser per måndag för EU:s 27 länder,
med och utan skatter. Alla priser i källan är EUR per 1000 liter; omräkning till kr/liter
sker med bulletinens egen veckokurs för SEK (EUR per SEK ur Sverige-kolumnen, samma datum).
En källa, en kurs, inga externa valuta-API:er. Licens för källdata: CC BY-NC-ND —
"Source: European Commission Weekly Oil Bulletin".</p>
<p>Befolkningsvikter: Eurostat, 1 januari 2025 (deklarerat källår, D5).
PPP-läget använder Eurostats prisnivåindex (prc_ppp_ind, PLI_EU27_2020, kategori A01
"faktisk individuell konsumtion", år 2024, EU27=100): justerat pris = nominellt pris ×
(PLI<sub>Sverige</sub>/PLI<sub>landet</sub>). Sverige är oförändrat ankare — läs det som

(svenskt plånboksperspektiv, D4); PPP är en deklarerad syskonläsning.</p>
<h2>Tidpris ("time price")</h2>
<p>Tredje prisläget är <strong>tidpris</strong>: hur länge en genomsnittlig löntagare behöver
arbeta för en liter. Begreppet är etablerat (bl.a. Tupy &amp; Pooley, <em>Superabundance</em>, 2022):
tidpris = pengapris / timlön. Själva formeln är väldefinierad, men <em>valet av lönemått</em> är en
deklarationsfråga — brutto eller netto, medel eller median, per sysselsatt eller per capita.
Våra val (deklarerade, D5): <strong>nettolön</strong> (det är obeskattad tid som faktiskt byts mot
bensin), <strong>genomsnittslön för ensamstående utan barn, 100&nbsp;% av genomsnittslönen</strong>
(Eurostat <code>earn_nt_net</code>, 2024, EUR), omräknad till timlön med
<strong>2080 h/år</strong> (52 veckor × 40 h — en deklarerad konvention, inte faktisk arbetstid).</p>
<p>Beräkning: <code>tidpris (min/l) = pris (EUR/l) × 60 / nettotimlön (EUR/h)</code>.
Priset tas i EUR direkt ur källan, så ingen växelkurs blandas in. Exempel (2026-08-03, bensin):
Sverige ≈ 1,45 €/l ÷ 15,97 €/h ≈ 5,5 min/l; Bulgarien ≈ 1,74 €/l ÷ 5,71 €/h ≈ 18 min/l —
tidpriset vänder ofta kartbilden jämfört med nominella priser.</p>

  const byGroup = new Map();
  for (const s of solids) {
    if (!byGroup.has(s.group)) byGroup.set(s.group, []);
    byGroup.get(s.group).push(s.tris);
  }
  const stamp = `bensin-eu_${S.fuel}_${S.date}_${S.view}_${S.basis}_${S.color}`;
  const files = [], fileNotes = [];
  let idx = 1;
  for (const [g, tris] of byGroup) {
    const base = g.replace(/^([AB])_(.*)$/, (m, half, rest) => groupFileName(rest) + '_' + (S.lang === 'sv' ? 'del' : 'part') + '-' + half);
    const name = String(idx).padStart(2, '0') + '_' + (byGroup.has(g) && !/^[AB]_/.test(g) ? groupFileName(g) : base) + '.stl';
    const buf = stlBinary(tris, stamp + ' ' + g);
    files.push({ name, data: new Uint8Array(buf) });
    let n = 0; for (const t of tris) n += t.length;
    fileNotes.push(`${name}  (${n} ${S.lang === 'sv' ? 'trianglar' : 'triangles'})`);
    idx++;
  }
  const slip = buildFollowsedel({
    view: S.view, files: fileNotes, euMean, missing, totalWidth,
    refIncluded: document.getElementById('refChk').checked,
  });
  files.unshift({ name: T('followsedel_name'), data: new TextEncoder().encode(slip) });

  const blob = zipStore(files);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = stamp + '.zip';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

/* =====================================================================
 *  UI-koppling och start
 * ===================================================================== */
function applyStaticTexts() {
  document.documentElement.lang = S.lang;
  document.title = T('title');
  const set = (id, k) => document.getElementById(id).textContent = T(k);
  set('t_title', 'title'); set('t_sub', 'sub');
  set('tab_curve', 'tab_curve'); set('tab_map', 'tab_map');
  set('tab_hist', 'tab_hist'); set('tab_about', 'tab_about');
  set('l_date', 'l_date'); set('l_fuel', 'l_fuel'); set('l_basis', 'l_basis');
  set('l_color', 'l_color'); set('l_ctx', 'l_ctx'); set('l_ref', 'l_ref'); set('l_split', 'l_split');
  set('exportBtn', 'export');
  // Flagga för språket knappen byter TILL
  const lb = document.getElementById('langBtn');
  lb.textContent = S.lang === 'sv' ? '\u{1F1EC}\u{1F1E7}' : '\u{1F1F8}\u{1F1EA}';
  lb.title = T('lang_switch');
  lb.setAttribute('aria-label', T('lang_switch'));
  lb.style.fontSize = '18px';
  const fuelSel = document.getElementById('fuelSel');
  fuelSel.options[0].textContent = T('fuel_petrol');
  fuelSel.options[1].textContent = T('fuel_diesel');
  const basisSel = document.getElementById('basisSel');
  basisSel.options[0].textContent = T('basis_nom');
  basisSel.options[1].textContent = T('basis_ppp');
  basisSel.options[2].textContent = T('basis_time');
  const colorSel = document.getElementById('colorSel');
  colorSel.options[0].textContent = T('color_quartile');
  colorSel.options[1].textContent = T('color_fixed');
  colorSel.options[2].textContent = T('color_tax');
  let foot = T('foot');
  if (LAST_UPDATE) foot += ` ${T('last_update')}: ${LAST_UPDATE.slice(0, 16).replace('T', ' ')} UTC.`;
  document.getElementById('foot').textContent = foot;
}
function syncControls() {
  document.getElementById('fuelSel').value = S.fuel;
  document.getElementById('basisSel').value = S.basis;
  // Tidpris kräver lönehistorik och visas inte i historiken
  document.getElementById('basisSel').options[2].disabled = S.view === 'hist';
  document.getElementById('colorSel').value = S.color;
  document.getElementById('ctxChk').checked = S.ctx;
  document.getElementById('dateSel').value = S.date || '';
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.view === S.view));
  document.querySelectorAll('.view').forEach(v =>
    v.classList.toggle('on', v.id === 'view_' + S.view));
  // Kontroller utan betydelse i aktuell vy döljs (i stället för att stå kvar).
  const show = (id, on) => document.getElementById(id).style.display = on ? '' : 'none';
  const geom = ['curve', 'map'].includes(S.view);   // vyer med datum/färg/export
  show('dateGrp', geom);
  show('fuelGrp', S.view !== 'about');
  show('basisGrp', S.view !== 'about');
  show('colorGrp', geom);
  show('ctxGrp', S.view === 'map');
  show('refGrp', geom);
  show('splitGrp', S.view === 'curve');
  const exp = document.getElementById('exportBtn');
  show('exportBtn', geom);
  exp.disabled = !geom || (S.view === 'map' && !GEO);
  exp.title = exp.disabled ? T('export_na') : '';
  const idx = DATES.indexOf(S.date);
  document.getElementById('datePrev').disabled = SEED_MODE || idx <= 0;
  document.getElementById('dateNext').disabled = SEED_MODE || idx >= DATES.length - 1;
  document.getElementById('dateSel').disabled = SEED_MODE;
}
async function rerender() {
  writeURL(); applyStaticTexts(); syncControls();
  const banner = document.getElementById('banner');
  banner.style.display = SEED_MODE ? 'block' : 'none';
  if (SEED_MODE) banner.textContent = T('seed_banner').replace('{date}', S.date);
  let payload = null;
  try { payload = await payloadFor(S.date); }
  catch (e) { payload = PAYLOADS[DATES[DATES.length - 1]]; S.date = payload.date; syncControls(); }
  if (S.view === 'curve') renderCurve(payload);
  else if (S.view === 'map') { renderMap(payload); drawMap(); }
  else if (S.view === 'hist') renderHist();
  else renderAbout();
}
function fillDates() {
  const sel = document.getElementById('dateSel');
  sel.innerHTML = DATES.slice().reverse().map(d => `<option value="${d}">${d}</option>`).join('');
}
function wire() {
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.onclick = () => { S.view = b.dataset.view; rerender(); });
  document.getElementById('langBtn').onclick = () => { S.lang = S.lang === 'sv' ? 'en' : 'sv'; rerender(); };
  document.getElementById('dateSel').onchange = ev => { S.date = ev.target.value; rerender(); };
  document.getElementById('datePrev').onclick = () => {
    const i = DATES.indexOf(S.date); if (i > 0) { S.date = DATES[i - 1]; rerender(); } };
  document.getElementById('dateNext').onclick = () => {
    const i = DATES.indexOf(S.date); if (i < DATES.length - 1) { S.date = DATES[i + 1]; rerender(); } };
  document.getElementById('fuelSel').onchange = ev => { S.fuel = ev.target.value; SERIES_CACHE = {}; rerender(); };
  document.getElementById('basisSel').onchange = ev => { S.basis = ev.target.value; rerender(); };
  document.getElementById('colorSel').onchange = ev => { S.color = ev.target.value; rerender(); };
  document.getElementById('ctxChk').onchange = ev => { S.ctx = ev.target.checked; rerender(); };
  document.getElementById('exportBtn').onclick = doExport;
}
(async function main() {
  readURL();
  applyStaticTexts();
  document.getElementById('curveChart').innerHTML = `<p>${T('loading')}</p>`;
  try {
    await loadInitial();
  } catch (e) {
    document.getElementById('curveChart').innerHTML =
      `<p class="err">Kunde inte läsa vare sig api.php eller data/seed.json: ${e.message}</p>`;
    return;
  }
  fillDates();
  wire();
  rerender();
})();
</script>
