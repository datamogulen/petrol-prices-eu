  set('tab_hist', 'tab_hist'); set('tab_about', 'tab_about');
  set('tab_print3d', 'tab_print3d'); set('tab_grammar', 'tab_grammar');
  set('tab_teach', 'tab_teach');
  set('l_date', 'l_date'); set('l_fuel', 'l_fuel'); set('l_basis', 'l_basis');
  set('l_color', 'l_color'); set('l_ctx', 'l_ctx'); set('l_ref', 'l_ref'); set('l_split', 'l_split');
  set('exportBtn', 'export');
  // Flagga för språket knappen byter TILL
  const lb = document.getElementById('langBtn');
  lb.textContent = S.lang === 'sv' ? '\u{1F1EC}\u{1F1E7}' : '\u{1F1F8}\u{1F1EA}';
  lb.title = T('lang_switch');
  lb.setAttribute('aria-label', T('lang_switch'));
  lb.style.fontSize = '18px';
  const fuelSel = document.getElementById('fuelSel');
  fuelSel.options[0].textContent = T('fuel_petrol');
  fuelSel.options[1].textContent = T('fuel_diesel');
  const basisSel = document.getElementById('basisSel');
  basisSel.options[0].textContent = T('basis_nom');
  basisSel.options[1].textContent = T('basis_ppp');
  basisSel.options[2].textContent = T('basis_time');
  basisSel.options[3].textContent = T('basis_yearnom');
  basisSel.options[4].textContent = T('basis_year');
  document.getElementById('bgrpLitre').label = T('bgrp_litre');
  document.getElementById('bgrpYear').label = T('bgrp_year');
  const colorSel = document.getElementById('colorSel');
  colorSel.options[0].textContent = T('color_quartile');
  colorSel.options[1].textContent = T('color_fixed');
  colorSel.options[2].textContent = T('color_tax');
  colorSel.options[3].textContent = T('color_taxonly');
  set('l_zscale', 'l_zscale'); set('l_layout', 'l_layout');
  const zSel = document.getElementById('zscaleSel');
  zSel.options[0].textContent = T('zscale_05');
  zSel.options[1].textContent = T('zscale_1');
  zSel.options[2].textContent = T('zscale_2');
  const aSel = document.getElementById('anchorSel');
  aSel.innerHTML = Object.keys(META)
    .sort((a, b) => META[a][S.lang].localeCompare(META[b][S.lang]))
    .map(cc => `<option value="${cc}">${META[cc][S.lang]}</option>`).join('');
  document.getElementById('l_anchor').textContent = T('l_anchor');
  const lySel = document.getElementById('layoutSel');
  lySel.options[0].textContent = T('layout_full');
  lySel.options[1].textContent = T('layout_quad');
  lySel.options[2].textContent = T('layout_nine');
  let foot = T('foot');
  if (LAST_UPDATE) foot += ` ${T('last_update')}: ${LAST_UPDATE.slice(0, 16).replace('T', ' ')} UTC.`;
  document.getElementById('foot').textContent = foot;
}
function syncControls() {
  document.getElementById('fuelSel').value = S.fuel;
  document.getElementById('basisSel').value = S.basis;
  // Relativpris/tidpris/årslägena visas inte i historiken (kräver ankar-/löneserier)
  for (let oi = 1; oi <= 4; oi++) {
    document.getElementById('basisSel').options[oi].disabled = S.view === 'hist';
  }
  document.getElementById('colorSel').value = S.color;
  document.getElementById('zscaleSel').value = String(S.zscale);
  document.getElementById('layoutSel').value = S.layout;
  document.getElementById('ctxChk').checked = S.ctx;
  document.getElementById('percapChk').checked = S.percap;
  document.getElementById('anchorSel').value = S.anchor;
  document.getElementById('dateSel').value = S.date || '';
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.classList.toggle('on', b.dataset.view === S.view));
  document.querySelectorAll('.view').forEach(v =>
    v.classList.toggle('on', v.id === 'view_' + S.view));
  // Kontroller utan betydelse i aktuell vy döljs (i stället för att stå kvar).
  const show = (id, on) => document.getElementById(id).style.display = on ? '' : 'none';
  const geom = ['curve', 'map'].includes(S.view);   // vyer med datum/färg/export
  const dataView = ['curve', 'map', 'hist'].includes(S.view);
  show('dateGrp', geom);
  show('fuelGrp', dataView);
  show('basisGrp', dataView);
  show('colorGrp', geom);
  show('anchorGrp', geom && S.basis === 'ppp');
  show('percapGrp', geom && isYearBasis());
  show('zscaleGrp', geom);
  show('layoutGrp', geom);
  show('ctxGrp', S.view === 'map');
  show('refGrp', geom);
  show('splitGrp', S.view === 'curve');
  const exp = document.getElementById('exportBtn');
  show('exportBtn', geom);
  exp.disabled = !geom || (S.view === 'map' && !GEO);
  exp.title = exp.disabled ? T('export_na') : '';
  const idx = DATES.indexOf(S.date);
  document.getElementById('datePrev').disabled = SEED_MODE || idx <= 0;
  document.getElementById('dateNext').disabled = SEED_MODE || idx >= DATES.length - 1;
  document.getElementById('dateSel').disabled = SEED_MODE;
  // Synlig förklaring av valt prisläge (PPP = "svensk plånbok", tidpris)
  const hint = document.getElementById('basisHint');
  if (dataView && S.basis === 'ppp' && S.view !== 'hist') { hint.textContent = T('hint_ppp'); hint.style.display = ''; }
  else if (dataView && S.basis === 'time' && S.view !== 'hist') { hint.textContent = T('hint_time'); hint.style.display = ''; }
  else if (dataView && S.basis === 'year' && S.view !== 'hist') { hint.textContent = T('hint_year'); hint.style.display = ''; }
  else if (dataView && S.basis === 'yearnom' && S.view !== 'hist') { hint.textContent = T('hint_yearnom'); hint.style.display = ''; }
  else hint.style.display = 'none';
  if (hint.style.display !== 'none' && isYearBasis()) {
    hint.textContent += ' ' + (S.percap ? T('percap_note') : T('percap_off_note'));
  }
}
async function rerender() {
  writeURL(); applyStaticTexts(); syncControls();
  const banner = document.getElementById('banner');
  banner.style.display = SEED_MODE ? 'block' : 'none';
  if (SEED_MODE) banner.textContent = T('seed_banner').replace('{date}', S.date);
  let payload = null;
  try { payload = await payloadFor(S.date); }
  catch (e) { payload = PAYLOADS[DATES[DATES.length - 1]]; S.date = payload.date; syncControls(); }
  if (S.view === 'curve') renderCurve(payload);
  else if (S.view === 'map') { renderMap(payload); drawMap(); }
  else if (S.view === 'hist') renderHist();
  else if (S.view === 'print3d') renderPrint3d();
  else if (S.view === 'grammar') renderGrammar();
  else if (S.view === 'teach') renderTeach();
  else renderAbout();
}
function fillDates() {
  const sel = document.getElementById('dateSel');
  sel.innerHTML = DATES.slice().reverse().map(d => `<option value="${d}">${d}</option>`).join('');
}
function wire() {
  document.querySelectorAll('nav.tabs button').forEach(b =>
    b.onclick = () => { S.view = b.dataset.view; rerender(); });
  document.getElementById('langBtn').onclick = () => { S.lang = S.lang === 'sv' ? 'en' : 'sv'; rerender(); };
  document.getElementById('dateSel').onchange = ev => { S.date = ev.target.value; rerender(); };
  document.getElementById('datePrev').onclick = () => {
    const i = DATES.indexOf(S.date); if (i > 0) { S.date = DATES[i - 1]; rerender(); } };
  document.getElementById('dateNext').onclick = () => {
    const i = DATES.indexOf(S.date); if (i < DATES.length - 1) { S.date = DATES[i + 1]; rerender(); } };
  document.getElementById('fuelSel').onchange = ev => { S.fuel = ev.target.value; SERIES_CACHE = {}; rerender(); };
  document.getElementById('basisSel').onchange = ev => { S.basis = ev.target.value; rerender(); };
  document.getElementById('colorSel').onchange = ev => { S.color = ev.target.value; rerender(); };
  document.getElementById('zscaleSel').onchange = ev => { S.zscale = parseFloat(ev.target.value); rerender(); };
  document.getElementById('layoutSel').onchange = ev => { S.layout = ev.target.value; rerender(); };
  document.getElementById('ctxChk').onchange = ev => { S.ctx = ev.target.checked; rerender(); };
  document.getElementById('percapChk').onchange = ev => { S.percap = ev.target.checked; rerender(); };
  document.getElementById('anchorSel').onchange = ev => { S.anchor = ev.target.value; rerender(); };
  document.getElementById('exportBtn').onclick = doExport;
}
(async function main() {
  readURL();
  applyStaticTexts();
  document.getElementById('curveChart').innerHTML = `<p>${T('loading')}</p>`;
  try {
    await loadInitial();
  } catch (e) {
    document.getElementById('curveChart').innerHTML =
      `<p class="err">Kunde inte läsa vare sig api.php eller data/seed.json: ${e.message}</p>`;
    return;
  }
  fillDates();
  wire();
  rerender();
})();
</script>
</body>
</html>
