/* =====================================================================
 *  Tillstånd – allt i URL-parametrar (ingen localStorage)

const S = {
  lang: 'sv', view: 'curve', date: null, fuel: 'petrol', basis: 'nom',
  color: 'quartile', ctx: true, ref: true, split: false, hist: ['SE'],
  zscale: 1, layout: 'full', percap: false, anchor: 'SE',
};
function readURL() {
  const p = new URLSearchParams(location.search);
  // Kortformer från QR-koden (via hedin.it/r/): d,f,b,c,v,x -> långa namn.
  for (const [short, long] of [['d','date'],['f','fuel'],['b','basis'],
                               ['c','color'],['v','view'],['x','ctx']]) {
    if (p.has(short) && !p.has(long)) p.set(long, p.get(short));
  }
  // Kompakta VÄRDEN från QR-koder (håller URL:en under v4-gränsen 78 tecken)
  const VAL_ALIAS = {
    fuel: { p: 'petrol', d: 'diesel' },
    basis: { n: 'nom', t: 'time', y: 'year', yn: 'yearnom', yp: 'yearnom' },
    color: { q: 'quartile', f: 'fixed', t: 'tax', o: 'taxonly' },
    view: { m: 'map', c: 'curve' },
  };
  for (const [key, map] of Object.entries(VAL_ALIAS)) {
    const v = p.get(key);
    if (v != null && map[v]) p.set(key, map[v]);
  }
  if (p.get('basis') === 'p' ) p.set('basis', 'ppp');
  // Default: webbläsarens språk (svenska → sv, allt annat → en); URL-param vinner.
  S.lang = (navigator.language || 'sv').toLowerCase().startsWith('sv') ? 'sv' : 'en';
  if (['sv','en'].includes(p.get('lang'))) S.lang = p.get('lang');
  if (['curve','map','hist','about','print3d','grammar','teach'].includes(p.get('view'))) S.view = p.get('view');
  if (/^\d{4}-\d{2}-\d{2}$/.test(p.get('date') || '')) S.date = p.get('date');
  if (['petrol','diesel'].includes(p.get('fuel'))) S.fuel = p.get('fuel');
  if (p.get('basis') === 'yearppp') p.set('basis', 'yearnom');   // pensionerat läge
  if (['nom','ppp','time','year','yearnom'].includes(p.get('basis'))) S.basis = p.get('basis');
  if (['quartile','fixed','tax','taxonly'].includes(p.get('color'))) S.color = p.get('color');
  if (['0.5','1','2'].includes(p.get('zs'))) S.zscale = parseFloat(p.get('zs'));
  if (['full','quad','nine'].includes(p.get('ly'))) S.layout = p.get('ly');
  if (p.get('ctx') === '0') S.ctx = false;
  if (p.get('pc') === '1') S.percap = true;
  if (META[p.get('a')]) S.anchor = p.get('a');
  if (p.get('hist')) S.hist = p.get('hist').split(',').filter(c => META[c]).slice(0, 10);
  if (!S.hist.length) S.hist = ['SE'];
}
function writeURL() {
  const p = new URLSearchParams();
  p.set('lang', S.lang); p.set('view', S.view);
  if (S.date) p.set('date', S.date);
  p.set('fuel', S.fuel); p.set('basis', S.basis); p.set('color', S.color);
  if (!S.ctx) p.set('ctx', '0');
  if (S.percap) p.set('pc', '1');
  if (S.anchor !== 'SE' && S.basis === 'ppp') p.set('a', S.anchor);
  if (S.zscale !== 1) p.set('zs', String(S.zscale));
  if (S.layout !== 'full') p.set('ly', S.layout);
  p.set('hist', S.hist.join(','));
  history.replaceState(null, '', '?' + p.toString());
}
const T = k => I18N[S.lang][k];

/* =====================================================================
 *  Datainläsning: api.php → fallback data/seed.json
 * ===================================================================== */
let SEED_MODE = false, DATES = [], PAYLOADS = {}, LAST_UPDATE = null, GEO = null;

async function fetchJSON(url) {
  const r = await fetch(url, { cache: 'no-cache' });
  if (!r.ok) throw new Error(url + ': HTTP ' + r.status);
  return r.json();   // kastar även om PHP-källkod levereras som text
}
async function loadInitial() {
  try {
    const latest = await fetchJSON('api.php?action=latest');
    if (!latest.fuels) throw new Error('oväntat svar');
    PAYLOADS[latest.date] = latest;
    LAST_UPDATE = latest.last_update || null;
    const d = await fetchJSON('api.php?action=dates');
    DATES = d.dates || [latest.date];
    if (!S.date || !DATES.includes(S.date)) S.date = latest.date;
  } catch (e) {
    const seed = await fetchJSON('data/seed.json');
    SEED_MODE = true;
    PAYLOADS[seed.date] = seed;
    DATES = [seed.date];
    S.date = seed.date;
  }
  try { GEO = await fetchJSON('data/europe.geojson'); } catch (e) { GEO = null; }
}
async function payloadFor(date) {
  if (PAYLOADS[date]) return PAYLOADS[date];
  const p = await fetchJSON('api.php?action=date&date=' + date);
  PAYLOADS[date] = p;
  return p;
}

/* =====================================================================
 *  Prislogik: justering, sortering, klassning
 * ===================================================================== */
function pliAdj(cc) { return S.basis === 'ppp' ? META.SE.pli / META[cc].pli : 1; }
function isYearBasis() { return S.basis === 'year' || S.basis === 'yearnom'; }
/** Enhet för värdeaxeln i valt prisläge. */
function unit() {
  const pc = S.percap ? (S.lang === 'sv' ? '/inv' : '/cap') : '';
  if (S.basis === 'time') return 'min/l';
  if (S.basis === 'year') return (S.lang === 'sv' ? 'h/år' : 'h/yr') + pc;
  if (S.basis === 'yearnom') return (S.lang === 'sv' ? 'kr/år' : 'SEK/yr') + pc;
  if (S.basis === 'ppp') return '× ' + S.anchor;
  return 'kr/l';
}
/** Justerat värde: nominellt (kr/l), relativpris (× ankarland), tidpris m.fl. */
function adjVal(cc, eur, sek, aRef) {
  if (S.basis === 'year' || S.basis === 'yearnom') {
    const m = META[cc];
    if (eur == null || sek == null || !m.km) return null;   // LU/SK/BG/CY: körsträcka saknas
    const pcf = S.percap ? m.cars / 1000 : 1;   // per invånare: × bilar/capita
    const litres = m.km * (SCALE.FUEL_L100 / 100) * pcf;
    return S.basis === 'year' ? litres * eur / m.wage : litres * sek;
  }
  if (S.basis === 'time') return eur == null ? null : eur * 60 / META[cc].wage;
  if (S.basis === 'ppp') {
    if (eur == null || !aRef) return null;
    return (eur / META[cc].pli) / aRef.ref;   // bensin ÷ prisbild, relativt ankarlandet
  }
  return sek;
}

/**
 * "Skatteändring till EU-snittet": eftersom nettopriserna är nästan lika i
 * hela EU är avståndet till det befolkningsviktade genomsnittet i praktiken
 * en skattefråga. Avståndet i visningsenheten räknas om till nominella kr/l
 * (PPP via prisnivån, tidpris/årsarbetstid via lönen) och jämförs med
 * dagens skatt; blir den nya skatten negativ flaggas det.
 */
function taxToMeanLine(payload, rows, r) {
  const e = (payload.fuels[S.fuel] || {})[r.cc];
  if (!e || e.sek == null || e.sek_net == null) return '';
  const mean = euMeanOf(rows);
  if (mean == null) return '';
  const dDisp = mean - dispOf(r);
  let f = 1;   // visningsenhet -> nominella kr/l
  if (S.basis === 'ppp') {
    const aR = anchorRef(payload);
    const eA = aR ? (payload.fuels[S.fuel] || {})[aR.cc] : null;
    if (!eA || eA.sek == null) return '';
    f = (eA.sek / META[aR.cc].pli) * META[r.cc].pli;
  }
  else if (S.basis === 'time') f = META[r.cc].wage / 60 * payload.sek_per_eur;
  else if (isYearBasis()) {
    const litres = META[r.cc].km * (SCALE.FUEL_L100 / 100) * (S.percap ? META[r.cc].cars / 1000 : 1);
    if (S.basis === 'year') f = META[r.cc].wage / litres * payload.sek_per_eur;
    else f = 1 / litres;
  }
  const dKr = dDisp * f;
  const taxNow = e.sek - e.sek_net;
  if (taxNow <= 0.05) return '';
  const pct = Math.round(dKr / taxNow * 100);
  const sgn = pct >= 0 ? '+' : '−';
  return `<br>${T('tt_tomean')}: ${sgn}${Math.abs(pct)} % ${T('tt_tax')}` +
         (taxNow + dKr < 0 ? ` ${T('tt_negtax')}` : '');
}

/** Ankarreferens för relativprisläget: ankarlandets (pris ÷ prisnivå). */
function anchorRef(payload) {
  const f = (payload.fuels || {})[S.fuel] || {};
  for (const cc of [S.anchor, 'SE', ...Object.keys(META)]) {
    const e = f[cc];
    if (e && e.eur != null) return { cc, ref: e.eur / META[cc].pli };
  }
  return null;
}
/** Radlista för valt datum+bränsle+prisläge: [{cc,tot,net,tax,pop}] sorterad stigande. */
function rowsFor(payload) {
  const f = (payload.fuels || {})[S.fuel] || {};
  const rows = [];
  const aRef = S.basis === 'ppp' ? anchorRef(payload) : null;
  for (const cc of Object.keys(META)) {
    const e = f[cc];
    if (!e || e.sek == null || e.eur == null) continue;
    const tot = adjVal(cc, e.eur, e.sek, aRef);
    if (tot == null) continue;   // t.ex. årsarbetstid utan körsträckedata
    const net = adjVal(cc, e.eur_net, e.sek_net, aRef);
    rows.push({ cc, tot, net, tax: net != null ? tot - net : null, pop: META[cc].pop });
  }
  const filtered = S.color === 'taxonly' ? rows.filter(r => r.tax != null) : rows;
  filtered.sort((a, b) => dispOf(a) - dispOf(b));
  return filtered;
}
function euMeanOf(rows) {
  let w = 0, s = 0;
  for (const r of rows) { w += r.pop; s += r.pop * dispOf(r); }
  return w ? s / w : null;
}
/** Kvartilbrytpunkter (per land, oviktade – deklarerat i Om-panelen). */
function quartileBreaks(rows) {
  const v = rows.map(r => dispOf(r));
  const q = p => {
    const i = (v.length - 1) * p, lo = Math.floor(i), hi = Math.ceil(i);
    return v[lo] + (v[hi] - v[lo]) * (i - lo);
  };
  return [q(.25), q(.5), q(.75)];
}
function activeBreaks(rows) {
  if (S.color !== 'fixed') return quartileBreaks(rows);
  if (S.basis === 'time') return SCALE.TIME_BREAKS;
  if (S.basis === 'year') return S.percap ? SCALE.YEAR_BREAKS_PC : SCALE.YEAR_BREAKS;
  if (S.basis === 'yearnom') return S.percap ? SCALE.YEARKR_BREAKS_PC : SCALE.YEARKR_BREAKS;
  if (S.basis === 'ppp') return SCALE.REL_BREAKS;
  return SCALE.FIXED_BREAKS;
}
function classOf(tot, breaks) {
  return tot < breaks[0] ? 0 : tot < breaks[1] ? 1 : tot < breaks[2] ? 2 : 3;
}
const fmt = (x, d = 2) => x == null ? '–' : x.toLocaleString(S.lang === 'sv' ? 'sv-SE' : 'en-GB',
  { minimumFractionDigits: d, maximumFractionDigits: d });
/** Visningsvärde i aktivt prisläge (kr/år utan decimaler). */
const vfmt = x => fmt(x, S.basis === 'yearnom' ? 0 : 2);

/* =====================================================================
 *  STL-KÄRNA – fristående geometrimodul.
 *  Körs oförändrad både i webbläsaren och i test/stl_check.js (Node),
 *  som extraherar detta block ur index.html. Inga DOM-referenser här.
 *
 *  Konventioner: mm-koordinater, z uppåt, ytterringar CCW, hål CW,
 *  varje "solid" är en lista trianglar [[x,y,z],[x,y,z],[x,y,z]].
 * ===================================================================== */

/** Signerad area av ring [[x,y],...] (positiv = CCW). */
function ringArea(pts) {
  let a = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1) % n];
    a += x1 * y2 - x2 * y1;
  }
  return a / 2;
}
/** Kopierar ring, tar bort dubblerad slutpunkt, tvingar orientering. */
function normRing(pts, clockwise) {
  let r = pts.slice();
  const [x0, y0] = r[0], [xn, yn] = r[r.length - 1];
  if (x0 === xn && y0 === yn) r = r.slice(0, -1);
  const cw = ringArea(r) < 0;
  if (cw !== clockwise) r.reverse();
  return r;
}

/* ---- earcut: polygontriangulering med hål ---------------------------
 * Kompakt implementation av Mapbox earcut-algoritmen (ISC-licens,
 * (c) Mapbox; adapterad/inlinad utan z-ordningsoptimering – våra
 * polygoner är små). Indata: platt array [x0,y0,x1,y1,...] +
 * hålstartindex; utdata: triangelindex.                                */
function earcut(data, holeIndices) {
  const hasHoles = holeIndices && holeIndices.length;
  const outerLen = hasHoles ? holeIndices[0] * 2 : data.length;
  let outerNode = ecLinkedList(data, 0, outerLen, true);

/** Rätblock [x0,x1]×[y0,y1]×[z0,z1] som 12 trianglar med utåtnormaler. */

    [x0, y0, z0], [x1, y0, z0], [x1, y1, z0], [x0, y1, z0],
    [x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1],

    [4, 5, 6], [4, 6, 7],   // topp (+z)
    [0, 1, 5], [0, 5, 4],   // y0 (-y)
    [2, 3, 7], [2, 7, 6],   // y1 (+y)
    [1, 2, 6], [1, 6, 5],   // x1 (+x)

/** Punkt-i-polygon (ray casting), för glyfernas ö/hål-klassning. */
function pointInRing(pt, ring) {
  let inside = false;
  const [px, py] = pt;
  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const [xi, yi] = ring[i], [xj, yj] = ring[j];
    if ((yi > py) !== (yj > py) &&
        px < (xj - xi) * (py - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}

/**
 * Glyfkonturer -> [{outer, holes}] via nästningsdjup (containment, inte
 * orientering — C1-läxan från inequality-in-dollars: A, D, O och 0 tappar
 * annars sina hål).
 */
function glyphPolys(flatContours) {
  const rings = flatContours.map(c => {
    const r = [];
    for (let i = 0; i < c.length; i += 2) r.push([c[i], c[i + 1]]);
    return r;
  }).filter(r => r.length >= 3);
  const depth = rings.map((r, i) =>
    rings.reduce((d, o, j) => d + (j !== i && pointInRing(r[0], o) ? 1 : 0), 0));
  const polys = [];
  rings.forEach((r, i) => {
    if (depth[i] % 2 === 0) polys.push({ outer: r, holes: [], d: depth[i] });
  });
  rings.forEach((r, i) => {
    if (depth[i] % 2 === 1) {
      for (const p of polys) {
        if (p.d === depth[i] - 1 && pointInRing(r[0], p.outer)) { p.holes.push(r); break; }
      }
    }
  });
  return polys;
}

/** Extra spårning (C5: glyfer får inte överlappa) i fontenheter. */
function fontTrack() { return 0.03 * FONT_OS_BOLD.upm; }

/** Radbredd i mm för OpenSans-Bold vid given versalhöjd. */
function textOutlineWidth(text, capMm) {
  const F = FONT_OS_BOLD;
  const sc = capMm / F.cap;
  let x = 0, n = 0;
  for (const ch of text.toUpperCase()) {
    const g = F.glyphs[ch] || F.glyphs[' '];
    x += (g ? g.a : F.upm / 2) + fontTrack();
    n++;
  }
  return Math.max(0, x - (n ? fontTrack() : 0)) * sc;
}

/**
 * Text i OpenSans-Bold som extruderade, vattentäta solider.
 * mapPt transformerar [x,y] i mm (translation/spegling) före extrudering —
 * spegling är säker eftersom extrudeSolid normaliserar ringorientering.
 */
function textOutlineSolids(text, capMm, z0, z1, mapPt) {
  const F = FONT_OS_BOLD;
  if (!F) throw new Error('FONT_OS_BOLD saknas - kor tools/make_font.py');
  const sc = capMm / F.cap;
  let x = 0;
  const out = [];
  for (const ch of text.toUpperCase()) {
    const g = F.glyphs[ch] || F.glyphs[' '];
    if (g && g.c && g.c.length) {
      for (const poly of glyphPolys(g.c)) {
        const tf = r => r.map(([gx, gy]) => mapPt([(x + gx) * sc, gy * sc]));
        const tris = extrudeSolid(tf(poly.outer), poly.holes.map(tf), z0, z1);
        if (tris) out.push(tris);
      }
    }
    x += (g ? g.a : F.upm / 2) + fontTrack();
  }
  return out;

  for (let i = 8; i < size - 8; i++) {
    if (M[6][i] === null) M[6][i] = i % 2 === 0 ? 1 : 0;
    if (M[i][6] === null) M[i][6] = i % 2 === 0 ? 1 : 0;
  }
  if (ver >= 2) {   // ett justeringsmönster, centrum (size-7, size-7)
    const c = size - 7;
    for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++)
      set(c + x, c + y, Math.max(Math.abs(x), Math.abs(y)) !== 1 ? 1 : 0);
  }
  // Formatinformation: ECC L (01), mask 0 -> BCH(15,5) + XOR-maskering
  const fmt = (0b01 << 3) | 0;
  let bch = fmt;
  for (let i = 0; i < 10; i++) bch = (bch << 1) ^ ((bch >> 9) * 0x537);
  const fbits = ((fmt << 10) | bch) ^ 0x5412;
  const fbit = i => (fbits >> i) & 1;
  for (let i = 0; i <= 5; i++) set(8, i, fbit(i));
  set(8, 7, fbit(6)); set(8, 8, fbit(7)); set(7, 8, fbit(8));
  for (let i = 9; i < 15; i++) set(14 - i, 8, fbit(i));
  for (let i = 0; i < 8; i++) set(size - 1 - i, 8, fbit(i));
  for (let i = 8; i < 15; i++) set(8, size - 15 + i, fbit(i));
  set(8, size - 8, 1);   // mörk modul
  // Datautplacering (sicksack) + mask 0
  let bi = 0; const totalBits = cw.length * 8;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const x = right - j;
        const upward = ((right + 1) & 2) === 0;
        const y = upward ? size - 1 - vert : vert;
        if (M[y][x] !== null) continue;
        let bit = 0;
        if (bi < totalBits) { bit = (cw[bi >> 3] >> (7 - (bi & 7))) & 1; bi++; }
        if ((x + y) % 2 === 0) bit ^= 1;   // mask 0
        M[y][x] = bit;
      }
    }
  }
  return { size, version: ver, get: (x, y) => M[y][x] === 1 };
}

/** QR-matris -> radvis sammanslagna rektanglar; rad 0 hamnar överst (y-max). */
function matrixRects(q, m) {
  const rects = [];
  for (let row = 0; row < q.size; row++) {
    let run = -1;
    for (let col = 0; col <= q.size; col++) {
      const on = col < q.size && q.get(col, row);
      if (on && run < 0) run = col;
      if (!on && run >= 0) {
        rects.push({ x0: run * m, x1: col * m,
                     y0: (q.size - 1 - row) * m, y1: (q.size - row) * m });
        run = -1;
      }
    }
  }
  return rects;
}

/**
 * Rektangulär panel [x0,x1]x[y0,y1]x[z0,z1] med rektangulära hål
 * (används för graverad undersida: hålen är textpixlarna). Bandsvep:
 * varje delbox är en egen vattentät solid. Hålen får inte överlappa.
 */
function panelBoxes(x0, y0, x1, y1, z0, z1, holes) {
  const eps = 1e-9, out = [];
  const ys = new Set([y0, y1]);
  for (const h of holes) if (h.y1 > y0 + eps && h.y0 < y1 - eps) {
    ys.add(Math.max(y0, h.y0)); ys.add(Math.min(y1, h.y1));
  }
  const yl = [...ys].sort((a, b) => a - b);
  for (let i = 0; i < yl.length - 1; i++) {
    const ya = yl[i], yb = yl[i + 1];
    if (yb - ya < eps) continue;
    const iv = holes
      .filter(h => h.y0 <= ya + eps && h.y1 >= yb - eps && h.x1 > x0 + eps && h.x0 < x1 - eps)
      .map(h => [Math.max(x0, h.x0), Math.min(x1, h.x1)])
      .sort((a, b) => a[0] - b[0]);
    let cur = x0;
    for (const [hx0, hx1] of iv) {
      if (hx0 > cur + eps) out.push(boxSolid(cur, ya, z0, hx0, yb, z1));
      cur = Math.max(cur, hx1);
    }
    if (x1 > cur + eps) out.push(boxSolid(cur, ya, z0, x1, yb, z1));
  }
  return out;
}

/**
 * Basplatta med etikett, v3 (D10 rev; praxis från inequality-in-dollars):
 *  - Ovansida: upphöjd titel i OpenSans-Bold (grupp 'text', kontrastfärg).
 *  - Undersida: QR-kod + källtext som FLUSH tvåfärgs-inlay (grupp 'ink'):
 *    plattans bottenskikt får hål exakt där bläcket ska sitta (panelBoxes,
 *    rektangulära QR-moduler + en pocket per textrad) och ink-soliderna
 *    fyller dem — "färg, inte djup" (§2.4). Allt speglas i x så att det
 *    läses rätt underifrån; QR:n blir därmed rättvänd för kameran.
 *  - Modulgolv: bygget vägrar under QR_MODULE_FLOOR mm/modul (G23-läxan:
 *    1,0-1,07 mm skannade intermittent; golvet höjdes till 1,25).
 * cfg: {px0,py0,px1,py1, plateMm, inkMm, raiseMm,
 *       title: {lines, capMm, x, y} | null,
 *       under: {lines, capMm, qrText, qrModule} | null}
 */
const QR_MODULE_FLOOR = 1.25;
function labelAndPlate(cfg) {
  const out = [], holes = [];
  const zi0 = -cfg.plateMm, zi1 = -cfg.plateMm + cfg.inkMm;
  let qrSizeMm = 0, droppedLines = 0;

  if (cfg.title) {
    let ty = cfg.title.y;
    for (const line of [...cfg.title.lines].reverse()) {
      for (const tris of textOutlineSolids(line, cfg.title.capMm, 0, cfg.raiseMm,
          ([x, y]) => [cfg.title.x + x, ty + y])) {
        out.push({ group: 'text', cc: null, tris });
      }
      ty += cfg.title.capMm * 1.75;
    }
  }

  if (cfg.under) {
    const m = 4, mod = cfg.under.qrModule;
    const W = cfg.px1 - cfg.px0, H = cfg.py1 - cfg.py0;
    // Läskoordinater (som texten ses underifrån); spegling till modellkoord.
    const RX = rx => cfg.px0 + (W - rx);            // speglad x
    const mapU = ([rx, ry]) => [RX(rx), cfg.py0 + ry];
    const rectU = (rx0, ry0, rx1, ry1) =>
      ({ x0: RX(rx1), x1: RX(rx0), y0: cfg.py0 + ry0, y1: cfg.py0 + ry1 });
    if (cfg.under.qrText) {
      if (mod < QR_MODULE_FLOOR) {
        throw new Error('QR-modul ' + mod.toFixed(2) + ' mm ar under golvet ' +
          QR_MODULE_FLOOR + ' mm och skulle skrivas ut som en smet. Oka plattan eller korta URL:en.');
      }
      const q = qrMatrix(cfg.under.qrText);
      qrSizeMm = q.size * mod;
      if (qrSizeMm > W - 2 * m || qrSizeMm > H - 2 * m) {
        throw new Error('Plattan (' + W.toFixed(0) + 'x' + H.toFixed(0) +
          ' mm) rymmer inte QR-koden (' + qrSizeMm.toFixed(0) + ' mm + marginal).');
      }
      // QR nere till vänster (läst underifrån): modulhål + ink-moduler, flush
      for (const r of matrixRects(q, mod)) {
        const h = rectU(m + r.x0, m + r.y0, m + r.x1, m + r.y1);
        holes.push(h);
        out.push({ group: 'ink', cc: null, tris: boxSolid(h.x0, h.y0, zi0, h.x1, h.y1, zi1) });
      }
    }
    // Textrader: till höger om QR om plats finns, annars ovanför
    let capMm = cfg.under.capMm || 4.2;
    let tx = qrSizeMm ? m + qrSizeMm + 6 : m, ty0 = m,
        availW = W - tx - m, availH = H - 2 * m;
    if (availW < 45) { tx = m; ty0 = m + qrSizeMm + 5; availW = W - 2 * m; availH = H - ty0 - m; }
    let lines = cfg.under.lines.slice();
    const widest = () => Math.max(0, ...lines.map(l => textOutlineWidth(l, capMm)));
    while (lines.length && widest() > availW && capMm > 2.6) capMm -= 0.2;
    const before = lines.length;
    lines = lines.filter(l => textOutlineWidth(l, capMm) <= availW);
    const lineH = capMm * 2.0;
    const maxN = Math.max(0, Math.floor(availH / lineH));
    lines = lines.slice(0, maxN);
    droppedLines = before - lines.length;
    let y = ty0 + capMm * 0.35;
    for (const line of [...lines].reverse()) {
      const wmm = textOutlineWidth(line, capMm);
      // pocket med marginal for overshoot (Å uppat, Q/komma nedat)
      holes.push(rectU(tx - 1.5, y - capMm * 0.35, tx + wmm + 1.5, y + capMm * 1.5));
      for (const tris of textOutlineSolids(line, capMm, zi0, zi1,
          ([gx, gy]) => mapU([tx + gx, y + gy]))) {
        out.push({ group: 'ink', cc: null, tris });
      }
      y += lineH;
    }
  }

  out.push({ group: 'plate', cc: null,
             tris: boxSolid(cfg.px0, cfg.py0, zi1, cfg.px1, cfg.py1, 0) });
  for (const tris of panelBoxes(cfg.px0, cfg.py0, cfg.px1, cfg.py1, zi0, zi1, holes)) {
    out.push({ group: 'plate', cc: null, tris });
  }
  return { solids: out, qrSizeMm, droppedLines };
}

/* =====================================================================
 *  ZIP-skrivare (utan komprimering) – en nedladdning per export.
 *  Ingår i kärnblocket så att test/stl_check.js kan verifiera arkivet
 *  med en riktig unzip.
 * ===================================================================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function zipStore(files) {   // files: [{name, data:Uint8Array}]
  const chunks = [], central = [];
  let offset = 0;
  const enc = new TextEncoder();
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true); lh.setUint16(4, 20, true);
    lh.setUint16(6, 0x0800, true);     // UTF-8-flagga
    lh.setUint16(8, 0, true);          // store
    lh.setUint32(14, crc, true); lh.setUint32(18, n, true); lh.setUint32(22, n, true);
    lh.setUint16(26, name.length, true);
    chunks.push(new Uint8Array(lh.buffer), name, f.data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true); ch.setUint16(10, 0, true);
    ch.setUint32(16, crc, true); ch.setUint32(20, n, true); ch.setUint32(24, n, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);
    offset += 30 + name.length + n;
  }
  let cdSize = 0;
  for (const c of central) cdSize += c.length;
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, cdSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, new Uint8Array(end.buffer)], { type: 'application/zip' });
}
/*STL-CORE-END*/

/* =====================================================================
 *  Gemensam geometribeskrivning för aktuell vy (WYSIWYG-kontraktet):
 *  exakt samma segment/grupper används av SVG-kurvan, 3D-kartan och STL.
 * ===================================================================== */
function segmentsForRow(row, breaks) {
  if (S.color === 'taxonly') {
    return row.tax != null ? [{ group: 'tax', z0: 0, z1: row.tax }] : [];
  }
  if (S.color === 'tax' && row.net != null) {
    return [{ group: 'net', z0: 0, z1: row.net }, { group: 'tax', z0: row.net, z1: row.tot }];
  }
  if (S.color === 'tax') return [{ group: 'net', z0: 0, z1: row.tot }];
  return [{ group: 'q' + classOf(row.tot, breaks), z0: 0, z1: row.tot }];
}
/** Värdet vyn visar för en rad (i "Enbart skatt" är det skattedelen). */
function dispOf(row) { return S.color === 'taxonly' ? (row.tax ?? 0) : row.tot; }
/** Höjdskala: geometri-mm per värdeenhet (Z-skalan gäller karta + STL). */
function scaleSegs(segs) {
  const mmPerUnit = (S.basis === 'year' ? SCALE.YEAR_MM
    : S.basis === 'yearnom' ? SCALE.YEARKR_MM
    : S.basis === 'ppp' ? SCALE.REL_MM : 1) * S.zscale;
  return segs.map(sg => ({ ...sg, z0: sg.z0 * mmPerUnit, z1: sg.z1 * mmPerUnit }));
}
function groupColor(g) {
  if (g === 'net') return COLORS.net;
  if (g === 'tax') return COLORS.tax;
  if (g === 'ctx') return COLORS.ctx;
  if (g === 'plate') return COLORS.plate;
  if (g === 'ref') return COLORS.ref;
  if (g === 'text' || g === 'ink') return COLORS.text;
  return COLORS.q[+g.slice(1)];
}
function groupLabels(breaks) {
  if (S.color === 'taxonly') return { tax: T('tax_part') };
  if (S.color === 'tax') return { net: T('net_part'), tax: T('tax_part') };
  const lbl = S.color === 'fixed'
    ? I18N[S.lang].fixed_lbl(activeBreaks([]), unit())
    : T('quartile_lbl').map((l, i) => `${l} ${i === 0 ? '< ' + fmt(breaks[0]) : i === 3 ? '≥ ' + fmt(breaks[2]) : fmt(breaks[i - 1]) + '–' + fmt(breaks[i])}`);
  return { q0: lbl[0], q1: lbl[1], q2: lbl[2], q3: lbl[3] };
}

const tooltip = document.getElementById('tooltip');

function renderCurve(payload) {
  const el = document.getElementById('curveChart');
  const rows = rowsFor(payload);
  if (!rows.length) { el.innerHTML = `<p class="err">${T('no_data')}</p>`; return; }
  const breaks = activeBreaks(rows);
  const mean = euMeanOf(rows);
  const totalPop = rows.reduce((s, r) => s + r.pop, 0);

  const W = 1000, H = 560, ML = 62, MR = 14, MT = 18, MB = 46;
  const pw = W - ML - MR, ph = H - MT - MB;
  const rawMax = Math.max(...rows.map(r => dispOf(r))) * 1.08;
  // Relativpriset är en kvot kring 1 – skala tätt efter datat (halvsteg);
  // kr/min-lägena behåller sina golv så att olika datum blir jämförbara.
  const maxY = S.basis === 'ppp'
    ? Math.max(1.5, Math.ceil(rawMax * 2) / 2)
    : Math.max(S.color === 'taxonly' ? 4 : 10, Math.ceil(rawMax));
  const yPix = v => MT + ph - v / maxY * ph;

  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  const yStep = (() => {
    const raw = maxY / 8, pow = Math.pow(10, Math.floor(Math.log10(raw)));
    for (const m of [1, 2, 2.5, 5, 10]) if (raw <= m * pow) return m * pow;
    return 10 * pow;
  })();
  for (let v = 0; v <= maxY; v += yStep) {
    s += `<line x1="${ML}" y1="${yPix(v)}" x2="${W - MR}" y2="${yPix(v)}" stroke="#E5DCC8" stroke-width="1"/>`;
    s += `<text x="${ML - 8}" y="${yPix(v) + 4}" text-anchor="end" font-size="12" fill="#6E6558">${v.toLocaleString(S.lang === 'sv' ? 'sv-SE' : 'en-GB')}</text>`;
  }
  s += `<text x="14" y="${MT + 10}" font-size="12" fill="#6E6558" transform="rotate(-90 14 ${MT + 10})" text-anchor="end">${unit()}</text>`;

  let x = ML;
  const bars = [];
  const leaders = [];   // etiketter för smala staplar: text + pil i nivåer
  const lastX = [-1e9, -1e9, -1e9, -1e9, -1e9];
  rows.forEach((r, i) => {
    const w = r.pop / totalPop * pw;
    for (const seg of segmentsForRow(r, breaks)) {
      s += `<rect data-i="${i}" x="${x.toFixed(2)}" y="${yPix(seg.z1).toFixed(2)}" width="${Math.max(w, 0.6).toFixed(2)}" height="${(yPix(seg.z0) - yPix(seg.z1)).toFixed(2)}" fill="${groupColor(seg.group)}" stroke="#F7F2E6" stroke-width="0.5"/>`;
    }
    if (w > 16) {
      s += `<text x="${(x + w / 2).toFixed(1)}" y="${(yPix(dispOf(r)) - 5).toFixed(1)}" text-anchor="middle" font-size="11" fill="#2B2620">${r.cc}</text>`;
    } else {
      // smal stapel: landskod ovanför med linje ner till stapeln, i nivåer
      const cx = x + w / 2;
      const topHere = Math.max(dispOf(r),
        i > 0 ? dispOf(rows[i - 1]) : 0, i < rows.length - 1 ? dispOf(rows[i + 1]) : 0);
      let L = 0;
      while (L < 4 && cx - lastX[L] < 22) L++;
      lastX[L] = cx;
      const ly = yPix(topHere) - 10 - L * 12;
      leaders.push(
        `<line x1="${cx.toFixed(1)}" y1="${(yPix(dispOf(r)) - 1).toFixed(1)}" x2="${cx.toFixed(1)}" y2="${(ly + 2).toFixed(1)}" stroke="#8A8073" stroke-width="0.7"/>` +
        `<text x="${cx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#5C5348">${r.cc}</text>`);
    }
    bars.push({ x0: x, x1: x + w, row: r });
    x += w;
  });
  s += leaders.join('');
  s += `<line x1="${ML}" y1="${yPix(mean)}" x2="${W - MR}" y2="${yPix(mean)}" stroke="#2F5A8F" stroke-width="2" stroke-dasharray="8 5"/>`;
  s += `<text x="${W - MR - 4}" y="${yPix(mean) - 6}" text-anchor="end" font-size="12.5" fill="#2F5A8F" font-weight="600">${T('eu_mean')}: ${vfmt(mean)} ${unit()}</text>`;
  s += `<line x1="${ML}" y1="${MT + ph}" x2="${W - MR}" y2="${MT + ph}" stroke="#2B2620" stroke-width="1.5"/>`;
  s += `<text x="${ML}" y="${H - 14}" font-size="12" fill="#6E6558">0</text>`;
  s += `<text x="${W - MR}" y="${H - 14}" text-anchor="end" font-size="12" fill="#6E6558">${Math.round(totalPop / 1e6)} ${T('milj')} (${Math.round(totalPop / SCALE.POP_PER_MM)} mm)</text>`;
  s += `<text x="${(ML + W - MR) / 2}" y="${H - 14}" text-anchor="middle" font-size="12" fill="#6E6558">${S.lang === 'sv' ? 'kumulativ befolkning' : 'cumulative population'}</text>`;
  s += '</svg>';
  el.innerHTML = s;

  const svg = el.firstChild;
  svg.addEventListener('mousemove', ev => {
    const t = ev.target;
    if (t.tagName !== 'rect') { hideTip(); return; }
    const r = bars[+t.dataset.i].row;
    const eNom = (payload.fuels[S.fuel] || {})[r.cc] || {};
    showTip(
      `<b>${META[r.cc][S.lang]}</b><br>` +
      (S.basis === 'ppp'
        ? `${T('tt_pump')}: ${fmt(eNom.sek)} kr/l (${fmt(eNom.eur, 3)} €/l)` +
          `<br>${T('tt_rel')}: ${vfmt(r.tot)} ${unit()}`
        : `${T('tt_price')}: ${vfmt(r.tot)} ${unit()} ` +
          (S.basis === 'time' || isYearBasis() ? `(${fmt(eNom.sek)} kr/l)` : `(${fmt(eNom.eur, 3)} €/l)`)) +
      (isYearBasis() ? `<br>${fmt(META[r.cc].km, 0)} km/år × ${SCALE.FUEL_L100} l/100 km${S.percap ? ` × ${META[r.cc].cars}/1000 ${S.lang === 'sv' ? 'bilar/inv.' : 'cars/cap.'}` : ''}` : '') +
      (r.net != null ? (S.basis === 'ppp'
        ? `<br>${T('tt_net')}: ${fmt(eNom.sek_net)} · ${T('tt_tax')}: ${fmt(eNom.sek - eNom.sek_net)} kr/l`
        : `<br>${T('tt_net')}: ${vfmt(r.net)} · ${T('tt_tax')}: ${vfmt(r.tax)} ${unit()}`) : '') +
      taxToMeanLine(payload, rows, r) +
      `<br>${T('tt_pop')}: ${fmt(r.pop / 1e6, 1)} ${T('milj')}`, ev);
  });
  svg.addEventListener('mouseleave', hideTip);

  renderLegend('curveLegend', breaks, false);
  document.getElementById('curveCaption').innerHTML =
    T('curve_caption') + (S.basis === 'ppp' ? '<br>' + T('ppp_note')
                        : S.basis === 'time' ? '<br>' + T('time_note')
                        : isYearBasis() ? '<br>' + T('year_note') : '');
}

function renderLegend(id, breaks, withCtx) {

  if (withCtx && S.ctx) h += `<span><span class="sw" style="background:${COLORS.ctx}"></span>${T('ctx_lbl')}</span>`;
  h += `<span><span class="sw" style="background:none;border:2px dashed #2F5A8F"></span>${T('eu_mean')}</span>`;
  el.innerHTML = h;
}

function labelTexts(view) {

/**
 * Landskoder och landgränser på kurvremsan – i ALLA utskriftslayouter:
 *  - Breda staplar: koden i upphöjd OpenSans-Bold PÅ STAPELNS FRAMSIDA.
 *  - Övriga (bl.a. Sverige): koden på etikettbandet med ledare ("pil");
 *    bandet använder upp till tre rader så att alla 27 länder får plats
 *    även i miniatyrlayouterna.
 *  - Tunna kontrastlister vid varje landgräns – fysiska "vita streck".
 * Allt hamnar i titel-filen (kontrastfärg).
 */
function curveLabels(items, totalWidth) {
  const out = [];
  const RAISE = SCALE.TEXT_RAISE;
  const toFace = tris => tris.map(t => t.map(([x, y, z]) => [x, -z, y]));
  const cap = 3.2;
  const rowsY = [-9.5, -15.0, -20.5];        // bandrader (baslinjer), fylls efter behov
  const cursors = rowsY.map(() => 1.5);
  let x = 0;
  const tops = items.map(it => Math.max(0, ...it.segments.map(sg => sg.z1)));
  items.forEach((it, i) => {
    const w = it.widthMm, cx = x + w / 2, hTop = tops[i];
    const faceCap = 3.5;
    const wFace = textOutlineWidth(it.cc, faceCap);
    if (w >= wFace + 2.4 && hTop >= faceCap + 3.5) {
      for (const tris of textOutlineSolids(it.cc, faceCap, 0, RAISE,
          ([gx, gy]) => [cx - wFace / 2 + gx, 1.5 + gy])) {
        out.push({ group: 'text', cc: it.cc, tris: toFace(tris) });
      }
    } else {
      const wB = textOutlineWidth(it.cc, cap);
      // välj bandrad med minst förskjutning från stapelns mitt
      let ri = 0, best = Infinity;
      rowsY.forEach((_, k) => {
        const l = Math.max(cursors[k], cx - wB / 2);
        const disp = Math.abs(l + wB / 2 - cx) + k * 0.5;   // föredra övre rader något
        if (l + wB <= totalWidth - 1.5 && disp < best) { best = disp; ri = k; }
      });
      let lx0 = Math.max(cursors[ri], cx - wB / 2);
      if (lx0 + wB > totalWidth - 1.5) lx0 = totalWidth - 1.5 - wB;
      cursors[ri] = lx0 + wB + 1.6;
      const lcx = lx0 + wB / 2, baseline = rowsY[ri];
      for (const tris of textOutlineSolids(it.cc, cap, 0, RAISE,
          ([gx, gy]) => [lx0 + gx, baseline + gy])) {
        out.push({ group: 'text', cc: it.cc, tris });
      }
      const leadTop = baseline + cap * 1.5;
      if (Math.abs(lcx - cx) > 1.2) {
        const tris = extrudeSolid([[cx - 0.35, -0.5], [cx + 0.35, -0.5],
                                   [lcx + 0.35, leadTop], [lcx - 0.35, leadTop]], [], 0, RAISE);
        if (tris) out.push({ group: 'text', cc: it.cc, tris });
      } else {
        out.push({ group: 'text', cc: it.cc,
          tris: boxSolid(cx - 0.35, leadTop, 0, cx + 0.35, -0.5, RAISE) });
      }
    }
    if (i < items.length - 1) {
      const hSep = Math.min(hTop, tops[i + 1]) - 0.3;
      if (hSep > 1) {
        out.push({ group: 'text', cc: null,
          tris: boxSolid(x + w - 0.2, -RAISE, 0, x + w + 0.2, 0.05, hSep) });
      }
    }
    x += w;
  });
  return out;
}

function mapSolidsForState(payload) {
  const rows = rowsFor(payload);
  const breaks = activeBreaks(rows);
  const byCC = {};
  rows.forEach(r => byCC[r.cc] = r);
  const fs = LAYOUTS[S.layout];   // fotavtrycksskala (1, 1/2, 1/3)
  const solids = buildMapSolids(GEO.features, {
    k: SCALE.MAP_K * fs, cos52: SCALE.COS52, minArea: SCALE.MIN_AREA_MM2,
    ctx: S.ctx, ctxHeight: SCALE.CTX_MM, plate: false, plateMm: SCALE.PLATE_MM,
    segmentsFor: cc => byCC[cc] ? scaleSegs(segmentsForRow(byCC[cc], breaks)) : null,
  });
  // Basplatta: upphöjd titel på bandet, QR + källtext som flush inlay under.
  const bb = solids.bbox;
  const m = 3, band = SCALE.LABEL_BAND;
  const px0 = bb[0] - m, px1 = bb[2] + m, py1 = bb[3] + m, py0 = bb[1] - m - band;
  const txt = labelTexts('map');
  const lp = labelAndPlate({
    px0, py0, px1, py1, plateMm: SCALE.PLATE_MM,
    inkMm: SCALE.INK_MM, raiseMm: SCALE.TEXT_RAISE,
    title: { lines: txt.title, capMm: SCALE.TITLE_CAP, x: px0 + 5, y: py0 + 5 },
    under: { lines: txt.under, capMm: SCALE.UNDER_CAP,
             qrText: txt.qr, qrModule: SCALE.QR_MODULE },
  });
  const all = solids.concat(lp.solids);
  all.bbox = [px0, py0, px1, py1];
  return all;
}

function initMap() {
  if (MAP.renderer || typeof THREE === 'undefined') return;
  const box = document.getElementById('map3d');
  MAP.renderer = new THREE.WebGLRenderer({ antialias: true });
  MAP.renderer.setPixelRatio(devicePixelRatio);
  MAP.renderer.setClearColor(0xF7F2E6);
  box.appendChild(MAP.renderer.domElement);
  MAP.scene = new THREE.Scene();
  MAP.camera = new THREE.PerspectiveCamera(40, 1, 1, 5000);
  MAP.camera.up.set(0, 0, 1);
  MAP.scene.add(new THREE.AmbientLight(0xFFFFFF, 0.65));
  const sun = new THREE.DirectionalLight(0xFFF4DC, 0.75);
  sun.position.set(200, -300, 500);
  MAP.scene.add(sun);
  const under = new THREE.DirectionalLight(0xFFF4DC, 0.45);   // ljus underifrån för QR-sidan
  under.position.set(-150, 250, -400);
  MAP.scene.add(under);
  MAP.raycaster = new THREE.Raycaster();

  const el = MAP.renderer.domElement;
  MAP.useOrbit = typeof THREE.OrbitControls === 'function';
  if (MAP.useOrbit) {
    // Snurrmodellen från europe_climate_change: OrbitControls med dämpning,
    // fritt varv i azimut och nästan hela vägen runt i höjdled (G6-läxan:
    // undersidan – där QR-koden nu sitter – ska gå att titta på).
    MAP.controls = new THREE.OrbitControls(MAP.camera, el);
    MAP.controls.enableDamping = true;
    MAP.controls.dampingFactor = 0.08;
    MAP.controls.minDistance = 60;
    MAP.controls.maxDistance = 1500;
    MAP.controls.maxPolarAngle = Math.PI - 0.05;
    (function tick() {
      requestAnimationFrame(tick);
      if (S.view === 'map' && MAP.renderer) { MAP.controls.update(); drawMap(); }
    })();
  }
  el.addEventListener('pointerdown', ev => {
    MAP.dragging = true; MAP.moved = 0; MAP.lastXY = [ev.clientX, ev.clientY];
  });
  el.addEventListener('pointermove', ev => {
    if (ev.buttons) {
      const dx = ev.clientX - MAP.lastXY[0], dy = ev.clientY - MAP.lastXY[1];
      MAP.moved += Math.abs(dx) + Math.abs(dy);
      MAP.lastXY = [ev.clientX, ev.clientY];
      if (!MAP.useOrbit) {   // reserv: enkel skivtallrik utan OrbitControls
        MAP.az += dx * 0.006;
        MAP.el = Math.min(1.45, Math.max(-1.45, MAP.el + dy * 0.006));
        placeCamera(); drawMap();
      }
      hideTip();
    } else {
      hoverMap(ev);
    }
  });
  el.addEventListener('pointerup', ev => {
    MAP.dragging = false;
    if (MAP.moved < 6) clickMap(ev);
  });
  if (!MAP.useOrbit) {
    el.addEventListener('wheel', ev => {
      ev.preventDefault();
      MAP.R = Math.min(1500, Math.max(60, MAP.R * (1 + ev.deltaY * 0.0012)));
      placeCamera(); drawMap();
    }, { passive: false });
  }
  el.addEventListener('pointerleave', () => { hideTip(); setHover(null); });
  addEventListener('resize', sizeMap);
}
function sizeMap() {
  if (!MAP.renderer) return;
  const box = document.getElementById('map3d');
  const w = box.clientWidth || 800, h = box.clientHeight || 560;
  MAP.renderer.setSize(w, h);
  MAP.camera.aspect = w / h;
  MAP.camera.updateProjectionMatrix();
  drawMap();
}
function placeCamera() {
  const [cx, cy] = MAP.center;
  MAP.camera.position.set(
    cx + MAP.R * Math.cos(MAP.el) * Math.sin(MAP.az),
    cy - MAP.R * Math.cos(MAP.el) * Math.cos(MAP.az),
    MAP.R * Math.sin(MAP.el));
  MAP.camera.up.set(0, 0, 1);
  MAP.camera.lookAt(cx, cy, 0);
}
function meshFromTris(trisList, color) {
  let n = 0;
  for (const t of trisList) n += t.length;
  const pos = new Float32Array(n * 9);
  let o = 0;
  for (const tris of trisList) for (const t of tris) for (const p of t) {
    pos[o++] = p[0]; pos[o++] = p[1]; pos[o++] = p[2];
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.computeVertexNormals();
  const m = new THREE.MeshLambertMaterial({ color });
  return new THREE.Mesh(g, m);
}
function renderMap(payload) {
  const box = document.getElementById('map3d');
  if (typeof THREE === 'undefined') {
    box.innerHTML = `<p class="err" style="padding:20px">Three.js (cdnjs) kunde inte laddas – kartvyn kräver nätåtkomst till cdnjs.cloudflare.com.</p>`;
    return;
  }
  if (!GEO) {
    box.innerHTML = `<p class="err" style="padding:20px">data/europe.geojson kunde inte läsas (kräver att sidan serveras via http).</p>`;
    return;
  }
  initMap();
  for (const m of MAP.meshes) { MAP.scene.remove(m); m.geometry.dispose(); m.material.dispose(); }
  MAP.meshes = [];

  const solids = mapSolidsForState(payload);
  const rows = rowsFor(payload); const byCC = {};
  rows.forEach(r => byCC[r.cc] = r);

  // Ett mesh per (land, grupp) för hover/klick; platta+kontext egna mesh.
  const grouped = new Map();
  for (const s of solids) {
    const k = (s.cc || '·') + '|' + s.group;
    if (!grouped.has(k)) grouped.set(k, { cc: s.cc, group: s.group, tris: [] });
    grouped.get(k).tris.push(s.tris);
  }
  const bb = solids.bbox;
  MAP.center = [(bb[0] + bb[2]) / 2, (bb[1] + bb[3]) / 2];
  if (MAP.controls) MAP.controls.target.set(MAP.center[0], MAP.center[1], 0);
  for (const { cc, group, tris } of grouped.values()) {
    const mesh = meshFromTris(tris, groupColor(group));
    mesh.userData = { cc, group };
    MAP.scene.add(mesh);
    MAP.meshes.push(mesh);
  }
  placeCamera(); sizeMap();
  renderLegend('mapLegend', activeBreaks(rows), true);
  document.getElementById('mapCaption').innerHTML =
    T('map_caption') + (S.basis === 'ppp' ? '<br>' + T('ppp_note')
                      : S.basis === 'time' ? '<br>' + T('time_note')
                      : isYearBasis() ? '<br>' + T('year_note') : '');
}
function drawMap() {
  if (MAP.renderer) MAP.renderer.render(MAP.scene, MAP.camera);
}
function pickMap(ev) {
  const r = MAP.renderer.domElement.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((ev.clientX - r.left) / r.width) * 2 - 1,
    -((ev.clientY - r.top) / r.height) * 2 + 1);
  MAP.raycaster.setFromCamera(ndc, MAP.camera);
  const hits = MAP.raycaster.intersectObjects(MAP.meshes);
  return hits.length ? hits[0].object.userData : null;
}
function setHover(cc) {
  if (MAP.hoverCC === cc) return;
  MAP.hoverCC = cc;
  for (const m of MAP.meshes) {
    const on = cc && m.userData.cc === cc;
    m.material.emissive = new THREE.Color(on ? 0x333311 : 0x000000);
  }
  drawMap();
}
function hoverMap(ev) {
  const hit = pickMap(ev);
  if (hit && hit.cc && META[hit.cc]) {
    setHover(hit.cc);
    const payload = PAYLOADS[S.date];
    const rows = rowsFor(payload);
    const r = rows.find(x => x.cc === hit.cc);
    if (r) {
      const eNom = (payload.fuels[S.fuel] || {})[hit.cc] || {};
      showTip(`<b>${META[hit.cc][S.lang]}</b><br>` +
        (S.basis === 'ppp'
          ? `${T('tt_pump')}: ${fmt(eNom.sek)} kr/l (${fmt(eNom.eur, 3)} €/l)` +
            `<br>${T('tt_rel')}: ${vfmt(r.tot)} ${unit()}`
          : `${T('tt_price')}: ${vfmt(r.tot)} ${unit()} ` +
            (S.basis === 'time' || isYearBasis() ? `(${fmt(eNom.sek)} kr/l)` : `(${fmt(eNom.eur, 3)} €/l)`)) +
        (isYearBasis() ? `<br>${fmt(META[hit.cc].km, 0)} km/år × ${SCALE.FUEL_L100} l/100 km${S.percap ? ` × ${META[hit.cc].cars}/1000 ${S.lang === 'sv' ? 'bilar/inv.' : 'cars/cap.'}` : ''}` : '') +
        (r.net != null ? (S.basis === 'ppp'
          ? `<br>${T('tt_net')}: ${fmt(eNom.sek_net)} · ${T('tt_tax')}: ${fmt(eNom.sek - eNom.sek_net)} kr/l`
          : `<br>${T('tt_net')}: ${vfmt(r.net)} · ${T('tt_tax')}: ${vfmt(r.tax)} ${unit()}`) : '') +
        taxToMeanLine(payload, rows, r), ev);
    } else {
      showTip(`<b>${META[hit.cc][S.lang]}</b><br>${T('tt_no_data')}`, ev);
    }
  } else {
    setHover(null); hideTip();
  }
}
function clickMap(ev) {
  const hit = pickMap(ev);
  if (hit && hit.cc && META[hit.cc] && !S.hist.includes(hit.cc)) {
    S.hist.push(hit.cc);
    writeURL();
    SERIES_CACHE = {};   // enklast: ladda om serier vid nästa historikvisning
    const note = document.createElement('div');
    note.textContent = T('added_to_hist').replace('{name}', META[hit.cc][S.lang]);
    note.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#2F5A8F;color:#FDFAF2;padding:8px 18px;border-radius:8px;z-index:60';
    document.body.appendChild(note);
    setTimeout(() => note.remove(), 1800);
  }
}

/* =====================================================================

let SERIES_CACHE = {};
const HIST_PALETTE = ['#2F5A8F', '#B5443C', '#5E8C5A', '#D89040', '#7A5CA0',
                      '#3E8E8B', '#A5563C', '#889046', '#B0699E', '#556677'];

async function renderHist() {
  const chips = document.getElementById('histChips');
  const el = document.getElementById('histChart');
  // Historiken visar endast nominella kr/l (övriga lägen kräver serier över tid).
  const noTime = S.basis !== 'nom';
  document.getElementById('histCaption').innerHTML =
    T('hist_caption') +
    (noTime ? '<br><strong>' + T('hist_no_time') + '</strong>' : '');
  if (SEED_MODE) {
    chips.innerHTML = '';
    el.innerHTML = `<p class="err">${T('hist_needs_api')}</p>`;
    return;
  }
  // chips + lägg-till-väljare
  let h = '';
  S.hist.forEach((cc, i) => {
    h += `<span class="chip" style="border-color:${HIST_PALETTE[i % 10]}">` +
         `<span class="sw" style="background:${HIST_PALETTE[i % 10]}"></span>${META[cc][S.lang]}` +
         `<b data-cc="${cc}" title="×">×</b></span>`;
  });
  h += `<select id="histAdd"><option value="">${T('hist_add')}</option>` +
    Object.keys(META).filter(c => !S.hist.includes(c))
      .sort((a, b) => META[a][S.lang].localeCompare(META[b][S.lang]))
      .map(c => `<option value="${c}">${META[c][S.lang]}</option>`).join('') + '</select>';
  chips.innerHTML = h;
  chips.querySelectorAll('.chip b').forEach(b => b.onclick = () => {
    S.hist = S.hist.filter(c => c !== b.dataset.cc);
    if (!S.hist.length) S.hist = ['SE'];
    writeURL(); renderHist();
  });
  document.getElementById('histAdd').onchange = ev => {
    if (ev.target.value) { S.hist.push(ev.target.value); writeURL(); renderHist(); }
  };

  el.innerHTML = `<p>${T('loading')}</p>`;
  const key = S.hist.join(',') + '|' + S.fuel;
  if (!SERIES_CACHE[key]) {
    try {
      SERIES_CACHE[key] = await fetchJSON('api.php?action=series&cc=' + S.hist.join(',') + '&fuel=' + S.fuel);
    } catch (e) {
      el.innerHTML = `<p class="err">${T('hist_needs_api')}</p>`;
      return;
    }
  }
  const data = SERIES_CACHE[key];
  const series = [];
  S.hist.forEach((cc, i) => {
    const raw = data.series[cc] || [];
    series.push({ name: META[cc][S.lang], color: HIST_PALETTE[i % 10],
                  pts: raw.slice() });
  });
  const meanRaw = data.eu_mean;
  series.push({ name: T('eu_mean'), color: '#2B2620', dash: '7 5', pts: meanRaw });

  const W = 1000, H = 520, ML = 56, MR = 16, MT = 16, MB = 40;
  const pw = W - ML - MR, ph = H - MT - MB;
  const all = series.flatMap(s => s.pts);
  if (!all.length) { el.innerHTML = `<p class="err">${T('no_data')}</p>`; return; }
  const t0 = Date.parse(all[0][0]);
  const tMin = Math.min(...all.map(p => Date.parse(p[0])));
  const tMax = Math.max(...all.map(p => Date.parse(p[0])));
  const vMax = Math.max(10, Math.ceil(Math.max(...all.map(p => p[1])) * 1.06));
  const xPix = d => ML + (Date.parse(d) - tMin) / (tMax - tMin) * pw;
  const yPix = v => MT + ph - v / vMax * ph;

  let s = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  for (let v = 0; v <= vMax; v += vMax > 30 ? 5 : 2) {
    s += `<line x1="${ML}" y1="${yPix(v)}" x2="${W - MR}" y2="${yPix(v)}" stroke="#E5DCC8"/>`;
    s += `<text x="${ML - 7}" y="${yPix(v) + 4}" text-anchor="end" font-size="12" fill="#6E6558">${v}</text>`;
  }
  const y0 = new Date(tMin).getFullYear(), y1 = new Date(tMax).getFullYear();
  for (let y = y0 + 1; y <= y1; y += (y1 - y0 > 12 ? 2 : 1)) {
    const x = xPix(y + '-01-01');
    s += `<line x1="${x}" y1="${MT}" x2="${x}" y2="${MT + ph}" stroke="#EFE8D6"/>`;
    s += `<text x="${x}" y="${H - 18}" text-anchor="middle" font-size="12" fill="#6E6558">${y}</text>`;
  }
  for (const ser of series) {
    if (!ser.pts.length) continue;
    const d = ser.pts.map((p, i) => (i ? 'L' : 'M') + xPix(p[0]).toFixed(1) + ' ' + yPix(p[1]).toFixed(1)).join('');
    s += `<path d="${d}" fill="none" stroke="${ser.color}" stroke-width="1.8"${ser.dash ? ` stroke-dasharray="${ser.dash}"` : ''}/>`;
    let mn = ser.pts[0], mx = ser.pts[0];
    for (const p of ser.pts) { if (p[1] < mn[1]) mn = p; if (p[1] > mx[1]) mx = p; }
    for (const [p, lbl] of [[mn, T('min')], [mx, T('max')]]) {
      s += `<circle cx="${xPix(p[0]).toFixed(1)}" cy="${yPix(p[1]).toFixed(1)}" r="4" fill="none" stroke="${ser.color}" stroke-width="1.6"/>`;
      s += `<text x="${(xPix(p[0]) + 7).toFixed(1)}" y="${(yPix(p[1]) + (lbl === T('min') ? 14 : -7)).toFixed(1)}" font-size="11" fill="${ser.color}">${lbl} ${fmt(p[1])} (${p[0].slice(0, 4)})</text>`;
    }
  }
  s += `<line x1="${ML}" y1="${MT + ph}" x2="${W - MR}" y2="${MT + ph}" stroke="#2B2620" stroke-width="1.5"/>`;
  s += `<text x="14" y="${MT + 10}" font-size="12" fill="#6E6558" transform="rotate(-90 14 ${MT + 10})" text-anchor="end">kr/l</text>`;
  s += '</svg>';
  el.innerHTML = s;

  // Legend: linjeprover för varje serie + min/max-förklaring
  const line = (color, dash) =>
    `<svg width="26" height="10" style="vertical-align:-1px"><line x1="1" y1="5" x2="25" y2="5" stroke="${color}" stroke-width="2.2"${dash ? ` stroke-dasharray="${dash}"` : ''}/></svg>`;
  document.getElementById('histLegend').innerHTML =
    series.map(ser => `<span>${line(ser.color, ser.dash)} ${ser.name}</span>`).join('') +
    `<span><svg width="14" height="12" style="vertical-align:-2px"><circle cx="7" cy="6" r="4" fill="none" stroke="#6E6558" stroke-width="1.6"/></svg> ${T('minmax_lbl')}</span>`;
}

med och utan skatter. Alla priser i källan är EUR per 1000 liter; omräkning till kr/liter
sker med bulletinens egen veckokurs för SEK (EUR per SEK ur Sverige-kolumnen, samma datum).
En källa, en kurs, inga externa valuta-API:er. Licens för källdata: CC BY-NC-ND —
"Source: European Commission Weekly Oil Bulletin".</p>

<h2>Nominellt pris (kr/l)</h2>

<h2>Relativpris (× ankarland)</h2>
<p>Svarar på frågan: <strong>är bensinen ovanligt dyr relativt allt annat i landet?</strong>
Beräkning: <code>(pris ÷ landets prisnivå) ÷ (ankarlandets pris ÷ ankarlandets
prisnivå)</code>, där prisnivån är Eurostats prisnivåindex (PPP-underlag, AIC, 2024,
EU27=100). Måttet är <strong>enhetslöst</strong>: Italiens 1,7 × SE betyder att bensinen tar
1,7 gånger så stor plats i Italiens prisbild som i Sveriges — en italienare möter alltså
relativt sett dyrare bensin än en svensk, oavsett växelkurser och lönenivåer.
<strong>Ankarlandet är valbart</strong> (standard Sverige) och är per definition alltid 1,0;
byte av ankare ändrar bara måttstocken, inte kvoterna länder emellan. Pumppriset visas
alltid parallellt i tooltippen.</p>
<h2>Tidpris ("time price")</h2>
<p>Tredje prisläget är <strong>tidpris</strong>: hur länge en genomsnittlig löntagare behöver
arbeta för en liter. Begreppet är etablerat (bl.a. Tupy &amp; Pooley, <em>Superabundance</em>, 2022):
tidpris = pengapris / timlön. Själva formeln är väldefinierad, men <em>valet av lönemått</em> är en
deklarationsfråga — brutto eller netto, medel eller median, per sysselsatt eller per capita.
Våra val (deklarerade, D5): <strong>nettolön, alltså lön efter skatt</strong> — det är de pengar
man faktiskt kan byta mot bensin; räknat på bruttolön skulle tidpriset se lägre ut än det är,
eftersom en del av arbetstiden går till inkomstskatt innan något kan köpas.
Vidare: <strong>genomsnittslön för ensamstående utan barn, 100&nbsp;% av genomsnittslönen</strong>
(Eurostat <code>earn_nt_net</code>, 2024, EUR), omräknad till timlön med
<strong>2080 h/år</strong> (52 veckor × 40 h — en deklarerad konvention, inte faktisk arbetstid).</p>
<p>Beräkning: <code>tidpris (min/l) = pris (EUR/l) × 60 / nettotimlön (EUR/h)</code>.
Priset tas i EUR direkt ur källan, så ingen växelkurs blandas in. Exempel (2026-08-03, bensin):
Sverige ≈ 1,45 €/l ÷ 15,97 €/h ≈ 5,5 min/l; Bulgarien ≈ 1,74 €/l ÷ 5,71 €/h ≈ 18 min/l —
tidpriset vänder ofta kartbilden jämfört med nominella priser.</p>

<em>inte</em> i historikvyn, eftersom en 20-årig prisserie delad med ett fast löneår skulle ge en
vilseledande "tidprisserie"; en riktig sådan kräver lönehistorik (framtida utbyggnad).
(b) Genomsnittslönen är inte medianlönen; i länder med skev lönefördelning underskattar
genomsnittet den typiska löntagarens tidpris. (c) I tidprisläget är höjdskalan
<code>1 mm = 1 minut arbete per liter</code> och de fasta klasserna ${SCALE.TIME_BREAKS.join('/')} min/l.</p>
<h2>Vilket mått svarar på vad?</h2>
<p><strong>Potatis-testet</strong> skiljer måtten åt: tänk ett fattigt land där bensinen är
procentuellt lika billig som potatisen och allt annat. Tidpriset blir ändå högt — men det
beror då på låga löner, inte på att bensinen är dyr <em>relativt sett</em>. Relativpriset
skiljer de två åt. I EU finns inget sådant potatis-land: bensin köps på världsmarknaden och
blir inte billigare för att landet är billigt. Konkret, Rumänien mot Sverige (Eurostats
kategoriprisnivåer 2024; pumppriser v. 2026-08-03): <strong>potatis, frukt och grönt kostar
ca 60 % av svenska priset, en restaurangnota 59 %, kläder 72 % — men bensinen 124 %</strong>
(19,80 kr mot 15,96; bensinen är alltså till och med dyrare i kronor). Allt annat är mycket
billigare, bensinen är det inte — det är exakt vad relativpriset 2,7 × SE fångar. Måtten
kompletterar varandra: <em>tidpris = har folk råd; relativpris = är bensinen relativt dyr
där.</em></p>

<p>Prices come from the European Commission's <em>Weekly Oil Bulletin</em> (Euro-super 95 and

with and without taxes. All prices in the source are EUR per 1000 litres; conversion to SEK/litre

"Source: European Commission Weekly Oil Bulletin".</p>

<h2>Nominal price (SEK/l)</h2>
<p>The primary reading (Swedish wallet perspective, D4): the pump price converted to SEK with
the bulletin's own weekly rate — what you actually pay at the pump.</p>
<h2>Relative price (× anchor country)</h2>
<p>Answers the question: <strong>is petrol unusually expensive relative to everything else in
the country?</strong> Calculation: <code>(price ÷ the country's price level) ÷ (the anchor
country's price ÷ its price level)</code>, where the price level is Eurostat's price level
index (PPP basis, AIC, 2024, EU27=100). The measure is <strong>dimensionless</strong>:
Italy's 1.7 × SE means petrol takes 1.7 times as much room in Italy's price picture as in
Sweden's — an Italian faces relatively more expensive petrol than a Swede, regardless of
exchange rates and wage levels. <strong>The anchor country is selectable</strong> (default
Sweden) and is always 1.0 by definition; changing anchor changes the yardstick, not the
ratios between countries. The pump price is always shown alongside in the tooltip.</p>
<h2>Time price</h2>
<p>The third price basis is the <strong>time price</strong>: how long an average earner must work
for one litre. The concept is established (e.g. Tupy &amp; Pooley, <em>Superabundance</em>, 2022):
time price = money price / hourly earnings. The formula itself is well-defined, but the
<em>choice of earnings measure</em> is a declaration matter — gross or net, mean or median, per
employee or per capita. Our choices (declared, D5): <strong>net earnings, i.e. pay after
tax</strong> — that is the money actually available to exchange for petrol; using gross pay
would understate the time price, since part of the working time goes to income tax before
anything can be bought. Further: <strong>average earnings of a single person without
children at 100% of the average wage</strong> (Eurostat <code>earn_nt_net</code>, 2024, EUR),
converted to hourly pay using <strong>2080 h/year</strong> (52 weeks × 40 h — a declared
convention, not actual hours worked).</p>
<p>Calculation: <code>time price (min/l) = price (EUR/l) × 60 / net hourly earnings (EUR/h)</code>.
The price is taken in EUR straight from the source, so no exchange rate is involved. Example
(2026-08-03, petrol): Sweden ≈ 1.45 €/l ÷ 15.97 €/h ≈ 5.5 min/l; Bulgaria ≈ 1.74 €/l ÷ 5.71 €/h
≈ 18 min/l — the time price often inverts the map compared with nominal prices.</p>
<p>Limitations (declared): (a) the wage data is a single source year (2024) — hence time price is
<em>not</em> shown in the history view, since a 20-year price series divided by one fixed wage
year would yield a misleading "time price series"; a real one needs wage history (future
extension). (b) The mean wage is not the median; in countries with skewed wage distributions the
mean understates the typical earner's time price. (c) In time-price mode the height scale is
<code>1 mm = 1 minute of work per litre</code> and the fixed classes are ${SCALE.TIME_BREAKS.join('/')} min/l.</p>
<h2>Which measure answers what?</h2>
<p><strong>The potato test</strong> separates the measures: imagine a poor country where
petrol is proportionally as cheap as potatoes and everything else. The time price would still
be high — but from low wages, not because petrol is expensive <em>in relative terms</em>. The
relative price separates the two. No such potato-country exists in the EU: petrol is bought
on the world market and does not get cheaper because the country is cheap. Concretely,
Romania vs Sweden (Eurostat category price levels 2024; pump prices week 2026-08-03):
<strong>potatoes, fruit and vegetables cost about 60% of the Swedish price, a restaurant bill
59%, clothing 72% — but petrol 124%</strong> (19.80 SEK vs 15.96; petrol is actually dearer
in kronor). Everything else is far cheaper, petrol is not — which is exactly what the
relative price of 2.7 × SE captures. The measures complement each other: <em>time price =
can people afford it; relative price = is petrol relatively expensive there.</em></p>

omitted.</strong> Consumption is the EU fleet's actual average per Odyssee (${SCALE.FUEL_L100} l/100 km, 2023),
used for every country since open per-country fleet data is lacking (new cars run 5–6).
The Eurostat-derived distances (RO FI HU EE DK MT SI; BE 2015) build on traffic performance ÷

<h2>Teaching guide: What does petrol really cost?</h2>
<p>Sweden is the main focus, and the central learning goal is that <strong>"a fair price
comparison" is not one thing but a choice of measure</strong>. The same pump prices give three
different maps of Europe depending on how you count. (Figures below refer to the week of
2026-08-03 — fetch fresh ones in the tool.)</p>
<h2>The three measures</h2>
<ul>
<li><strong>Straight price (nominal, SEK/l)</strong> — what filling up costs on site, in Swedish
kronor. Sweden: 15.96 SEK/l — second lowest in the EU (only Malta lower), about 5.50 SEK below
the EU average. <a href="?${q}&view=curve&fuel=petrol&basis=nom&color=quartile">Open in the curve →</a></li>
<li><strong>Relative price (× anchor)</strong> — is petrol unusually expensive relative to
everything else in the country? Computed as (price ÷ the country's price level) compared with
the anchor country (PPP basis, Eurostat). Italy ≈ 1.7 × SE, Romania ≈ 2.7 × SE — petrol takes
2.7 times as much room in Romania's price picture as in Sweden's. Dimensionless, the anchor is
selectable and always 1.0. Sweden is second lowest in the EU (only Luxembourg below).
<a href="?${q}&view=curve&fuel=petrol&basis=ppp&color=quartile">Open →</a></li>
<li><strong>Time price (min of work/l)</strong> — how long an average earner (net pay) works for
one litre. Sweden: ≈ 5.5 minutes — third lowest, after Luxembourg (very high wages) and Ireland
(high average wages, partly driven by the multinational sector; note the measure uses actual net
earnings, not GDP). EU average ≈ 10.5 min; Romania &amp; Bulgaria ≈ 17–18 min.
<a href="?${q}&view=curve&fuel=petrol&basis=time&color=quartile">Open →</a></li>
<li><strong>The annual measures</strong> — extension combining price with distance per car
(× 6.85 l/100 km): <a href="?${q}&view=curve&basis=yearnom">Annual cost SEK/yr →</a> (Sweden
≈ 12,500, Germany ≈ 20,500, Romania ≈ 8,300) ·
<a href="?${q}&view=curve&basis=year">Annual work time h/yr →</a> (Sweden ≈ 71, Germany ≈ 129,
Romania ≈ 127, Greece ≈ 226 — the Romanian drives half as far as the German yet pays as many
hours). Tick <em>Per capita</em> to switch the question from the car owner's burden to
society's — Sweden has the EU's fourth lowest car ownership, so the gap widens:
<a href="?${q}&view=curve&basis=year&pc=1">≈ 34 h/inhabitant against the average 74 →</a>.
Data sources and assumptions under About/Method; calculation exercise on worksheet 6.</li>
</ul>
<h2>Lesson outline (45–60 min)</h2>
<ol>
<li><strong>Guess first (5 min):</strong> Where does Sweden rank among the EU's 27 petrol prices?
Everyone commits to a number before the tool is shown. (Most guess high.)</li>
<li><strong>Explore – start in the map (15 min):</strong> Begin in the
<a href="?${q}&view=map&basis=nom">3D map →</a> — it is easiest to relate to countries you
recognise. Rotate, hover for figures, click countries to add them to the history. Then switch
price basis in the map: <a href="?${q}&view=map&basis=ppp">PPP →</a> and
<a href="?${q}&view=map&basis=time">time price →</a> — which countries rise, which sink?
Finally open the <a href="?${q}&view=curve&basis=time">price curve →</a> and compare: why does
it look different from the map? (D11: large countries dominate the map's visual impression —
the curve's bar width is people.)</li>
<li><strong>The role of tax (10 min):</strong> Switch to the
<a href="?${q}&view=curve&color=tax">Net + tax →</a> colour mode. Net prices (the world market)
are nearly equal across the EU — taxes make the difference. Hover a country: the line
<em>"To the EU average: ±X% tax"</em> shows the political distance — and how much it depends
on the chosen basis (Sweden: +115% nominal, +307% in time price). Compare the
<a href="?${q}&view=hist&hist=SE,DE,PL">history →</a>: what happened in 2022?</li>
<li><strong>Discuss (15 min):</strong> Which measure is the "fairest"? Is there a right answer?
Who benefits when the debate uses one measure rather than another?</li>
</ol>
<h2>Extension: what share of pay goes to fuel?</h2>
<p>The time price concerns <em>one litre</em> — but annual fuelling differs between countries.
An annual cost share can be estimated as:</p>
<p><code>share = distance (km/yr) × consumption (l/km) × price (EUR/l) / net annual pay (EUR)</code></p>
<p>Worked example, Sweden: ≈ 11,000 km/year per car (Trafikanalys) × ~0.065 l/km ≈ 715 l/year
× €1.45/l ≈ €1,040/year ÷ €33,200 net annual pay ≈ <strong>3% of net pay</strong>. The same
distance at Bulgaria's price and pay gives ≈ 11%. <strong>Task:</strong> fetch real distances
and consumption per country (the Odyssee-Mure database, Eurostat road transport, ACEA,
Trafikanalys for Sweden) and compute the share for three countries — does the ranking match the
time price? Discuss error sources: EV share, diesel share, company cars, urban/rural.</p>
<h2>Print it and hold it</h2>
<p>Physical models change the conversation: a print can be passed around, pointed at and
compared. <strong>The map model</strong> is the best classroom starting point — students
recognise the countries and can point. Also print the curve in two bases (nominal and time
price) and let the group hold one in each hand — the difference in shape can be <em>felt</em>.
The QR code on the model leads back to exactly the view that was printed.</p>
<h2>Worksheets for group work (print and hand out)</h2>
<p>Self-contained worksheets for groups of 4–5 — <strong>five sheets handed out one at a
time</strong> (guesses and reveals always sit on different sheets) plus an optional extension
sheet where the group computes annual cost and annual work time for petrol from real distance
data. The pedagogy is discovery-first: groups invent their own fairness measure on Sheet 2
before PPP and time price are explained on Sheet 3. Two variants (with/without printed 3D
models) and two date modes
(fixed 2026-08-03 with a known answer key, or today's data where changes since then become a
task of their own). Choose in the toolbar on the sheet page and print with the browser
(Ctrl+P → PDF).</p>

<h2>For the teacher: download, print and colour</h2>
<ol>
<li><strong>Choose what to print:</strong> go to Map (recommended for recognition) or Price
curve, pick date, fuel, price basis and colour reading. What you see is what prints.</li>
<li><strong>Download:</strong> click <em>Export STL</em> — you get a zip with several STL
files + a packing slip (<code>README.txt</code>) explaining everything.</li>
<li><strong>Slicer:</strong> unzip and import <em>all</em> STL files at once into e.g.
PrusaSlicer, Bambu Studio or Cura. Answer "yes" if the slicer asks to load them as one object
with multiple parts — <strong>do not move the parts</strong>; they are pre-positioned in one
coordinate system.</li>
<li><strong>Colour per file</strong> (one file = one colour, as on screen):
quartile/class 1–4 → green, yellow-green, orange, red; <code>net</code> → blue and
<code>tax</code> → red (in the tax modes); <code>baseplate</code> → light/beige
(<strong>must be light</strong> — it is the QR code's light field); <code>context</code> → grey;
<code>title</code> and <code>underside-qr-text</code> → <strong>black or another dark colour —
important, or the QR code on the underside will not scan</strong>.</li>
<li><strong>No multi-colour printer?</strong> Print everything in a light colour and colour the
raised title with a black marker. The underside QR does require two colours (a filament swap
on the first layers is enough — the underside file sits at height 0–0.6 mm).</li>
<li><strong>Settings:</strong> 0.2 mm layers, 10–15% infill, no supports needed. The print is
low and fast. Test the QR code with a phone before the lesson!</li>
</ol>`;
  document.getElementById('teachBody').innerHTML = html;
}

function groupFileName(g, i) {
  const names = {
    sv: { net: 'netto', tax: 'skatt', ctx: 'kontext', plate: 'basplatta', ref: 'torn-eu-genomsnitt', text: 'titel-kontrastfarg', ink: 'undersida-qr-text-kontrastfarg' },
    en: { net: 'net', tax: 'tax', ctx: 'context', plate: 'baseplate', ref: 'tower-eu-mean', text: 'title-contrast-colour', ink: 'underside-qr-text-contrast-colour' },
  }[S.lang];
  if (names[g]) return names[g];
  const n = +g.slice(1) + 1;
  return (S.color === 'fixed' ? (S.lang === 'sv' ? 'klass' : 'class') : (S.lang === 'sv' ? 'kvartil' : 'quartile')) + '-' + n;
}

function doExport() {
  try { doExportInner(); }
  catch (e) { alert((S.lang === 'sv' ? 'Exporten stoppades: ' : 'Export stopped: ') + e.message); }
}
function doExportInner() {
  if (!['curve', 'map'].includes(S.view)) return;
  const payload = PAYLOADS[S.date];
  if (!payload) return;
  const rows = rowsFor(payload);
  if (!rows.length) return;
  const breaks = activeBreaks(rows);
  const euMean = euMeanOf(rows);
  const missing = Object.keys(META).filter(cc => !rows.find(r => r.cc === cc));
  let solids = [], totalWidth = null;

  if (S.view === 'curve') {
    const fs = LAYOUTS[S.layout];
    const items = rows.map(r => ({
      cc: r.cc, widthMm: r.pop / SCALE.POP_PER_MM * fs,
      segments: scaleSegs(segmentsForRow(r, breaks)),
    }));
    solids = buildCurveSolids(items, SCALE.CURVE_DEPTH);
    totalWidth = solids.totalWidth;
    const band = SCALE.LABEL_BAND, txt = labelTexts('curve');
    const common = { plateMm: SCALE.PLATE_MM, inkMm: SCALE.INK_MM, raiseMm: SCALE.TEXT_RAISE };
    // Enradstitel längst ner på bandet (landskoderna tar övre delen);
    // krymps till bredden, golv 2,6 mm (E2).
    const oneTitle = txt.title.join(' - ');
    let titleCap = 4.5;
    const tw = textOutlineWidth(oneTitle, titleCap);
    if (tw > totalWidth - 10) titleCap = Math.max(2.6, titleCap * (totalWidth - 10) / tw);
    if (!S.split) {
      const lp = labelAndPlate({ ...common,
        px0: 0, py0: -band, px1: totalWidth, py1: SCALE.CURVE_DEPTH,
        title: { lines: [oneTitle], capMm: titleCap, x: 5, y: -band + 3 },
        under: { lines: txt.under, capMm: SCALE.UNDER_CAP,
                 qrText: txt.qr, qrModule: SCALE.QR_MODULE },
      });
      solids.push(...lp.solids);
      solids.push(...curveLabels(items, totalWidth));
    } else {
      // dela vid landgräns närmast halva bredden; varje del får egen platta
      let x = 0, cut = 0, best = Infinity;
      for (const it of items) {
        if (Math.abs(x - totalWidth / 2) < best) { best = Math.abs(x - totalWidth / 2); cut = x; }
        x += it.widthMm;
      }
      const part = S.lang === 'sv' ? 'DEL' : 'PART';
      const lpA = labelAndPlate({ ...common,
        px0: 0, py0: -band, px1: cut, py1: SCALE.CURVE_DEPTH,
        title: { lines: [oneTitle], capMm: Math.min(titleCap, 3.6), x: 5, y: -band + 3 },
        under: { lines: [txt.under[2] + ' ' + part + ' A'], capMm: SCALE.UNDER_CAP },
      });
      const lpB = labelAndPlate({ ...common,
        px0: cut, py0: -band, px1: totalWidth, py1: SCALE.CURVE_DEPTH,
        title: null,
        under: { lines: [part + ' B'], capMm: SCALE.UNDER_CAP,
                 qrText: txt.qr, qrModule: SCALE.QR_MODULE },
      });
      solids.push(...lpA.solids, ...lpB.solids);
      solids.push(...curveLabels(items, totalWidth));
      for (const sd of solids) {
        const minX = Math.min(...sd.tris.flat().map(pt => pt[0]));
        const inB = minX >= cut - 1e-9;
        sd.group = (inB ? 'B_' : 'A_') + sd.group;
        if (inB) for (const t of sd.tris) for (const pt of t) pt[0] -= cut;
      }
    }
  } else {
    if (!GEO) return;
    solids = mapSolidsForState(payload);
    // Länder med pris men utan geometri (under areagränsen, t.ex. Malta) ska
    // deklareras på följesedeln – D6, inget tyst bortfall.
    const withGeom = new Set(solids.filter(s => s.cc).map(s => s.cc));
    for (const r of rows) if (!withGeom.has(r.cc)) missing.push(r.cc + (S.lang === 'sv' ? ' (under areagräns på kartan, D6)' : ' (below map area threshold, D6)'));
  }

  // Torn (referensstapel, EU-genomsnitt): alltid med i rutnätslayouterna –
  // det fyller den lediga rutan och gör plattan skalavläsbar.
  if (document.getElementById('refChk').checked || S.layout !== 'full') {
    solids.push({ group: 'ref', cc: null,
      tris: boxSolid(-45, 0, 0, -30, 20, euMean * S.zscale) });
  }

  // Gruppera till filer
  const byGroup = new Map();
  for (const s of solids) {
    if (!byGroup.has(s.group)) byGroup.set(s.group, []);
    byGroup.get(s.group).push(s.tris);
  }
  const stamp = `bensin-eu_${S.fuel}_${S.date}_${S.view}_${S.basis}_${S.color}`;
  const files = [], fileNotes = [];
  let idx = 1;
  for (const [g, tris] of byGroup) {
    const base = g.replace(/^([AB])_(.*)$/, (m, half, rest) => groupFileName(rest) + '_' + (S.lang === 'sv' ? 'del' : 'part') + '-' + half);
    const name = String(idx).padStart(2, '0') + '_' + (byGroup.has(g) && !/^[AB]_/.test(g) ? groupFileName(g) : base) + '.stl';
    const buf = stlBinary(tris, stamp + ' ' + g);
    files.push({ name, data: new Uint8Array(buf) });
    let n = 0; for (const t of tris) n += t.length;
    fileNotes.push(`${name}  (${n} ${S.lang === 'sv' ? 'trianglar' : 'triangles'})`);
    idx++;
  }
  const slip = buildFollowsedel({
    view: S.view, files: fileNotes, euMean, missing, totalWidth,
    refIncluded: document.getElementById('refChk').checked,
  });
  files.unshift({ name: T('followsedel_name'), data: new TextEncoder().encode(slip) });

  const blob = zipStore(files);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = stamp + '.zip';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}
