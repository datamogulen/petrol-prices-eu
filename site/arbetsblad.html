<script>
'use strict';
/* =====================================================================
 *  QR-encoder – kopia av den testade implementationen i index.html
 *  (byte-läge, ECC L, mask 0, version 1–4). Kanonisk kopia + tester
 *  ligger i index.html/test/stl_check.js; ändra där först.
 * ===================================================================== */
function qrMatrix(text) {
  const bytes = [];
  for (const ch of text) {
    const c = ch.codePointAt(0);
    if (c > 255) throw new Error('QR: endast Latin-1-tecken');
    bytes.push(c);
  }
  const CAP = { 1: [26, 19], 2: [44, 34], 3: [70, 55], 4: [100, 80] };
  let ver = 0;
  for (const v of [1, 2, 3, 4]) if (bytes.length <= CAP[v][1] - 2) { ver = v; break; }
  if (!ver) throw new Error('QR: texten är för lång (' + bytes.length + ' tecken)');
  const [total, dataLen] = CAP[ver], eccLen = total - dataLen;
  const bits = [];
  const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(4, 4); push(bytes.length, 8);
  for (const b of bytes) push(b, 8);
  push(0, Math.min(4, dataLen * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) {
    let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
    data.push(b);
  }
  const PAD = [0xEC, 0x11];
  for (let i = 0; data.length < dataLen; i ^= 1) data.push(PAD[i]);
  const EXP = new Array(512), LOG = new Array(256);
  for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
  let gen = [1];
  for (let i = 0; i < eccLen; i++) {
    const q = [1, EXP[i]], r = new Array(gen.length + 1).fill(0);
    for (let a = 0; a < gen.length; a++) for (let b = 0; b < 2; b++) r[a + b] ^= mul(gen[a], q[b]);
    gen = r;
  }
  const rem = data.concat(new Array(eccLen).fill(0));
  for (let i = 0; i < dataLen; i++) {
    const f = rem[i];
    if (f) for (let j = 0; j < gen.length; j++) rem[i + j] ^= mul(gen[j], f);
  }
  const cw = data.concat(rem.slice(dataLen));
  const size = 17 + 4 * ver;
  const M = Array.from({ length: size }, () => new Array(size).fill(null));
  const set = (x, y, v) => { M[y][x] = v; };
  const finder = (fx, fy) => {
    for (let y = -1; y <= 7; y++) for (let x = -1; x <= 7; x++) {
      const gx = fx + x, gy = fy + y;
      if (gx < 0 || gx >= size || gy < 0 || gy >= size) continue;
      const inC = x >= 0 && x <= 6 && y >= 0 && y <= 6;
      set(gx, gy, inC && (x === 0 || x === 6 || y === 0 || y === 6 ||
                          (x >= 2 && x <= 4 && y >= 2 && y <= 4)) ? 1 : 0);
    }
  };
  finder(0, 0); finder(size - 7, 0); finder(0, size - 7);
  for (let i = 8; i < size - 8; i++) {
    if (M[6][i] === null) M[6][i] = i % 2 === 0 ? 1 : 0;
    if (M[i][6] === null) M[i][6] = i % 2 === 0 ? 1 : 0;
  }
  if (ver >= 2) {
    const c = size - 7;
    for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++)
      set(c + x, c + y, Math.max(Math.abs(x), Math.abs(y)) !== 1 ? 1 : 0);
  }
  const fmt = (0b01 << 3) | 0;
  let bch = fmt;
  for (let i = 0; i < 10; i++) bch = (bch << 1) ^ ((bch >> 9) * 0x537);
  const fbits = ((fmt << 10) | bch) ^ 0x5412;
  const fbit = i => (fbits >> i) & 1;
  for (let i = 0; i <= 5; i++) set(8, i, fbit(i));
  set(8, 7, fbit(6)); set(8, 8, fbit(7)); set(7, 8, fbit(8));
  for (let i = 9; i < 15; i++) set(14 - i, 8, fbit(i));
  for (let i = 0; i < 8; i++) set(size - 1 - i, 8, fbit(i));
  for (let i = 8; i < 15; i++) set(8, size - 15 + i, fbit(i));
  set(8, size - 8, 1);
  let bi = 0; const totalBits = cw.length * 8;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const x = right - j;
        const upward = ((right + 1) & 2) === 0;
        const y = upward ? size - 1 - vert : vert;
        if (M[y][x] !== null) continue;
        let bit = 0;
        if (bi < totalBits) { bit = (cw[bi >> 3] >> (7 - (bi & 7))) & 1; bi++; }
        if ((x + y) % 2 === 0) bit ^= 1;
        M[y][x] = bit;
      }
    }
  }
  return { size, get: (x, y) => M[y][x] === 1 };
}
function qrSVG(url) {
  const q = qrMatrix(url), n = q.size, quiet = 2, dim = n + 2 * quiet;
  let rects = '';
  for (let y = 0; y < n; y++) {
    let run = -1;
    for (let x = 0; x <= n; x++) {
      const on = x < n && q.get(x, y);
      if (on && run < 0) run = x;
      if (!on && run >= 0) {
        rects += `<rect x="${run + quiet}" y="${y + quiet}" width="${x - run}" height="1.02"/>`;
        run = -1;
      }
    }
  }
  return `<svg viewBox="0 0 ${dim} ${dim}" xmlns="http://www.w3.org/2000/svg">` +
         `<rect width="${dim}" height="${dim}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

/* ===================================================================== */
const P = new URLSearchParams(location.search);
const ST = {
  doc: ['elev', 'larare'].includes(P.get('doc')) ? P.get('doc') : 'elev',
  variant: ['med3d', 'utan3d'].includes(P.get('variant')) ? P.get('variant') : 'med3d',
  datum: ['fast', 'aktuell'].includes(P.get('datum')) ? P.get('datum') : 'fast',
  lang: ['sv', 'en'].includes(P.get('lang')) ? P.get('lang')
      : (navigator.language || 'sv').toLowerCase().startsWith('sv') ? 'sv' : 'en',
};
const FIX = '2026-08-03';
const BASE = 'https://hedin.it/r/?p=ppeu';
function link(params) {   // params utan datum; fast läge lägger till d=
  let u = BASE + params;
  if (ST.datum === 'fast') u += '&d=' + FIX;
  return u;
}
const SITE = 'hedin.it/petrol-prices-eu';

/* Verifierade nyckeltal för det fasta datumet 2026-08-03 (bensin 95). */
const N = {
  seNom: '15,96', mtNom: '14,72', euNom: '21,43',
  sePpp: '15,96', luPpp: '15,31', euPpp: '27,74', roPpp: '42,4',
  seTid: '5,5', luTid: '4,1', ieTid: '5,3', euTid: '10,5', roTid: '18',
  seNet: '11,19', seSkatt: '4,76', euSkatt: '10,44', nlSkatt: '13,8',
  seDiesel: '20,05', euDiesel: '22,64',
};
const NE = {};   // engelska decimalpunkter
for (const k of Object.keys(N)) NE[k] = N[k].replace(',', '.');

function qrblock(url, caption) {
  return `<div class="qrbox">${qrSVG(url)}${caption}</div>`;
}

/* ===================================================================== *
 *  INNEHÅLL                                                             *
 * ===================================================================== */
function studentSV() {
  const med = ST.variant === 'med3d';
  const fast = ST.datum === 'fast';
  const datumTxt = fast ? `priser för veckan ${FIX}` : 'dagens senaste priser (bilden kan skilja sig från faktarutorna!)';
  const foot = n => `<div class="foot">Bensinpriser i EU · ${SITE} · Källa: European Commission Weekly Oil Bulletin (CC BY-NC-ND) · Löner &amp; prisnivåer: Eurostat · Körsträckor: Odyssee-Mure/Eurostat · <strong>${n === 6 ? 'Fördjupningsblad (frivilligt)' : 'Blad ' + n + ' av 5 – delas ut ett i taget'}</strong></div>`;
  const nästa = n => `<p style="margin-top:4mm"><strong>✅ Klara? Visa era svar för läraren och be om Blad ${n}.</strong></p>`;
  return `
<div class="sheet">
  <h1>Vad kostar bensinen – egentligen? · Blad 1</h1>
  <div class="badges">
    <span class="badge">${med ? 'Med 3D-modeller' : 'Utan 3D-modeller (mobil räcker)'}</span>
    <span class="badge">${fast ? 'Fast datum: ' + FIX : 'Dagens data'}</span>
    <span class="badge">Grupp om 4–5</span>
    <span class="badge warn">Inga hjälpmedel ännu!</span>
  </div>
  <p>Ni ska undersöka bensinpriser i EU:s 27 länder och upptäcka att svaret på
  "är bensinen dyr i Sverige?" beror på <em>hur man mäter</em>. Ni kommer att använda
  ${datumTxt} – men på det här bladet gissar ni bara. Mobiler ligger kvar i fickan.</p>

  <div class="fact">
    <h3>Så jobbar ni</h3>
    <p>Utse roller (byt gärna halvvägs): <strong>Uppläsare</strong> (läser uppgifterna högt),
    <strong>Sekreterare</strong> (skriver gruppens svar), <strong>Skeptiker</strong> (frågar
    "håller alla verkligen med? hur vet vi det?"), <strong>Tekniker</strong> (sköter
    ${med ? 'modellerna och mobilen' : 'mobilen'} – från Blad 2).</p>
    <p><strong>Viktigaste regeln:</strong> vid varje uppgift svarar var och en
    <em>själv först</em> – sedan jämför ni och diskuterar er fram till ett gruppsvar.</p>
  </div>

  <h2>Uppgift 1 · Gissa (utan att kolla någonstans)</h2>
  <ol>
    <li>Var ligger Sverige bland EU:s 27 länder i bensinpris vid pumpen?
        (1 = billigast, 27 = dyrast). Var och en skriver sin egen siffra – visa inte
        varandra förrän alla är klara:<br>
        <span class="writein"></span> <span class="writein"></span>
        <span class="writein"></span> <span class="writein"></span> <span class="writein"></span></li>
    <li>Gissa literpriset i Sverige: <span class="writein"></span> kr,
        och genomsnittet i EU: <span class="writein"></span> kr.</li>
    <li>Gissa också: var ligger Sverige i <em>bensinskatt</em>?
        (1 = lägst skatt i EU, 27 = högst). Egen gissning: <span class="writein"></span></li>
  </ol>
  <div class="talk">Visa era siffror för varandra. Varför gissade ni olika? Vad bygger ni
  gissningarna på – nyheter, vuxna, sociala medier, egen tankning? Enas om EN gruppgissning
  per fråga och skriv upp dem: placering <span class="writein" style="min-width:12mm"></span> ·
  pris <span class="writein" style="min-width:12mm"></span> kr ·
  EU-snitt <span class="writein" style="min-width:12mm"></span> kr ·
  skatteplacering <span class="writein" style="min-width:12mm"></span></div>
  ${nästa(2)}
  ${foot(1)}
</div>

<div class="sheet">
  <h1>Blad 2 · Kolla verkligheten – och hitta ett problem</h1>
  <div class="badges"><span class="badge">${med ? 'Ta fram kartmodellen' : 'Nu får mobilen komma fram'}</span></div>
  <h2>Uppgift 2 · Kartan</h2>
  <div class="qrrow">
    <div class="qrtask">
      ${med
        ? `<p>Ta fram <strong>kartmodellen</strong>. Hitta Sverige med fingret. Höjd = pris
           (1&nbsp;mm = 1&nbsp;kr/liter). Jämför Sveriges höjd med Tysklands, Danmarks och Polens
           – känn med fingertopparna. Vänd sedan på plattan och skanna QR-koden på undersidan:
           samma karta digitalt, med exakta siffror när ni hovrar.</p>`
        : `<p>Skanna koden och öppna <strong>3D-kartan</strong>. Snurra med fingret, hovra/klicka
           på länder för exakta siffror. Hitta Sverige och jämför med Tyskland, Danmark och Polen.</p>`}
      <p>Jämför med gruppens gissningar från Blad 1: placering? pris? EU-snitt?
      Vem i gruppen var närmast – och hur tänkte hen?</p>
    </div>
    ${qrblock(link('&v=map&b=nom'), 'Kartan – pris vid pumpen')}
  </div>
  <div class="talk">De flesta grupper gissar att Sverige ligger <em>högt</em>. Om ni också
  gjorde det: varifrån kommer den bilden, tror ni? Diskutera 2 minuter.</div>

  <h2>Uppgift 3 · Är 17 kronor = 17 kronor?</h2>
  <p>Titta på Bulgarien och Sverige på kartan. ${fast
    ? `Literpriset är nästan detsamma: <strong>16,84 kr i Bulgarien, 15,96 kr i Sverige</strong>.`
    : `Literpriserna är ofta nästan desamma (kring ${FIX}: 16,84 kr i Bulgarien, 15,96 i Sverige).`}
  Men en genomsnittlig bulgarisk lön är ungefär <strong>en tredjedel</strong> av en svensk,
  och det mesta annat – hyra, mat, frisör – är mycket billigare där.</p>
  <ol>
    <li>Är det "lika dyrt" att tanka i Bulgarien som i Sverige? Var och en tar ställning
    tyst: JA / NEJ / BEROR PÅ – och en mening varför.</li>
    <li>Diskutera: vad mer än pumppriset skulle ni behöva veta för att jämföra
    <em>rättvist</em>? Lista minst två saker:<br>
    <span class="writein" style="min-width:70%"></span><br>
    <span class="writein" style="min-width:70%"></span></li>
    <li><strong>Uppfinn ett eget mått:</strong> hur skulle NI räkna för att jämförelsen ska
    kännas rättvis? Beskriv med ord eller formel (det finns inget facit – än):<br>
    <span class="writein" style="min-width:100%"></span><br>
    <span class="writein" style="min-width:100%"></span></li>
  </ol>
  <div class="talk">Sekreteraren skriver gruppens mått så tydligt att en annan grupp skulle
  kunna räkna med det. Spara det – ni ska jämföra med ekonomernas standardmått på nästa blad.</div>
  ${nästa(3)}
  ${foot(2)}
</div>

<div class="sheet">
  <h1>Blad 3 · Ert mått möter ekonomernas</h1>
  <div class="badges"><span class="badge">Nu får ni facit på uppgift 3</span></div>
  <p>De flesta grupper föreslår att man ska räkna in <em>lönerna</em> eller <em>vad annat
  kostar i landet</em>. Grattis i så fall – ni har just uppfunnit kärnan i ekonomernas två
  standardmått. De svarar på olika frågor: <strong>PPP</strong> frågar "är bensinen ovanligt
  dyr <em>jämfört med allt annat</em> i landet?", <strong>tidpriset</strong> frågar "har folk
  <em>råd</em>?". Ett tankeexperiment visar skillnaden: i ett fattigt land där bensinen vore
  procentuellt lika billig som potatisen blir tidpriset ändå högt (låga löner) – men
  PPP-värdet normalt (bensinen sticker inte ut). Så här ser måtten ut på riktigt:</p>

  <div class="fact">
    <h3>Mått 2 · Köpkraftsjusterat pris (PPP-kr)</h3>
    <p>Eurostat mäter varje lands <strong>allmänna prisnivå</strong> – vad en hel varukorg
    (mat, hyra, tjänster …) kostar – och sätter EU-snittet till 100. Bulgarien ligger på
    <strong>57</strong>, Sverige på <strong>123</strong>: en bulgarisk hundralapp räcker till
    ungefär dubbelt så mycket mat, hyra och frisör som en svensk. <em>Men den räcker bara till
    lika lite bensin</em> – litern kostar ju nästan detsamma. PPP-måttet uttrycker exakt det:</p>
    <p style="text-align:center"><code>PPP-kr = pris × (prisnivå Sverige ÷ prisnivå landet)</code></p>
    <p>Bulgarien: 16,84 kr × (123 ÷ 57) ≈ <strong>36 PPP-kr</strong>. Läs det så här:
    <strong>en liter tar lika stor tugga ur en bulgars plånbok som 36 kr skulle ta ur en
    svensk.</strong> Ingen betalar 36 kr vid någon pump (pumppriset är 16,84) – siffran
    översätter bulgarens börda till svensk måttstock. Sveriges eget värde är därför alltid
    oförändrat: det ÄR måttstocken.</p>
  </div>
  <div class="fact">
    <h3>Mått 3 · Tidpris</h3>
    <p>Ännu enklare: strunta i kronor – räkna <strong>arbetstid</strong>. Hur länge jobbar en
    genomsnittlig löntagare (nettolön, alltså efter skatt) för EN liter?</p>
    <p style="text-align:center"><code>tidpris = pris i euro × 60 ÷ nettotimlön i euro</code></p>
    <p>Sverige: 1,45 € ÷ 15,97 €/h ≈ <strong>5,5 minuter</strong> per liter.
    Rumänien: 1,80 € ÷ 5,92 €/h ≈ <strong>18 minuter</strong>. Samma liter – tre gånger så
    mycket arbete.</p>
  </div>

  <h2>Uppgift 4 · Utforska de nya måtten</h2>
  <div class="qrrow">
    <div class="qrtask">
      ${med
        ? `<p>Ta fram de två <strong>kurvremsorna</strong> (rakt pris och tidpris). Håll en i
           varje hand – känn skillnaden i form! Öppna sedan PPP-kurvan digitalt (koden).</p>`
        : `<p>Öppna kurvorna (koderna här intill). Länderna är sorterade billigast → dyrast;
           stapelbredden är landets befolkning.</p>`}
      <ol>
        <li>Var och en väljer tyst ut <em>ett land som byter plats mest</em> när måttet byts.
        Jämför era val – varför flyttar just de länderna?</li>
        <li>Jämför med ERT mått från Blad 2: fångar ekonomernas mått samma sak som ert?
        Är ert bättre på något?</li>
      </ol>
    </div>
    ${qrblock(link('&v=curve&b=ppp'), 'Kurvan – PPP-justerat')}

  const next = n => `<p style="margin-top:4mm"><strong>✅ Done? Show your answers to the teacher and ask for Sheet ${n}.</strong></p>`;
  return `
<div class="sheet">
  <h1>What does petrol really cost? · Sheet 1</h1>
  <div class="badges">
    <span class="badge">${med ? 'With 3D models' : 'Without 3D models (a phone is enough)'}</span>
    <span class="badge">${fast ? 'Fixed date: ' + FIX : "Today's data"}</span>
    <span class="badge">Groups of 4–5</span>
    <span class="badge warn">No tools yet!</span>
  </div>
  <p>You will investigate petrol prices across the EU's 27 countries and discover that the
  answer to "is petrol expensive in Sweden?" depends on <em>how you measure</em>. You will be
  using ${datumTxt} – but on this sheet you only guess. Phones stay in your pockets.</p>

  <div class="fact">
    <h3>How to work</h3>
    <p>Assign roles (swap halfway): <strong>Reader</strong> (reads tasks aloud),
    <strong>Scribe</strong> (writes the group's answers), <strong>Skeptic</strong> (asks
    "do we all really agree? how do we know?"), <strong>Operator</strong> (handles
    ${med ? 'the models and the phone' : 'the phone'} – from Sheet 2).</p>
    <p><strong>The most important rule:</strong> for every task, each of you answers
    <em>alone first</em> – then compare and discuss your way to a group answer.</p>
  </div>

  <h2>Task 1 · Guess (without checking anywhere)</h2>
  <ol>
    <li>Where does Sweden rank among the EU's 27 countries in pump price?

        other until everyone is done:<br>
        <span class="writein"></span> <span class="writein"></span>
        <span class="writein"></span> <span class="writein"></span> <span class="writein"></span></li>
    <li>Guess the litre price in Sweden: <span class="writein"></span> SEK,
        and the EU average: <span class="writein"></span> SEK.</li>
    <li>Also guess: where does Sweden rank in <em>petrol tax</em>?
        (1 = lowest tax in the EU, 27 = highest). Your own guess: <span class="writein"></span></li>
  </ol>
  <div class="talk">Show each other your numbers. Why did they differ? What are your guesses
  based on? Agree on ONE group guess per question and write them down:
  rank <span class="writein" style="min-width:12mm"></span> ·
  price <span class="writein" style="min-width:12mm"></span> SEK ·
  EU average <span class="writein" style="min-width:12mm"></span> SEK ·
  tax rank <span class="writein" style="min-width:12mm"></span></div>
  ${next(2)}
  ${foot(1)}
</div>

<div class="sheet">
  <h1>Sheet 2 · Check reality – and find a problem</h1>
  <div class="badges"><span class="badge">${med ? 'Take out the map model' : 'Now the phone comes out'}</span></div>
  <h2>Task 2 · The map</h2>
  <div class="qrrow">
    <div class="qrtask">
      ${med
        ? `<p>Take the <strong>map model</strong>. Find Sweden with your finger. Height = price
           (1&nbsp;mm = 1&nbsp;SEK/litre). Compare Sweden's height with Germany, Denmark and
           Poland – feel it. Then flip the plate and scan the QR code on the underside: the
           same map, digital, with exact figures on hover.</p>`
        : `<p>Scan the code and open the <strong>3D map</strong>. Spin it, hover/click countries
           for exact figures. Find Sweden and compare with Germany, Denmark and Poland.</p>`}
      <p>Compare with your group's guesses from Sheet 1: rank? price? EU average?
      Who was closest – and how did they think?</p>
    </div>
    ${qrblock(link('&v=map&b=nom'), 'The map – pump price')}
  </div>
  <div class="talk">Most groups guess that Sweden ranks <em>high</em>. If you did too: where
  does that picture come from, do you think? Discuss for 2 minutes.</div>

  <h2>Task 3 · Is 17 kronor = 17 kronor?</h2>
  <p>Look at Bulgaria and Sweden on the map. ${fast
    ? `The litre price is nearly the same: <strong>16.84 SEK in Bulgaria, 15.96 SEK in Sweden</strong>.`
    : `The litre prices are often nearly the same (around ${FIX}: 16.84 SEK in Bulgaria, 15.96 in Sweden).`}
  But an average Bulgarian wage is about <strong>a third</strong> of a Swedish one, and most
  other things – rent, food, a haircut – are much cheaper there.</p>
  <ol>
    <li>Is filling up "equally expensive" in Bulgaria and Sweden? Each of you takes a silent
    stance: YES / NO / IT DEPENDS – plus one sentence why.</li>
    <li>Discuss: what more than the pump price would you need to know to compare
    <em>fairly</em>? List at least two things:<br>
    <span class="writein" style="min-width:70%"></span><br>
    <span class="writein" style="min-width:70%"></span></li>
    <li><strong>Invent your own measure:</strong> how would YOU calculate so that the
    comparison feels fair? Describe in words or as a formula (there is no answer key – yet):<br>
    <span class="writein" style="min-width:100%"></span><br>
    <span class="writein" style="min-width:100%"></span></li>
  </ol>
  <div class="talk">The Scribe writes the group's measure clearly enough that another group
  could compute with it. Keep it – you will compare it with the economists' standard measures

  ${next(3)}
  ${foot(2)}
</div>

<div class="sheet">
  <h1>Sheet 3 · Your measure meets the economists'</h1>
  <div class="badges"><span class="badge">Now you get the answer to Task 3</span></div>
  <p>Most groups propose bringing in <em>wages</em> or <em>what other things cost</em> in the
  country. If so – congratulations, you have just invented the core of the economists' two
  standard measures. Here they are for real:</p>

  <div class="fact">
    <h3>Measure 2 · Purchasing-power-adjusted price (PPP-SEK)</h3>
    <p>Eurostat measures each country's <strong>general price level</strong> – what a whole
    basket of goods (food, rent, services …) costs – with the EU average set to 100. Bulgaria
    sits at <strong>57</strong>, Sweden at <strong>123</strong>: a Bulgarian banknote buys
    about twice as much food, rent and haircuts as a Swedish one. <em>But it buys just as
    little petrol</em> – the litre costs nearly the same. The PPP measure expresses exactly that:</p>
    <p style="text-align:center"><code>PPP-SEK = price × (price level Sweden ÷ price level country)</code></p>
    <p>Bulgaria: 16.84 SEK × (123 ÷ 57) ≈ <strong>36 PPP-SEK</strong>. Read it like this:
    <strong>a litre takes as big a bite out of a Bulgarian's wallet as 36 kronor would out of
    a Swedish one.</strong> Nobody pays 36 SEK at any pump (the pump price is 16.84) – the
    figure translates the Bulgarian's burden into a Swedish yardstick. Sweden's own value is
    therefore always unchanged: it IS the yardstick.</p>
  </div>
  <div class="fact">
    <h3>Measure 3 · Time price</h3>
    <p>Even simpler: forget currency – count <strong>working time</strong>. How long does an
    average earner (net pay, i.e. after tax) work for ONE litre?</p>
    <p style="text-align:center"><code>time price = price in euros × 60 ÷ net hourly pay in euros</code></p>
    <p>Sweden: €1.45 ÷ €15.97/h ≈ <strong>5.5 minutes</strong> per litre.
    Romania: €1.80 ÷ €5.92/h ≈ <strong>18 minutes</strong>. The same litre – three times the work.</p>
  </div>

  <h2>Task 4 · Explore the new measures</h2>

    <div class="qrtask">

           bar width is population.</p>`}
      <ol>
        <li>Each of you silently picks <em>the country that moves the most</em> when the
        measure changes. Compare picks – why do those countries move?</li>
        <li>Compare with YOUR measure from Sheet 2: do the economists' measures capture the
        same thing? Is yours better at anything?</li>
      </ol>
    </div>
    ${qrblock(link('&v=curve&b=ppp'), 'Curve – PPP-adjusted')}
    ${qrblock(link('&v=curve&b=time'), 'Curve – time price')}
  </div>
  <div class="talk">Look at Romania in time-price mode: 18 minutes of work per litre, against
  our 5.5. Put into your own words what that means in everyday life for a Romanian family that
  needs the car – the Scribe writes the group's phrasing down.</div>
  ${next(4)}
  ${foot(3)}
</div>

<div class="sheet">
  <h1>Sheet 4 · The tax</h1>
  <div class="badges"><span class="badge">Your tax guess from Sheet 1 gets settled here</span></div>
  <h2>Task 5 · What actually separates the countries?</h2>
  <p>Recall your group's guess for Sweden's tax-league rank (Sheet 1):
  <span class="writein" style="min-width:12mm"></span>. Now check.</p>
  <div class="qrrow">
    <div class="qrtask">
      <p>Open <strong>Net + tax</strong> (first code): every bar splits into net price (blue,
      the price without tax) and tax (red). Then switch to <strong>Tax only</strong>
      (second code) – now the height is the tax alone.</p>
      <ol>
        <li>How similar are the blue net prices across the EU? Why is that, do you think?</li>
        <li>Where did Sweden land in the tax league? Was your guess right?</li>
        <li>What does the top of the tax league look like – which countries take the most?</li>
      </ol>
    </div>
    ${qrblock(link('&v=curve&c=tax'), 'Net + tax')}
    ${qrblock(link('&v=curve&c=taxonly'), 'Tax only')}
  </div>
  <div class="talk">Surprised? The Skeptic's turn: <em>could the figures be wrong or biased?</em>
  Whose data is this (look at the bottom of the site), and how could you check it against
  another source? Discuss for 3 minutes – asking "how do we know this?" is half the exercise.</div>
  ${next(5)}
  ${foot(4)}
</div>

<div class="sheet">
  <h1>Sheet 5 · What does it mean?</h1>
  <div class="badges"><span class="badge">Last sheet – discussion and the group's answer</span></div>
  <div class="fact">
    <h3>Fact box · Almost everything that differs is politics</h3>
    <p>Petrol is bought on the same world market, so net prices are nearly equal across the EU
    (Sweden ${NE.seNet} SEK ${fast ? '' : 'on ' + FIX}). What separates countries is tax:
    energy tax + carbon tax + VAT. ${fast ? `On ${FIX} Sweden had the EU's LOWEST petrol tax
    (${NE.seSkatt} SEK/l; average ${NE.euSkatt}, highest the Netherlands ≈ ${NE.nlSkatt}).`
    : `As of ${FIX} Sweden had the EU's lowest petrol tax (${NE.seSkatt} SEK/l against the
    average ${NE.euSkatt}) – did that still hold when you checked?`}</p>
  </div>
  <div class="talk">Discuss – the Skeptic leads, the Scribe records:
  (a) What is the purpose of petrol tax? Roads? Climate? The treasury?
  (b) If Sweden raised the tax by 3 SEK – where would we land in the price league and the tax
  league? (c) Who benefits when the debate uses the pump price – and who when it uses the
  time price?
  ${ST.datum === 'aktuell' ? "(d) You used today's data: compare with the fact boxes' figures from " + FIX + ' – what changed, and can you figure out why?' : ''}</div>

  <h2>Task 6 · A fourth measure: the political distance</h2>
  <div class="qrrow">
    <div class="qrtask">
      <p>Point/hover at a country in the curve and the line <em>"To the EU average: ±X% tax"</em>
      appears – how much that country's petrol tax would need to change for its price to land
      on the EU average. Since net prices are nearly equal (Sheet 4!), the distance to the
      average is in practice pure tax policy. Fill in the table – same countries, two bases:</p>
      <table class="mini">
        <tr><th></th><th>Nominal</th><th>Time price</th></tr>
        <tr><td>Sweden</td><td><span class="writein" style="min-width:14mm"></span> %</td>
            <td><span class="writein" style="min-width:14mm"></span> %</td></tr>
        <tr><td>Romania</td><td><span class="writein" style="min-width:14mm"></span> %</td>
            <td><span class="writein" style="min-width:14mm"></span> %</td></tr>
      </table>
    </div>
    ${qrblock(link('&v=curve&b=nom'), 'Curve – nominal')}
    ${qrblock(link('&v=curve&b=time'), 'Curve – time price')}
  </div>
  <div class="talk">Compare the columns. Does the answer to "should the tax go up or down?"
  depend on the measure? For which country does the answer change <em>sign</em>? What does
  that mean for political proposals that cite "the EU average" – can both sides of a debate
  be right, depending on the measure?</div>

  <h2>Wrap-up · Agree or disagree</h2>
  <p>The group's answer to <strong>"Is petrol cheap or expensive in Sweden?"</strong> – each
  of you justifies with ONE measure of your choice (feel free to use your own from Sheet 2!),
  the Scribe records:</p>
  <p><span class="writein" style="min-width:100%"></span></p>
  <p><span class="writein" style="min-width:100%"></span></p>
  <p>If you disagree: write down <em>why</em>. Well-argued disagreement is as good a result
  as agreement.</p>
  ${foot(5)}
</div>

<div class="sheet">
  <h1>Sheet 6 · Extension: What does the car year cost?</h1>
  <div class="badges"><span class="badge">Optional – calculator needed</span>
  <span class="badge">Prices as of ${FIX}</span></div>
  <p>One litre doesn't tell the whole story – people drive different distances in different
  countries. Now you compute what <em>a year of petrol</em> costs an average car owner, in
  money and in working time.</p>
  <div class="fact">
    <h3>Data (sources: Trafikanalys 2024 [SE], Odyssee-Mure 2023 / Eurostat 2024; wages Eurostat 2024)</h3>
    <table class="mini">
      <tr><th>Country</th><th>Distance per car</th><th>Petrol price</th><th>Net hourly pay</th></tr>
      <tr><td><strong>Sweden</strong></td><td>11,410 km/yr</td><td>€1.45/l</td><td>€15.97/h</td></tr>
      <tr><td><strong>Germany</strong></td><td>12,449 km/yr</td><td>€2.18/l</td><td>€14.49/h</td></tr>
      <tr><td><strong>Romania</strong>*</td><td>6,097 km/yr</td><td>€1.80/l</td><td>€5.92/h</td></tr>
      <tr><td>Denmark*</td><td>14,844 km/yr</td><td>€2.46/l</td><td>€19.32/h</td></tr>
      <tr><td>Poland</td><td>12,216 km/yr</td><td>€1.76/l</td><td>€7.23/h</td></tr>
      <tr><td>Ireland</td><td>16,726 km/yr</td><td>€1.82/l</td><td>€20.37/h</td></tr>
      <tr><td>Italy</td><td>8,030 km/yr</td><td>€1.99/l</td><td>€11.52/h</td></tr>
    </table>
    <p><strong>Assumption:</strong> the average car uses 6.85 l/100 km in every country
    (the EU fleet average 2023 per Odyssee; new cars use 5–6). Exchange rate: 10.98 SEK/€.
    Rows marked * are derived from Eurostat (traffic ÷ stock) and less certain.</p>
  </div>
  <h2>Task · Compute for Sweden, Germany and Romania</h2>
  <p>Split the countries between you and compute in four steps (round freely):</p>
  <ol>
    <li><strong>Litres per year</strong> = distance ÷ 100 × 6.85 →
        SE <span class="writein" style="min-width:16mm"></span> l ·
        DE <span class="writein" style="min-width:16mm"></span> l ·
        RO <span class="writein" style="min-width:16mm"></span> l</li>
    <li><strong>Euros per year</strong> = litres × price →
        SE <span class="writein" style="min-width:16mm"></span> € ·
        DE <span class="writein" style="min-width:16mm"></span> € ·
        RO <span class="writein" style="min-width:16mm"></span> €</li>
    <li><strong>SEK per year</strong> = euros × 10.98 →
        SE <span class="writein" style="min-width:16mm"></span> ·
        DE <span class="writein" style="min-width:16mm"></span> ·
        RO <span class="writein" style="min-width:16mm"></span></li>
    <li><strong>Working hours per year</strong> = euros ÷ hourly pay →
        SE <span class="writein" style="min-width:16mm"></span> h ·
        DE <span class="writein" style="min-width:16mm"></span> h ·
        RO <span class="writein" style="min-width:16mm"></span> h</li>
  </ol>
  <div class="talk">The German drives twice as far as the Romanian – yet compare their working
  hours. What happened? And Sweden? Then check your results against the ready-made view
  (QR code): are your numbers roughly right?</div>
  <div class="qrrow">
    <div class="qrtask">
      <div class="talk">Last question – the Skeptic's favourite: the model assumes the same consumption (6.85 l/100 km, an EU average)
      for ALL countries, treats everything as petrol cars (no diesels or EVs) and uses average
      wages. <strong>Which assumption is weakest?</strong> How would the result change if you
      fixed it?</div>
    </div>
    ${qrblock(link('&v=curve&b=yearnom'), 'Answer key: annual cost (SEK/yr)')}
    ${qrblock(link('&v=curve&b=year'), 'Answer key: annual work time (h/yr)')}
  </div>
  ${foot(6)}
</div>`;
}

  <p><strong>Sheet 5 task 6 answer key</strong> (tax change to the EU average, ${FIX}):
  Sweden +115% nominal but <strong>+307%</strong> in time price; Romania +17% nominal but
  <strong>−86%</strong> in time price – the answer changes sign! This is the session's
  methodological point in a nutshell: "harmonising with the EU average" is not one political
  proposal but several, depending on which fairness measure is meant. Ideally let the groups
  articulate this themselves before you say it.</p>
  <p><strong>Common student measures in Sheet 2 task 3</strong> (all are "right"): compare with
  wages (→ time price), compare with what other things cost (→ PPP), share of monthly pay
  (→ Sheet 6/annual work time), compare with minimum or median wage (better than our mean
  measure – praise it!). Groups proposing the median deserve extra credit: the tool uses mean
  wages and declares that as a weakness.</p>
  <p><strong>Expected aha moments:</strong> (1) Sweden ranks second lowest, not high – most
  guess rank 15–25. (2) Sweden has the EU's lowest petrol tax. (3) The time price flips the
  map: cheapest in the east becomes dearest.</p>

  <h2>Phrasing support: PPP without getting lost</h2>
  <p>The PPP price is <em>not</em> what a Swedish tourist pays in Romania. It is the petrol
  price relative to the country's <em>general price level</em>, restated at Swedish price
  levels: "if petrol in Sweden were as expensive <em>relative to everything else</em> as it
  is in Romania, it would cost ${NE.roPpp} SEK". A good student phrasing to aim for: "petrol
  is expensive <em>for Romanians</em>, because everything else they buy is cheap but petrol
  is not." The time price says the same thing even more simply: ${NE.roTid} minutes of work
  per litre against our ${NE.seTid}.</p>

  <h2>Common misconceptions</h2>
  <ul>
    <li><em>"Sweden has Europe's most expensive petrol."</em> Not true in any of the measures
    (${FIX}). Let the claim meet the data – and show how to verify it.</li>
    <li><em>"PPP = what it costs me as a tourist."</em> No – see the phrasing support.</li>
    <li><em>"Average pay = typical pay."</em> The mean overstates the typical earner in
    countries with skewed distributions; low-wage countries' time prices are then
    <em>understated</em>. (Declared under About/Method in the tool.)</li>
    <li><em>"Ireland's low time price is a GDP artefact."</em> A partly fair objection – but
    the measure uses actual net earnings (Eurostat), not GDP. Irish average wages are
    genuinely high, though pulled up by the multinational sector.</li>
  </ul>

  <h2>Differentiation</h2>
  <ul>
    <li><strong>Fast groups:</strong> the extra task (share of pay), the diesel question, or:
    "redesign the Swedish petrol tax – which goals do you trade off?"</li>
    <li><strong>Struggling groups:</strong> tasks 1, 2 and 4 only – the core is
    guess → reality → the role of tax.</li>
    <li><strong>History:</strong> the QR code opens the history view – what happened in 2022?
    (The war in Ukraine + temporary tax cuts.)</li>
  </ul>
  <div class="qrrow">
    ${qrblock(link('&v=hist'), 'History 2005–now')}
    ${qrblock(BASE + '&v=teach', 'Teaching tab (more material)')}
    ${qrblock(BASE + '&v=print3d', '3D printing (export & colours)')}
  </div>
  <div class="foot">Teacher's guide · Petrol prices in the EU · ${SITE} · Sheet 2/2</div>
</div>`;
}

/* ------------------------------ rendering ------------------------------ */
function render() {
  document.documentElement.lang = ST.lang;
  const sv = ST.lang === 'sv';
  document.title = (ST.doc === 'larare' ? (sv ? 'Lärarhandledning' : "Teacher's guide")
                                        : (sv ? 'Arbetsblad' : 'Worksheet')) +
                   ' – Bensinpriser i EU';
  document.getElementById('tb_title').textContent = document.title;
  document.getElementById('docSel').value = ST.doc;
  document.getElementById('varSel').value = ST.variant;
  document.getElementById('datSel').value = ST.datum;
  document.getElementById('langSel').value = ST.lang;
  document.getElementById('docSel').options[0].text = sv ? 'Elevblad' : 'Student sheet';
  document.getElementById('docSel').options[1].text = sv ? 'Lärarhandledning' : "Teacher's guide";
  document.getElementById('varSel').options[0].text = sv ? 'Med 3D-modeller' : 'With 3D models';
  document.getElementById('varSel').options[1].text = sv ? 'Utan 3D-modeller' : 'Without 3D models';
  document.getElementById('datSel').options[0].text = (sv ? 'Fast (' : 'Fixed (') + FIX + ')';
  document.getElementById('datSel').options[1].text = sv ? 'Dagens data' : "Today's data";
  document.getElementById('printBtn').textContent = sv ? 'Skriv ut / spara som PDF' : 'Print / save as PDF';
  const body = ST.doc === 'larare'
    ? (sv ? teacherSV() : teacherEN())
    : (sv ? studentSV() : studentEN());
  document.getElementById('pages').innerHTML = body;
  const q = new URLSearchParams({ doc: ST.doc, variant: ST.variant, datum: ST.datum, lang: ST.lang });
  history.replaceState(null, '', '?' + q.toString());
}
for (const [id, key] of [['docSel', 'doc'], ['varSel', 'variant'], ['datSel', 'datum'], ['langSel', 'lang']]) {
  document.getElementById(id).addEventListener('change', ev => { ST[key] = ev.target.value; render(); });
}
render();
</script>
