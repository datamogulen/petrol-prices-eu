<!DOCTYPE html>

          padding: 2.4mm 3.6mm; margin: 2.5mm 0; }

             page-break-after: always; padding: 0; }
    .sheet:last-child { page-break-after: auto; }
    @page { size: A4; margin: 12mm 14mm; }
    .foot { position: static; margin-top: 6mm; }

</div>

<script>
'use strict';
/* =====================================================================
 *  QR-encoder – kopia av den testade implementationen i index.html
 *  (byte-läge, ECC L, mask 0, version 1–4). Kanonisk kopia + tester
 *  ligger i index.html/test/stl_check.js; ändra där först.
 * ===================================================================== */
function qrMatrix(text) {
  const bytes = [];
  for (const ch of text) {
    const c = ch.codePointAt(0);
    if (c > 255) throw new Error('QR: endast Latin-1-tecken');
    bytes.push(c);
  }
  const CAP = { 1: [26, 19], 2: [44, 34], 3: [70, 55], 4: [100, 80] };
  let ver = 0;
  for (const v of [1, 2, 3, 4]) if (bytes.length <= CAP[v][1] - 2) { ver = v; break; }
  if (!ver) throw new Error('QR: texten är för lång (' + bytes.length + ' tecken)');
  const [total, dataLen] = CAP[ver], eccLen = total - dataLen;
  const bits = [];
  const push = (val, n) => { for (let i = n - 1; i >= 0; i--) bits.push((val >> i) & 1); };
  push(4, 4); push(bytes.length, 8);
  for (const b of bytes) push(b, 8);
  push(0, Math.min(4, dataLen * 8 - bits.length));
  while (bits.length % 8) bits.push(0);
  const data = [];
  for (let i = 0; i < bits.length; i += 8) {
    let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j];
    data.push(b);
  }
  const PAD = [0xEC, 0x11];
  for (let i = 0; data.length < dataLen; i ^= 1) data.push(PAD[i]);
  const EXP = new Array(512), LOG = new Array(256);
  for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 0x100) x ^= 0x11D; }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
  let gen = [1];
  for (let i = 0; i < eccLen; i++) {
    const q = [1, EXP[i]], r = new Array(gen.length + 1).fill(0);
    for (let a = 0; a < gen.length; a++) for (let b = 0; b < 2; b++) r[a + b] ^= mul(gen[a], q[b]);
    gen = r;
  }
  const rem = data.concat(new Array(eccLen).fill(0));
  for (let i = 0; i < dataLen; i++) {
    const f = rem[i];
    if (f) for (let j = 0; j < gen.length; j++) rem[i + j] ^= mul(gen[j], f);
  }
  const cw = data.concat(rem.slice(dataLen));
  const size = 17 + 4 * ver;
  const M = Array.from({ length: size }, () => new Array(size).fill(null));
  const set = (x, y, v) => { M[y][x] = v; };
  const finder = (fx, fy) => {
    for (let y = -1; y <= 7; y++) for (let x = -1; x <= 7; x++) {
      const gx = fx + x, gy = fy + y;
      if (gx < 0 || gx >= size || gy < 0 || gy >= size) continue;
      const inC = x >= 0 && x <= 6 && y >= 0 && y <= 6;
      set(gx, gy, inC && (x === 0 || x === 6 || y === 0 || y === 6 ||
                          (x >= 2 && x <= 4 && y >= 2 && y <= 4)) ? 1 : 0);
    }
  };
  finder(0, 0); finder(size - 7, 0); finder(0, size - 7);
  for (let i = 8; i < size - 8; i++) {
    if (M[6][i] === null) M[6][i] = i % 2 === 0 ? 1 : 0;
    if (M[i][6] === null) M[i][6] = i % 2 === 0 ? 1 : 0;
  }
  if (ver >= 2) {
    const c = size - 7;
    for (let y = -2; y <= 2; y++) for (let x = -2; x <= 2; x++)
      set(c + x, c + y, Math.max(Math.abs(x), Math.abs(y)) !== 1 ? 1 : 0);
  }
  const fmt = (0b01 << 3) | 0;
  let bch = fmt;
  for (let i = 0; i < 10; i++) bch = (bch << 1) ^ ((bch >> 9) * 0x537);
  const fbits = ((fmt << 10) | bch) ^ 0x5412;
  const fbit = i => (fbits >> i) & 1;
  for (let i = 0; i <= 5; i++) set(8, i, fbit(i));
  set(8, 7, fbit(6)); set(8, 8, fbit(7)); set(7, 8, fbit(8));
  for (let i = 9; i < 15; i++) set(14 - i, 8, fbit(i));
  for (let i = 0; i < 8; i++) set(size - 1 - i, 8, fbit(i));
  for (let i = 8; i < 15; i++) set(8, size - 15 + i, fbit(i));
  set(8, size - 8, 1);
  let bi = 0; const totalBits = cw.length * 8;
  for (let right = size - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < size; vert++) {
      for (let j = 0; j < 2; j++) {
        const x = right - j;
        const upward = ((right + 1) & 2) === 0;
        const y = upward ? size - 1 - vert : vert;
        if (M[y][x] !== null) continue;
        let bit = 0;
        if (bi < totalBits) { bit = (cw[bi >> 3] >> (7 - (bi & 7))) & 1; bi++; }
        if ((x + y) % 2 === 0) bit ^= 1;
        M[y][x] = bit;
      }
    }
  }
  return { size, get: (x, y) => M[y][x] === 1 };
}
function qrSVG(url) {
  const q = qrMatrix(url), n = q.size, quiet = 2, dim = n + 2 * quiet;
  let rects = '';
  for (let y = 0; y < n; y++) {
    let run = -1;
    for (let x = 0; x <= n; x++) {
      const on = x < n && q.get(x, y);
      if (on && run < 0) run = x;
      if (!on && run >= 0) {
        rects += `<rect x="${run + quiet}" y="${y + quiet}" width="${x - run}" height="1.02"/>`;
        run = -1;
      }
    }
  }
  return `<svg viewBox="0 0 ${dim} ${dim}" xmlns="http://www.w3.org/2000/svg">` +
         `<rect width="${dim}" height="${dim}" fill="#fff"/><g fill="#000">${rects}</g></svg>`;
}

/* ===================================================================== */
const P = new URLSearchParams(location.search);
const ST = {
  doc: ['elev', 'larare'].includes(P.get('doc')) ? P.get('doc') : 'elev',
  variant: ['med3d', 'utan3d'].includes(P.get('variant')) ? P.get('variant') : 'med3d',
  datum: ['fast', 'aktuell'].includes(P.get('datum')) ? P.get('datum') : 'fast',
  lang: ['sv', 'en'].includes(P.get('lang')) ? P.get('lang')
      : (navigator.language || 'sv').toLowerCase().startsWith('sv') ? 'sv' : 'en',
};
const FIX = '2026-08-03';
const BASE = 'https://hedin.it/r/?p=ppeu';
function link(params) {   // params utan datum; fast läge lägger till d=
  let u = BASE + params;
  if (ST.datum === 'fast') u += '&d=' + FIX;
  return u;
}
const SITE = 'hedin.it/petrol-prices-eu';

/* Verifierade nyckeltal för det fasta datumet 2026-08-03 (bensin 95). */
const N = {
  seNom: '15,96', mtNom: '14,72', euNom: '21,43',
  sePpp: '15,96', luPpp: '15,31', euPpp: '27,74', roPpp: '42,4',
  seTid: '5,5', luTid: '4,1', ieTid: '5,3', euTid: '10,5', roTid: '18',
  seNet: '11,19', seSkatt: '4,76', euSkatt: '10,44', nlSkatt: '13,8',
  seDiesel: '20,05', euDiesel: '22,64',
};
const NE = {};   // engelska decimalpunkter
for (const k of Object.keys(N)) NE[k] = N[k].replace(',', '.');

function qrblock(url, caption) {
  return `<div class="qrbox">${qrSVG(url)}${caption}</div>`;
}

/* ===================================================================== *
 *  INNEHÅLL                                                             *
 * ===================================================================== */
function studentSV() {
  const med = ST.variant === 'med3d';
  const fast = ST.datum === 'fast';
  const datumTxt = fast ? `priser för veckan ${FIX}` : 'dagens senaste priser (bilden kan skilja sig från faktarutorna!)';
  return `
<div class="sheet">
  <h1>Vad kostar bensinen – egentligen?</h1>
  <div class="badges">
    <span class="badge">${med ? 'Med 3D-modeller' : 'Utan 3D-modeller (mobil räcker)'}</span>
    <span class="badge">${fast ? 'Fast datum: ' + FIX : 'Dagens data'}</span>
    <span class="badge">Grupp om 4–5</span>
  </div>
  <p>Ni ska undersöka bensinpriser i EU:s 27 länder och upptäcka att svaret på
  "är bensinen dyr i Sverige?" beror på <em>hur man mäter</em>. Ni använder ${datumTxt}.</p>

  <div class="fact">
    <h3>Så jobbar ni</h3>
    <p>Utse roller (byt gärna halvvägs): <strong>Uppläsare</strong> (läser uppgifterna högt),
    <strong>Sekreterare</strong> (skriver gruppens svar), <strong>Skeptiker</strong> (frågar
    "håller alla verkligen med? hur vet vi det?"), <strong>Tekniker</strong> (sköter
    ${med ? 'modellerna och mobilen' : 'mobilen'}).</p>
    <p><strong>Viktigaste regeln:</strong> vid varje uppgift gissar/svarar var och en
    <em>själv först</em> – sedan jämför ni och diskuterar er fram till ett gruppsvar.
    Titta aldrig i facit/verktyget före gissningen!</p>
  </div>

  <h2>Uppgift 1 · Gissa först (5 min – inga hjälpmedel!)</h2>
  <ol>
    <li>Var ligger Sverige bland EU:s 27 länder i bensinpris vid pumpen?
        (1 = billigast, 27 = dyrast). Var och en skriver sin siffra: <span class="writein"></span></li>
    <li>Gissa literpriset i Sverige: <span class="writein"></span> kr,
        och EU-genomsnittet: <span class="writein"></span> kr.</li>
  </ol>
  <div class="talk">Jämför era gissningar. Varför gissade ni olika? Enas om EN gruppgissning
  på placeringen innan ni går vidare – och skriv upp den: <span class="writein"></span></div>

  <h2>Uppgift 2 · Kolla verkligheten (10 min)</h2>
  <div class="qrrow">
    <div class="qrtask">
      ${med
        ? `<p>Ta fram <strong>kartmodellen</strong>. Hitta Sverige med fingret. Höjd = pris
           (1&nbsp;mm = 1&nbsp;kr/liter). Jämför Sveriges höjd med Tysklands, Danmarks och Polens
           – känn med fingertopparna. Vänd sedan på plattan och skanna QR-koden på undersidan:
           där finns exakt samma karta digitalt, med exakta siffror när ni hovrar.</p>`
        : `<p>Skanna koden och öppna <strong>3D-kartan</strong>. Snurra med fingret, hovra/klicka
           på länder för exakta siffror. Hitta Sverige och jämför med Tyskland, Danmark och Polen.</p>`}
      <p>Hur nära låg gruppens gissning? Vem i gruppen var närmast?</p>
    </div>
    ${qrblock(link('&v=map&b=nom'), 'Kartan – pris vid pumpen')}
  </div>
  <div class="talk">De flesta gissar att Sverige ligger <em>högt</em>. Om ni också gjorde det:
  varifrån kommer den bilden? Nyheter? Vuxna? Sociala medier? Diskutera 2 minuter.</div>

  <div class="fact">
    <h3>Faktaruta 1 · Tre sätt att mäta "dyrt"</h3>
    <table class="mini">
      <tr><th>Mått</th><th>Betyder</th><th>Sverige ${fast ? FIX : '(' + FIX + ')'}</th></tr>
      <tr><td><strong>Rakt pris</strong></td><td>kr/liter vid pumpen, i svenska kronor</td>
          <td>${N.seNom} kr (näst lägst i EU – bara Malta lägre; snittet ${N.euNom} kr)</td></tr>
      <tr><td><strong>PPP-justerat</strong></td><td>priset i förhållande till landets allmänna
          prisnivå, uttryckt i svensk prisnivå</td>
          <td>${N.sePpp} kr (näst lägst – bara Luxemburg lägre; snittet ${N.euPpp} kr)</td></tr>
      <tr><td><strong>Tidpris</strong></td><td>minuter en genomsnittlig löntagare (nettolön)
          arbetar för en liter</td>
          <td>${N.seTid} min (tredje lägst; snittet ${N.euTid} min)</td></tr>
    </table>
    <p>Tidpris = pris i euro × 60 ÷ nettotimlön i euro. Nettolön = lön efter skatt –
    det är de pengarna man faktiskt kan tanka för.</p>
  </div>
  <div class="foot">Bensinpriser i EU · ${SITE} · Källa: European Commission Weekly Oil Bulletin (CC BY-NC-ND) · Löner &amp; prisnivåer: Eurostat · Blad 1/2</div>
</div>

<div class="sheet">
  <h2>Uppgift 3 · Byt mått – byt karta (10 min)</h2>
  <div class="qrrow">
    <div class="qrtask">
      ${med
        ? `<p>Ta fram de två <strong>kurvremsorna</strong> (rakt pris och tidpris). Håll en i
           varje hand. Varje land är ett trappsteg; bredden är landets befolkning
           (1&nbsp;mm = 2 miljoner människor), höjden är priset. Känn skillnaden i form!
           Skanna QR-koderna på undersidorna om ni vill se exakta siffror.</p>`
        : `<p>Öppna priskurvan i de två lägena (koderna här intill). Länderna är sorterade
           billigast → dyrast; bredden är landets befolkning (så ni ser hur många människor
           som lever på varje prisnivå).</p>`}
      <p>Var och en väljer tyst ut <em>ett land som byter plats mest</em> mellan måtten.
      Jämför sedan era val.</p>
    </div>
    ${qrblock(link('&v=curve&b=ppp'), 'Kurvan – PPP-justerat')}
    ${qrblock(link('&v=curve&b=time'), 'Kurvan – tidpris')}
  </div>
  <div class="talk">I PPP-läget kostar Rumäniens bensin ${fast ? N.roPpp : 'över 40'} "svenska
  prisnivå-kronor". Det betyder INTE att en svensk turist betalar så vid rumänsk pump. Vad
  betyder det då – för en rumän? (Ledtråd: jämför med vad allt annat kostar där. Tänk på
  tidpriset: ${fast ? N.roTid : '~18'} minuters arbete per liter, mot våra ${fast ? N.seTid : '~5,5'}.)
  Enas om en förklaring med egna ord – Sekreteraren skriver ner den.</div>

  <h2>Uppgift 4 · Skatten – det som faktiskt skiljer (10 min)</h2>
  <div class="qrrow">
    <div class="qrtask">
      <p>Byt färgläge till <strong>Netto + skatt</strong> (första koden): nu delas varje stapel
      i nettopris (blått) och skatt (rött). Byt sedan till <strong>Enbart skatt</strong>
      (andra koden).</p>
      <ol>
        <li>Hur lika är de blå nettopriserna över EU? Varför är det så, tror ni?</li>
        <li>Var ligger Sverige i <em>skatteligan</em>? Gissa först – kolla sedan!</li>
      </ol>
    </div>
    ${qrblock(link('&v=curve&c=tax'), 'Netto + skatt')}
    ${qrblock(link('&v=curve&c=taxonly'), 'Enbart skatt')}
  </div>
  <div class="fact">
    <h3>Faktaruta 2 · Nästan allt som skiljer är politik</h3>
    <p>Bensin köps på samma världsmarknad, så nettopriserna är nästan lika i hela EU
    (${fast ? `Sverige ${N.seNet} kr` : `Sverige ca ${N.seNet} kr ${FIX}`}). Det som skiljer
    länderna åt är skatten: energiskatt + koldioxidskatt + moms.
    ${fast ? `Den ${FIX} hade Sverige EU:s LÄGSTA bensinskatt (${N.seSkatt} kr/l; snittet
    ${N.euSkatt}, högst Nederländerna ≈ ${N.nlSkatt}).` : `Vid ${FIX} hade Sverige EU:s lägsta
    bensinskatt (${N.seSkatt} kr/l mot snittets ${N.euSkatt}) – kolla om det fortfarande stämmer!`}</p>
  </div>
  <div class="talk">Diskutera – låt Skeptikern leda: (a) Vad är bensinskattens syfte? Vägar?
  Klimat? Statskassan? (b) Om Sverige höjde skatten 3 kr – var skulle vi hamna i prisligan
  och i skatteligan? (c) Vem tjänar på att debatten använder pumppriset – och vem på att den
  använder tidpriset? ${ST.datum === 'aktuell' ? '(d) Jämför dagens siffror med faktarutorna från ' + FIX + ' – vad har ändrats, och kan ni komma på varför?' : ''}</div>

  <h2>Avslutning · Enas eller oenas (5 min)</h2>
  <p>Gruppens svar på frågan <strong>"Är bensinen billig eller dyr i Sverige?"</strong> –
  var och en motiverar med ETT valfritt mått, Sekreteraren antecknar:</p>
  <p><span class="writein" style="min-width:100%"></span></p>
  <p><span class="writein" style="min-width:100%"></span></p>
  <p>Om ni inte är eniga: skriv <em>varför</em>. Väl motiverad oenighet är ett lika bra
  resultat som enighet.</p>

  <div class="fact">
    <h3>Extra (om ni hinner) · Hur stor del av lönen?</h3>
    <p>Årskostnadens andel av lönen ≈ körsträcka (km/år) × förbrukning (l/km) × pris (€/l)
    ÷ nettoårslön (€). Sverige: ca 11 000 km × 0,065 l/km × 1,45 € ÷ 33 200 € ≈ <strong>3 %</strong>.
    Räkna samma sak med Bulgariens pris (~1,74 €) och nettoårslön (~11 900 €). Vad blir det?
    Stämmer bilden med tidpriset? ${med ? 'Skatteligan finns också som utskrivbar modell – fråga läraren.' : ''}</p>
  </div>
  <div class="foot">Bensinpriser i EU · ${SITE} · Källa: European Commission Weekly Oil Bulletin (CC BY-NC-ND) · Löner &amp; prisnivåer: Eurostat · Blad 2/2</div>
</div>`;
}

function teacherSV() {
  const med = ST.variant === 'med3d';
  const fast = ST.datum === 'fast';
  return `
<div class="sheet">
  <h1>Lärarhandledning · Vad kostar bensinen – egentligen?</h1>
  <div class="badges">
    <span class="badge warn">Endast för läraren</span>
    <span class="badge">${med ? 'Variant: med 3D-modeller' : 'Variant: utan 3D-modeller'}</span>
    <span class="badge">${fast ? 'Fast datum: ' + FIX : 'Dagens data'}</span>

  <p>PPP-priset är <em>inte</em> vad en svensk turist betalar i Rumänien. Det är bensinpriset

  <h2>Phrasing support: PPP without getting lost</h2>
  <p>The PPP price is <em>not</em> what a Swedish tourist pays in Romania. It is the petrol
  price relative to the country's <em>general price level</em>, restated at Swedish price
  levels: "if petrol in Sweden were as expensive <em>relative to everything else</em> as it
  is in Romania, it would cost ${NE.roPpp} SEK". A good student phrasing to aim for: "petrol
  is expensive <em>for Romanians</em>, because everything else they buy is cheap but petrol
  is not." The time price says the same thing even more simply: ${NE.roTid} minutes of work
  per litre against our ${NE.seTid}.</p>

  <h2>Common misconceptions</h2>
  <ul>
    <li><em>"Sweden has Europe's most expensive petrol."</em> Not true in any of the measures
    (${FIX}). Let the claim meet the data – and show how to verify it.</li>
    <li><em>"PPP = what it costs me as a tourist."</em> No – see the phrasing support.</li>
    <li><em>"Average pay = typical pay."</em> The mean overstates the typical earner in
    countries with skewed distributions; low-wage countries' time prices are then
    <em>understated</em>. (Declared under About/Method in the tool.)</li>
    <li><em>"Ireland's low time price is a GDP artefact."</em> A partly fair objection – but
    the measure uses actual net earnings (Eurostat), not GDP. Irish average wages are
    genuinely high, though pulled up by the multinational sector.</li>
  </ul>

  <ul>
    <li><strong>Fast groups:</strong> the extra task (share of pay), the diesel question, or:
    "redesign the Swedish petrol tax – which goals do you trade off?"</li>
    <li><strong>Struggling groups:</strong> tasks 1, 2 and 4 only – the core is
    guess → reality → the role of tax.</li>
    <li><strong>History:</strong> the QR code opens the history view – what happened in 2022?
    (The war in Ukraine + temporary tax cuts.)</li>
  </ul>
  <div class="qrrow">
    ${qrblock(link('&v=hist'), 'History 2005–now')}
    ${qrblock(BASE + '&v=teach', 'Teaching tab (more material)')}
    ${qrblock(BASE + '&v=print3d', '3D printing (export & colours)')}
  </div>
  <div class="foot">Teacher's guide · Petrol prices in the EU · ${SITE} · Sheet 2/2</div>
</div>`;
}

/* ------------------------------ rendering ------------------------------ */
function render() {
  document.documentElement.lang = ST.lang;
  const sv = ST.lang === 'sv';
  document.title = (ST.doc === 'larare' ? (sv ? 'Lärarhandledning' : "Teacher's guide")
                                        : (sv ? 'Arbetsblad' : 'Worksheet')) +
                   ' – Bensinpriser i EU';
  document.getElementById('tb_title').textContent = document.title;
  document.getElementById('docSel').value = ST.doc;
  document.getElementById('varSel').value = ST.variant;
  document.getElementById('datSel').value = ST.datum;
  document.getElementById('langSel').value = ST.lang;
  document.getElementById('docSel').options[0].text = sv ? 'Elevblad' : 'Student sheet';
  document.getElementById('docSel').options[1].text = sv ? 'Lärarhandledning' : "Teacher's guide";
  document.getElementById('varSel').options[0].text = sv ? 'Med 3D-modeller' : 'With 3D models';
  document.getElementById('varSel').options[1].text = sv ? 'Utan 3D-modeller' : 'Without 3D models';
  document.getElementById('datSel').options[0].text = (sv ? 'Fast (' : 'Fixed (') + FIX + ')';
  document.getElementById('datSel').options[1].text = sv ? 'Dagens data' : "Today's data";
  document.getElementById('printBtn').textContent = sv ? 'Skriv ut / spara som PDF' : 'Print / save as PDF';
  const body = ST.doc === 'larare'
    ? (sv ? teacherSV() : teacherEN())
    : (sv ? studentSV() : studentEN());
  document.getElementById('pages').innerHTML = body;
  const q = new URLSearchParams({ doc: ST.doc, variant: ST.variant, datum: ST.datum, lang: ST.lang });
  history.replaceState(null, '', '?' + q.toString());
}
for (const [id, key] of [['docSel', 'doc'], ['varSel', 'variant'], ['datSel', 'datum'], ['langSel', 'lang']]) {
  document.getElementById(id).addEventListener('change', ev => { ST[key] = ev.target.value; render(); });
}
render();
</script>
</body>
</html>
